<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вітрувій • ЕНТРОПІЯ — Біолюмінесцентне Видання v11.2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #05090f;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    @keyframes diceTumble {
      0%   { transform: translateY(-32px) rotateX(180deg) rotateZ(-30deg) scale(0.65); opacity: 0.25; }
      50%  { transform: translateY(8px) rotateX(-15deg) rotateZ(15deg) scale(1.06); opacity: 1; }
      80%  { transform: translateY(-4px) rotateX(8deg) rotateZ(-4deg) scale(0.98); opacity: 1; }
      100% { transform: translateY(0) rotateX(0deg) rotateZ(0deg) scale(1); opacity: 1; }
    }
    @keyframes diceSpinContinuous {
      0%   { transform: rotate(0deg) scale(0.9); }
      50%  { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(0.9); }
    }
    .dice-land {
      animation: diceTumble 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .dice-rolling-spin {
      animation: diceSpinContinuous 0.36s linear infinite;
    }
    .striped-disabled {
      background: repeating-linear-gradient(
        45deg,
        rgba(20, 35, 50, 0.35),
        rgba(20, 35, 50, 0.35) 5px,
        rgba(10, 18, 30, 0.85) 5px,
        rgba(10, 18, 30, 0.85) 10px
      );
    }
    @keyframes bioPulseGlow {
      0%, 100% {
        filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.55)) drop-shadow(0 0 14px rgba(16, 185, 129, 0.35));
        opacity: 0.82;
      }
      50% {
        filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.9)) drop-shadow(0 0 24px rgba(163, 230, 53, 0.55));
        opacity: 1;
      }
    }
    @keyframes vineSway {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50%      { transform: rotate(1.2deg) scale(1.015); }
    }
    @keyframes sporeFloat {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.25; }
      50%      { transform: translateY(-18px) translateX(6px); opacity: 0.85; }
    }
    .bio-vine-svg {
      animation: bioPulseGlow 5.5s ease-in-out infinite, vineSway 9s ease-in-out infinite;
      transform-origin: top center;
    }
    .bio-spore {
      animation: sporeFloat 6s ease-in-out infinite;
    }
    .bio-active .bio-card {
      position: relative;
      border-color: rgba(34, 211, 238, 0.24);
      box-shadow: 0 4px 28px -4px rgba(6, 182, 212, 0.12), inset 0 0 18px rgba(16, 185, 129, 0.04);
      background-image: radial-gradient(circle at 100% 0%, rgba(16, 185, 129, 0.06), transparent 45%),
                        radial-gradient(circle at 0% 100%, rgba(34, 211, 238, 0.05), transparent 45%);
    }
    .bio-active .bio-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 16px;
      right: 16px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.65), rgba(163, 230, 53, 0.6), rgba(16, 185, 129, 0.65), transparent);
      border-radius: 999px;
      pointer-events: none;
      opacity: 0.75;
    }
  </style>
</head>

  <script>
    /********************************************************************

    const BUILTIN_AMBIENTS = [
      { id: 'synth_sector0', title: 'Сектор 0: Комплекс «СІЕЛЬ» (Кібер-дрон)', freq1: 110, freq2: 165, lfo: 0.18, type: 'sine' },
      { id: 'synth_sector1', title: 'Сектор 1: Карантинні Сади (Біолюмінесценція)', freq1: 146.8, freq2: 220, lfo: 0.25, type: 'triangle' },
      { id: 'synth_sector2', title: 'Сектор 2: Іржаві Пустки (Індустріальний гул)', freq1: 73.4, freq2: 110, lfo: 0.12, type: 'sawtooth' },
      { id: 'synth_sector5', title: 'Сектор 5: Примарний Мегаполіс (Ехо мережі)', freq1: 130.8, freq2: 196, lfo: 0.32, type: 'sine' },

    function esc(val) {
      if (val === null || val === undefined) return '';
      return String(val)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function extractYoutubeId(url) {
      if (!url) return null;
      const clean = String(url).trim();
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts|live)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
      const match = clean.match(regExp);
      return match && match[1] ? match[1] : null;
    }

    /********************************************************************
     * 2. ГРАФІКА КУБИКІВ «ЕНТРОПІЇ» (💠) ТА БІОЛЮМІНЕСЦЕНТНІ ЛІАНИ
     ********************************************************************/

      if (mode === 'empty') {
        return `<div class="${sizeClass} rounded-lg border border-dashed border-slate-700 flex items-center justify-center text-slate-600 text-xs font-bold select-none">0</div>`;

      if (mode === 'half') {
        return `

            <span class="text-2xl absolute inset-0 flex items-center justify-center drop-shadow-[0_0_8px_rgba(34,211,238,0.85)]" style="clip-path: inset(0 50% 0 0);">💠</span>
          </div>
        `;

      return `<div class="${sizeClass} flex items-center justify-center text-2xl select-none drop-shadow-[0_0_12px_rgba(34,211,238,0.95)]" title="Повний символ (2 бали)">💠</div>`;

      container.innerHTML = `

          <path d="M18 190 Q42 180 48 198 Q30 205 18 190 Z" fill="rgba(16,185,129,0.35)" stroke="#34d399" stroke-width="1.2"/>
          <path d="M68 185 Q92 172 98 190 Q78 198 68 185 Z" fill="rgba(34,211,238,0.35)" stroke="#22d3ee" stroke-width="1.2"/>

          <circle cx="110" cy="285" r="4.5" fill="#22d3ee" />
          <circle cx="115" cy="145" r="4" fill="#34d399" />

          <circle cx="38" cy="125" r="3" fill="#a3e635" />
          <circle cx="195" cy="40" r="3.5" fill="#34d399" />
        </svg>

        <svg viewBox="0 0 320 420" class="bio-vine-svg fixed top-0 right-0 w-48 md:w-72 h-auto opacity-85" style="transform: scaleX(-1);">
          <path d="M-10 0 Q45 85 22 180 T65 340" fill="none" stroke="url(#vineGradLeft)" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M0 -10 Q100 40 175 25 T290 55" fill="none" stroke="url(#vineGradLeft)" stroke-width="3" stroke-linecap="round"/>
          <path d="M35 70 Q95 120 75 195 T125 270" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
          <path d="M22 180 Q48 170 52 188 Q34 195 22 180 Z" fill="rgba(34,211,238,0.35)" stroke="#22d3ee" stroke-width="1.2"/>
          <circle cx="65" cy="340" r="5" fill="#22d3ee" />
          <circle cx="125" cy="270" r="4.5" fill="#a3e635" />
          <circle cx="290" cy="55" r="4" fill="#34d399" />
          <circle cx="150" cy="50" r="3.5" fill="#a3e635" />
        </svg>

        <svg viewBox="0 0 260 220" class="fixed bottom-0 left-0 w-40 md:w-56 h-auto opacity-65">
          <path d="M0 220 Q45 150 28 90 T85 20" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M10 220 Q95 175 160 195 T240 165" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
          <circle cx="85" cy="20" r="4" fill="#a3e635" />
          <circle cx="240" cy="165" r="3.5" fill="#22d3ee" />

        <div class="bio-spore fixed top-3/4 right-16 w-2.5 h-2.5 rounded-full bg-cyan-300 shadow-[0_0_14px_#22d3ee]" style="animation-delay: 2.7s;"></div>

    /********************************************************************
     * 3. СТВОРЕННЯ ТА НОРМАЛІЗАЦІЯ ПЕРСОНАЖА
     ********************************************************************/
    function createBlankCharacter(id, ownerLogin, name, isNpc = false) {
      const stats = {};
      const wounds = {};
      STATS.forEach(s => {
        stats[s.id] = 1;
        wounds[s.id] = [false, false, false, false, false, false];
      });

      const hpGrid = HP_ROWS.map(() => [false, false, false, false, false, false]);

      return {
        id: String(id),
        owner: String(ownerLogin || 'гравець'),
        name: String(name || ownerLogin || 'Персонаж'),
        isNpc: !!isNpc,
        archetype: '',
        avatarUrl: '',
        stats: stats,
        wounds: wounds,
        hpGrid: hpGrid,
        skills: [],
        equipment: '',
        backpack: '',
        notes: '',
        inspiration: {
          count: 0,
          pendingRequest: false,
          lastStatus: ''
        },
        privacy: {
          hideStats: false,
          hideHealth: false,
          hideSkills: false
        },
        rollLog: [],
        updatedAt: Date.now()
      };
    }

    function normalizeCharacter(raw) {
      const fallbackId = raw?.id || ('char_' + Date.now());
      const base = createBlankCharacter(
        fallbackId,
        raw?.owner || 'гравець',
        raw?.name || 'Безіменний',
        !!raw?.isNpc
      );

      if (!raw || typeof raw !== 'object') return base;

      base.name = String(raw.name || base.name);
      base.owner = String(raw.owner || base.owner);
      base.isNpc = !!raw.isNpc;
      base.archetype = String(raw.archetype || '');
      base.avatarUrl = String(raw.avatarUrl || '');
      base.equipment = String(raw.equipment || '');
      base.backpack = String(raw.backpack || '');
      base.notes = String(raw.notes || '');
      base.updatedAt = Number(raw.updatedAt) || 1;

      STATS.forEach(s => {
        const val = Number(raw.stats?.[s.id]);
        base.stats[s.id] = Number.isFinite(val) ? Math.min(6, Math.max(1, Math.round(val))) : 1;

        const wArr = raw.wounds?.[s.id];
        if (Array.isArray(wArr)) {
          base.wounds[s.id] = [0, 1, 2, 3, 4, 5].map(i => !!wArr[i]);
        }
      });

      if (Array.isArray(raw.hpGrid)) {
        base.hpGrid = HP_ROWS.map((_, rIdx) => {
          const row = raw.hpGrid[rIdx];
          return [0, 1, 2, 3, 4, 5].map(cIdx => Array.isArray(row) ? !!row[cIdx] : false);
        });
      }

      if (Array.isArray(raw.skills)) {
        base.skills = raw.skills.map((sk, idx) => {
          const effectType = ['passive', 'active', 'none'].includes(sk?.effectType)
            ? sk.effectType
            : 'active';
          return {
            id: String(sk?.id || ('sk_' + idx + '_' + Date.now())),
            name: String(sk?.name || 'Навичка'),
            effectType: effectType,
            statId: String(sk?.statId || 'any'),
            diceMod: effectType === 'none' ? 0 : (Number.isFinite(Number(sk?.diceMod)) ? Number(sk.diceMod) : 0),
            flatBonus: effectType === 'none' ? 0 : (Number.isFinite(Number(sk?.flatBonus)) ? Number(sk.flatBonus) : 0),
            condition: String(sk?.condition || ''),
            description: String(sk?.description || ''),
            active: effectType === 'passive' ? true : (effectType === 'none' ? false : !!sk?.active),
            hidden: !!sk?.hidden
          };
        });
      }

      if (raw.inspiration && typeof raw.inspiration === 'object') {
        base.inspiration = {
          count: Math.max(0, Number(raw.inspiration.count) || 0),
          pendingRequest: !!raw.inspiration.pendingRequest,
          lastStatus: String(raw.inspiration.lastStatus || '')
        };
      }

      if (raw.privacy && typeof raw.privacy === 'object') {
        base.privacy = {
          hideStats: !!raw.privacy.hideStats,
          hideHealth: !!raw.privacy.hideHealth,
          hideSkills: !!raw.privacy.hideSkills
        };
      }

      if (Array.isArray(raw.rollLog)) {
        base.rollLog = raw.rollLog.filter(Boolean).slice(0, 20);
      }

      return base;
    }

    function compactCharForNetwork(char) {
      if (!char) return null;
      return {
        ...char,
        rollLog: (char.rollLog || []).slice(0, 10)
      };
    }

    /********************************************************************
     * 4. ГЛОБАЛЬНИЙ СТАН, МІСТ З КАРТОЮ (ARK BRIDGE) ТА ХМАРНА СИНХРОНІЗАЦІЯ
     ********************************************************************/
    const CLIENT_ID = 'dev_' + Math.random().toString(36).slice(2, 10);

    // Канал BroadcastChannel для миттєвого зв'язку з картою entropia_map
    const arkSyncChannel = ('BroadcastChannel' in window)

    window.state = {

    let mqttClient = null;
    let mqttConnectTimer = null;

    const localAudioBlobs = {};

    window.toggleBioDecor = function() {
      state.ui.bioDecorEnabled = !state.ui.bioDecorEnabled;

    };

    // Формує об'єкт персонажа з точними полями для інтерактивної карти
    function buildCharacterBridgeObject(char) {
      if (!char) return null;
      const diceModifiers = {};
      STATS.forEach(st => {
        const penalty = getWoundPenalty(char, st.id);
        const { diceMod, flatBonus } = getActiveSkillModifiers(char, st.id);
        diceModifiers[st.id] = {
          base: Number(char.stats?.[st.id] || 1),
          woundPenalty: -penalty,
          skillDiceMod: diceMod,
          flatBonus: flatBonus,
          totalMod: diceMod - penalty,
          totalPool: getDicePoolForStat(char, st.id, false)
        };
      });

      return {
        id: char.id,
        owner: char.owner,
        name: char.name,
        archetype: char.archetype || '',
        isNpc: !!char.isNpc,
        stats: { ...char.stats },
        skills: (char.skills || []).map(sk => ({ ...sk })),
        avatarUrl: char.avatarUrl || '',
        diceModifiers: diceModifiers,
        wounds: char.wounds,
        hpGrid: char.hpGrid,
        healthStage: getCurrentHealthStageName(char),
        inspiration: char.inspiration?.count || 0,
        privacy: char.privacy,
        lastRoll: (char.rollLog && char.rollLog[0]) ? char.rollLog[0] : null,
        updatedAt: char.updatedAt || Date.now()
      };
    }

    // МИТТЄВА ВІДПРАВКА ПЕРСОНАЖА НА КАРТУ (BroadcastChannel + postMessage в iframe)
    window.broadcastCharacterToMap = function(charOverride) {
      const currentCharacter = charOverride || getActiveCharacter();
      if (!currentCharacter) return;

      try {
        const charData = buildCharacterBridgeObject(currentCharacter);
        const messagePayload = {
          type: 'CHARACTER_UPDATE',
          roomCode: state.roomCode,
          role: state.session.role,
          character: {
            name: currentCharacter.name,
            stats: currentCharacter.stats,
            skills: currentCharacter.skills,
            avatarUrl: currentCharacter.avatarUrl || '',
            diceModifiers: charData.diceModifiers,
            // Додаткові корисні поля для карти:
            id: currentCharacter.id,
            owner: currentCharacter.owner,
            archetype: currentCharacter.archetype || '',
            healthStage: charData.healthStage,
            wounds: currentCharacter.wounds,
            hpGrid: currentCharacter.hpGrid,
            inspiration: charData.inspiration,
            lastRoll: charData.lastRoll,
            updatedAt: charData.updatedAt
          }
        };

        // 1. Відправка через BroadcastChannel ('entropia_ark_sync_channel')
        if (arkSyncChannel) {
          arkSyncChannel.postMessage(messagePayload);
        }

        // 2. Пряма відправка у вбудований iframe карти (якщо відкрита вкладка «Карта Ентропії»)
        const mapIframe = document.getElementById('entropiaMapIframe');
        if (mapIframe && mapIframe.contentWindow) {
          mapIframe.contentWindow.postMessage(messagePayload, '*');
        }
      } catch (err) {
        console.warn('Помилка BroadcastChannel для карти:', err);
      }
    };

    // Слухаємо запити від самої карти (наприклад, коли карта щойно відкрилася і просить скинути персонажа)
    function handleIncomingMapBridgeMessage(data) {
      if (!data || typeof data !== 'object') return;
      if (data.type === 'REQUEST_CHARACTER_SYNC' || data.type === 'ARK_MAP_READY') {
        const activeChar = getActiveCharacter();
        if (activeChar) {
          window.broadcastCharacterToMap(activeChar);
        }
        // Якщо запитують список усіх персонажів для режиму Майстра на карті
        const allCharsPayload = {
          type: 'ALL_CHARACTERS_SYNC',
          roomCode: state.roomCode,
          role: state.session.role,
          characters: Object.values(state.characters).map(c => buildCharacterBridgeObject(c))
        };
        if (arkSyncChannel) arkSyncChannel.postMessage(allCharsPayload);
        const mapIframe = document.getElementById('entropiaMapIframe');
        if (mapIframe && mapIframe.contentWindow) {
          mapIframe.contentWindow.postMessage(allCharsPayload, '*');
        }
      }
    }

    if (arkSyncChannel) {
      arkSyncChannel.onmessage = (ev) => handleIncomingMapBridgeMessage(ev.data);
    }
    window.addEventListener('message', (ev) => handleIncomingMapBridgeMessage(ev.data));

    function getCleanRoomKey() {
      return (state.roomCode || DEFAULT_ROOM_CODE).trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_') || 'entropia_main';
    }

    function getCloudTopics() {
      const r = getCleanRoomKey();
      return {
        ntfyTopic:      `vitruvium_entropia_v10_${r}`,
        mqttCharPrefix: `vitruvium_v10/${r}/chars/`,
        mqttCharWild:   `vitruvium_v10/${r}/chars/+`,
        mqttMetaTopic:  `vitruvium_v10/${r}/meta`,
        mqttPingTopic:  `vitruvium_v10/${r}/ping`
      };
    }

    function updateCloudBadgeDOM() {
      const containers = document.querySelectorAll('.js-cloud-badge');
      if (!containers.length) return;
      const html = renderCloudStatusBadgeInner();
      containers.forEach(el => { el.innerHTML = html; });
    }

    function normalizeTrack(tr) {
      if (!tr || typeof tr !== 'object') return null;
      const ytId = tr.ytId || (tr.isYoutube ? (extractYoutubeId(tr.url) || tr.url) : extractYoutubeId(tr.url));
      const isYoutube = !!(tr.isYoutube || ytId);
      return {
        id: String(tr.id || ('track_' + Date.now())),
        title: String(tr.title || 'Без назви'),
        url: String(tr.url || ''),
        ytId: ytId ? String(ytId) : '',
        isYoutube: isYoutube,
        isLocalBlob: !!tr.isLocalBlob,
        playlist: String(tr.playlist || 'Загальний')
      };
    }

    function loadDatabase() {
      try {
        const keysToTry = [STORAGE_KEY, 'vitruvium_entropia_v9_cloud', 'vitruvium_entropia_v8_final', 'vitruvium_app_v6_stable'];
        for (const k of keysToTry) {
          const raw = localStorage.getItem(k);
          if (!raw) continue;
          try {
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object') continue;

            if (parsed.roomCode && k === STORAGE_KEY) {
              state.roomCode = String(parsed.roomCode).trim().toLowerCase() || DEFAULT_ROOM_CODE;
              state.loginForm.roomInput = state.roomCode;
            }
            if (parsed.firebaseDbUrl && k === STORAGE_KEY) {
              state.firebaseDbUrl = String(parsed.firebaseDbUrl).trim();
            }
            if (typeof parsed.bioDecorEnabled === 'boolean' && k === STORAGE_KEY) {
              state.ui.bioDecorEnabled = parsed.bioDecorEnabled;
            }
            if (parsed.deletedChars && typeof parsed.deletedChars === 'object') {
              Object.assign(state.deletedChars, parsed.deletedChars);
            }
            if (parsed.characters && typeof parsed.characters === 'object') {
              Object.keys(parsed.characters).forEach(id => {
                const c = parsed.characters[id];
                if (c && !state.deletedChars[id] && !state.characters[id]) {
                  state.characters[id] = normalizeCharacter(c);
                }
              });
            }
            if (Array.isArray(parsed.campaignRollLogs) && state.campaignRollLogs.length === 0) {
              state.campaignRollLogs = parsed.campaignRollLogs.filter(Boolean).slice(0, 60);
            }
            if (Array.isArray(parsed.audioPlaylists) && parsed.audioPlaylists.length > 0) {
              const mergedPl = new Set([...DEFAULT_PLAYLISTS, ...parsed.audioPlaylists.map(String)]);
              state.audioPlaylists = Array.from(mergedPl);
            }
            if (Array.isArray(parsed.audioTracks) && state.audioTracks.length === 0) {
              state.audioTracks = parsed.audioTracks.map(normalizeTrack).filter(Boolean);
            }
          } catch (_) {}
        }
      } catch (err) {
        console.warn('Помилка читання localStorage:', err);
      }
    }

    function saveLocalBackup() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          roomCode: state.roomCode,
          firebaseDbUrl: state.firebaseDbUrl,
          bioDecorEnabled: state.ui.bioDecorEnabled,
          characters: state.characters,
          deletedChars: state.deletedChars,
          campaignRollLogs: state.campaignRollLogs,
          audioPlaylists: state.audioPlaylists,
          audioTracks: state.audioTracks.filter(t => !t.isLocalBlob),
          audioState: state.audioState
        }));
      } catch (err) {
        console.error('Помилка локального збереження:', err);
      }
    }

    function applyIncomingCloudPacket(packet, triggerRender = true) {
      if (!packet || typeof packet !== 'object') return false;
      let changed = false;

      if (packet.type === 'delete_char' && packet.charId) {
        const delTime = Number(packet.deletedAt) || Date.now();
        state.deletedChars[packet.charId] = Math.max(delTime, Number(state.deletedChars[packet.charId]) || 0);
        if (state.characters[packet.charId]) {
          delete state.characters[packet.charId];
          if (state.session.activeCharId === packet.charId) {
            const rem = Object.values(state.characters).filter(c => !c.isNpc);
            state.session.activeCharId = rem.length > 0 ? rem[0].id : null;
          }
          changed = true;
        }
      }

      if (packet.type === 'char' && packet.char && packet.char.id) {
        const incoming = normalizeCharacter(packet.char);
        const delTime = Number(state.deletedChars[incoming.id]) || 0;
        if (delTime < incoming.updatedAt) {
          const local = state.characters[incoming.id];
          if (!local || incoming.updatedAt >= (Number(local.updatedAt) || 0)) {
            state.characters[incoming.id] = incoming;
            if (state.session.activeCharId === incoming.id) {
              window.broadcastCharacterToMap(incoming);
            }
            changed = true;
          }
        }
      }

      if (packet.type === 'meta' || packet.type === 'full_sync' || packet.characters) {
        if (packet.deletedChars && typeof packet.deletedChars === 'object') {
          Object.keys(packet.deletedChars).forEach(delId => {
            const dTime = Number(packet.deletedChars[delId]) || 0;
            if (dTime > (Number(state.deletedChars[delId]) || 0)) {
              state.deletedChars[delId] = dTime;
            }
            const loc = state.characters[delId];
            if (loc && (Number(loc.updatedAt) || 0) <= state.deletedChars[delId]) {
              delete state.characters[delId];
              changed = true;
            }
          });
        }

        if (packet.characters && typeof packet.characters === 'object') {
          Object.keys(packet.characters).forEach(cid => {
            const rawC = packet.characters[cid];
            if (!rawC) return;
            const inc = normalizeCharacter(rawC);
            const dTime = Number(state.deletedChars[cid]) || 0;
            if (dTime >= inc.updatedAt) return;
            const loc = state.characters[cid];
            if (!loc || inc.updatedAt > (Number(loc.updatedAt) || 0)) {
              state.characters[cid] = inc;
              changed = true;
            }
          });
        }

        if (Array.isArray(packet.campaignRollLogs)) {
          const seen = new Set((state.campaignRollLogs || []).map(r => r?.id));
          let added = false;
          packet.campaignRollLogs.forEach(r => {
            if (r && r.id && !seen.has(r.id)) {
              seen.add(r.id);
              state.campaignRollLogs.push(r);
              added = true;
            }
          });
          if (added) {
            state.campaignRollLogs.sort((a, b) => String(b.id).localeCompare(String(a.id)));
            state.campaignRollLogs = state.campaignRollLogs.slice(0, 60);
            changed = true;
          }
        }

        if (Array.isArray(packet.audioPlaylists)) {
          const currentSet = new Set(state.audioPlaylists);
          packet.audioPlaylists.forEach(pl => {
            if (pl && !currentSet.has(String(pl))) {
              currentSet.add(String(pl));
              changed = true;
            }
          });
          state.audioPlaylists = Array.from(currentSet);
        }

        if (Array.isArray(packet.audioTracks)) {
          const localById = {};
          state.audioTracks.forEach(t => { localById[t.id] = t; });
          packet.audioTracks.forEach(rawTr => {
            const tr = normalizeTrack(rawTr);
            if (!tr || tr.isLocalBlob) return;
            if (!localById[tr.id] || localById[tr.id].playlist !== tr.playlist) {
              localById[tr.id] = tr;
              changed = true;
            }
          });
          state.audioTracks = Object.values(localById);
        }

        if (packet.audioState && typeof packet.audioState === 'object') {
          const incTime = Number(packet.audioState.updatedAt) || 0;
          const locTime = Number(state.audioState.updatedAt) || 0;
          if (incTime > locTime) {
            const myVol = state.audioState.volume;
            state.audioState = { ...packet.audioState, volume: myVol };
            syncAudioFromState(false);
            changed = true;
          }
        }
      }

      if (state.session.loggedIn && state.session.role === 'gm' && !state.session.activeCharId) {
        const list = Object.values(state.characters).filter(c =>
          state.session.gmCategory === 'npcs' ? c.isNpc : !c.isNpc
        );
        if (list.length > 0) {
          state.session.activeCharId = list[0].id;
          changed = true;
        }
      }

      if (changed) {
        state.cloud.lastSyncTime = new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        saveLocalBackup();
        if (triggerRender) safeRenderApp();
      }
      return changed;
    }

    // ЗБЕРЕЖЕННЯ ПЕРСОНАЖА В ХМАРУ + КРИК КАРТІ ЧЕРЕЗ BROADCAST_CHANNEL
    function syncSingleCharacterToCloud(charId) {
      saveLocalBackup();
      const char = state.characters[charId];
      if (!char) return;

      // Миттєво повідомляємо інтерактивну карту про зміни персонажа
      window.broadcastCharacterToMap(char);

      const packet = {
        type: 'char',
        senderId: CLIENT_ID,
        sentAt: Date.now(),
        char: compactCharForNetwork(char)
      };
      const jsonStr = JSON.stringify(packet);
      const { ntfyTopic, mqttCharPrefix } = getCloudTopics();

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(mqttCharPrefix + charId, jsonStr, { qos: 1, retain: true });
      }

      fetch(`https://ntfy.sh/${ntfyTopic}`, {
        method: 'POST',
        body: jsonStr
      }).then(() => {
        state.cloud.httpReady = true;
        state.cloud.lastSyncTime = new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        updateCloudBadgeDOM();
      }).catch(() => {});

      if (state.firebaseDbUrl) {
        pushCharToFirebaseRest(charId, packet.char);
      }
    }

    function syncDeleteCharacterToCloud(charId) {
      saveLocalBackup();
      const delAt = state.deletedChars[charId] || Date.now();
      const packet = {
        type: 'delete_char',
        senderId: CLIENT_ID,
        charId: charId,
        deletedAt: delAt
      };
      const jsonStr = JSON.stringify(packet);
      const { ntfyTopic, mqttCharPrefix } = getCloudTopics();

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(mqttCharPrefix + charId, jsonStr, { qos: 1, retain: true });
      }

      fetch(`https://ntfy.sh/${ntfyTopic}`, {
        method: 'POST',
        body: jsonStr
      }).catch(() => {});

      if (state.firebaseDbUrl) {
        deleteCharFromFirebaseRest(charId);
      }
    }

    function syncMetaToCloud() {
      saveLocalBackup();
      const packet = {
        type: 'meta',
        senderId: CLIENT_ID,
        sentAt: Date.now(),
        deletedChars: state.deletedChars,
        campaignRollLogs: (state.campaignRollLogs || []).slice(0, 20),
        audioPlaylists: state.audioPlaylists,
        audioTracks: (state.audioTracks || []).filter(t => !t.isLocalBlob).slice(0, 50),
        audioState: state.audioState
      };
      const jsonStr = JSON.stringify(packet);
      const { ntfyTopic, mqttMetaTopic } = getCloudTopics();

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(mqttMetaTopic, jsonStr, { qos: 1, retain: true });
      }

      fetch(`https://ntfy.sh/${ntfyTopic}`, {
        method: 'POST',
        body: jsonStr
      }).catch(() => {});
    }

    function broadcastAllLocalCharacters() {
      Object.keys(state.characters).forEach(cid => {
        syncSingleCharacterToCloud(cid);
      });
      if (state.campaignRollLogs.length > 0 || state.audioTracks.length > 0 || state.audioState.isPlaying) {
        syncMetaToCloud();
      }
    }

    async function fetchNtfyRoomHistory() {
      const { ntfyTopic } = getCloudTopics();
      try {
        const res = await fetch(`https://ntfy.sh/${ntfyTopic}/json?poll=1&since=24h`);
        if (!res.ok) return;
        state.cloud.httpReady = true;
        updateCloudBadgeDOM();

        const text = await res.text();
        if (!text) return;

        const lines = text.trim().split('\n');
        let anyChanged = false;

        for (const line of lines) {
          if (!line) continue;
          try {
            const wrapper = JSON.parse(line);
            if (wrapper && wrapper.event === 'message' && wrapper.message) {
              const inner = JSON.parse(wrapper.message);
              if (applyIncomingCloudPacket(inner, false)) {
                anyChanged = true;
              }
            }
          } catch (_) {}
        }

        if (anyChanged) {
          safeRenderApp();
        }
      } catch (e) {
        console.warn('HTTPS Cloud poll info:', e);
      }
    }

    function initNtfyLiveStream() {
      if (ntfyEventSource) {
        try { ntfyEventSource.close(); } catch (_) {}
      }

      const { ntfyTopic } = getCloudTopics();
      try {
        ntfyEventSource = new EventSource(`https://ntfy.sh/${ntfyTopic}/sse`);

        ntfyEventSource.onopen = () => {
          state.cloud.httpReady = true;
          updateCloudBadgeDOM();
        };

        ntfyEventSource.onmessage = (event) => {
          try {
            const wrapper = JSON.parse(event.data);
            if (wrapper && wrapper.event === 'message' && wrapper.message) {
              const packet = JSON.parse(wrapper.message);
              if (packet.senderId === CLIENT_ID) return;

              if (packet.type === 'ping') {
                if (Object.keys(state.characters).length > 0 || state.audioTracks.length > 0) {
                  broadcastAllLocalCharacters();
                }
                return;
              }

              applyIncomingCloudPacket(packet, true);
            }
          } catch (_) {}
        };
      } catch (e) {
        console.warn('SSE init error:', e);
      }
    }

    function initMqttConnection() {
      if (typeof mqtt === 'undefined') return;

      if (mqttConnectTimer) clearTimeout(mqttConnectTimer);
      if (mqttClient) {
        try { mqttClient.end(true); } catch (_) {}
        mqttClient = null;
      }

      const brokerUrl = MQTT_BROKERS[state.cloud.brokerIndex % MQTT_BROKERS.length];

      try {
        mqttClient = mqtt.connect(brokerUrl, {
          clientId: 'vitruv11_' + CLIENT_ID + '_' + Math.floor(Math.random() * 9999),
          protocolVersion: 4,
          clean: true,
          connectTimeout: 4500,
          reconnectPeriod: 0
        });
      } catch (e) {
        scheduleNextBroker();
        return;
      }

      mqttConnectTimer = setTimeout(() => {
        if (!mqttClient || !mqttClient.connected) {
          scheduleNextBroker();
        }
      }, 5000);

      mqttClient.on('connect', () => {
        if (mqttConnectTimer) clearTimeout(mqttConnectTimer);
        state.cloud.mqttReady = true;
        updateCloudBadgeDOM();

        const { mqttCharWild, mqttMetaTopic, mqttPingTopic } = getCloudTopics();
        mqttClient.subscribe([mqttCharWild, mqttMetaTopic, mqttPingTopic], { qos: 1 }, (err) => {
          if (!err) {
            mqttClient.publish(mqttPingTopic, JSON.stringify({ type: 'ping', senderId: CLIENT_ID }), { qos: 0 });
            if (Object.keys(state.characters).length > 0) {
              setTimeout(() => broadcastAllLocalCharacters(), 300);
            }
          }
        });
      });

      mqttClient.on('message', (topic, messageBuffer) => {
        try {
          const packet = JSON.parse(messageBuffer.toString());
          if (!packet) return;

          if (packet.type === 'ping') {
            if (packet.senderId !== CLIENT_ID && (Object.keys(state.characters).length > 0 || state.audioTracks.length > 0)) {
              broadcastAllLocalCharacters();
            }
            return;
          }

          applyIncomingCloudPacket(packet, true);
        } catch (_) {}
      });

      mqttClient.on('error', () => {
        scheduleNextBroker();
      });

      mqttClient.on('close', () => {
        state.cloud.mqttReady = false;
        updateCloudBadgeDOM();
      });
    }

    function scheduleNextBroker() {
      if (mqttConnectTimer) clearTimeout(mqttConnectTimer);
      state.cloud.mqttReady = false;
      state.cloud.brokerIndex = (state.cloud.brokerIndex + 1) % MQTT_BROKERS.length;
      setTimeout(() => {
        if (!mqttClient || !mqttClient.connected) {
          initMqttConnection();
        }
      }, 3000);
    }

    async function pushCharToFirebaseRest(charId, charObj) {
      if (!state.firebaseDbUrl) return;
      try {
        const cleanUrl = state.firebaseDbUrl.replace(/\/+$/, '');
        const r = getCleanRoomKey();
        await fetch(`${cleanUrl}/vitruvium_${r}/characters/${encodeURIComponent(charId)}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(charObj)
        });
      } catch (_) {}
    }

    async function deleteCharFromFirebaseRest(charId) {
      if (!state.firebaseDbUrl) return;
      try {
        const cleanUrl = state.firebaseDbUrl.replace(/\/+$/, '');
        const r = getCleanRoomKey();
        await fetch(`${cleanUrl}/vitruvium_${r}/characters/${encodeURIComponent(charId)}.json`, {
          method: 'DELETE'
        });
      } catch (_) {}
    }

    async function pullFromFirebaseRest() {
      if (!state.firebaseDbUrl) return;
      try {
        const cleanUrl = state.firebaseDbUrl.replace(/\/+$/, '');
        const r = getCleanRoomKey();
        const res = await fetch(`${cleanUrl}/vitruvium_${r}.json`);
        if (res.ok) {
          const data = await res.json();
          if (data) applyIncomingCloudPacket(data, true);
        }
      } catch (_) {}
    }

    function startAllCloudEngines() {
      fetchNtfyRoomHistory();
      initNtfyLiveStream();
      initMqttConnection();
      if (firebasePollInterval) clearInterval(firebasePollInterval);
      if (state.firebaseDbUrl) {
        pullFromFirebaseRest();
        firebasePollInterval = setInterval(pullFromFirebaseRest, 4000);
      }
    }

    window.forceCloudSyncNow = async function() {
      const { ntfyTopic, mqttPingTopic } = getCloudTopics();
      await fetchNtfyRoomHistory();

      if (Object.keys(state.characters).length > 0 || state.audioTracks.length > 0) {
        broadcastAllLocalCharacters();
      }

      fetch(`https://ntfy.sh/${ntfyTopic}`, {
        method: 'POST',
        body: JSON.stringify({ type: 'ping', senderId: CLIENT_ID, time: Date.now() })
      }).catch(() => {});

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(mqttPingTopic, JSON.stringify({ type: 'ping', senderId: CLIENT_ID }));
      } else {
        initMqttConnection();
      }

      if (state.firebaseDbUrl) {
        pullFromFirebaseRest();
      }

      safeRenderApp();
    };

    window.saveCloudSettings = function(event) {
      if (event) event.preventDefault();
      const roomEl = document.getElementById('cloudRoomInput');
      const fbEl = document.getElementById('cloudFirebaseInput');

      if (roomEl && roomEl.value.trim()) {
        state.roomCode = roomEl.value.trim().toLowerCase();
        state.loginForm.roomInput = state.roomCode;
      }
      if (fbEl) {
        state.firebaseDbUrl = fbEl.value.trim();
      }

      state.cloud.cloudModalOpen = false;
      saveLocalBackup();
      startAllCloudEngines();
      safeRenderApp();
    };

    window.copyRoomBackupCode = function() {
      const code = JSON.stringify({
        characters: state.characters,
        campaignRollLogs: state.campaignRollLogs,
        audioPlaylists: state.audioPlaylists,
        audioTracks: state.audioTracks.filter(t => !t.isLocalBlob)
      });
      navigator.clipboard.writeText(code).then(() => {
        alert('Код усіх персонажів та плейлистів скопійовано!');
      }).catch(() => {
        prompt('Скопіюйте цей код синхронізації:', code);
      });
    };

    window.importRoomBackupCode = function() {
      const raw = prompt('Вставте скопійований код синхронізації з іншого пристрою:');
      if (!raw || !raw.trim()) return;
      try {
        const parsed = JSON.parse(raw.trim());
        applyIncomingCloudPacket(parsed, true);
        broadcastAllLocalCharacters();
        alert('Дані успішно імпортовано та синхронізовано!');
      } catch (e) {
        alert('Невірний формат коду синхронізації.');
      }
    };

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) {
        loadDatabase();
        syncAudioFromState(false);
        safeRenderApp();
      }
    });

    function getActiveCharacter() {
      const id = state.session.activeCharId;
      if (!id || !state.characters[id]) return null;
      state.characters[id] = normalizeCharacter(state.characters[id]);
      return state.characters[id];
    }

    function touchCharacter(char) {
      if (char) char.updatedAt = Date.now();
    }

    /********************************************************************
     * 5. ОБЧИСЛЕННЯ ПУЛУ КУБИКІВ, ТРАВМ ТА ОСОБИСТОГО ЖУРНАЛУ
     ********************************************************************/
    function getWoundCount(char, statId) {
      const arr = char?.wounds?.[statId] || [];
      return arr.filter(Boolean).length;
    }

    function getWoundPenalty(char, statId) {
      return Math.floor(getWoundCount(char, statId) / 2);
    }

    function isSkillApplied(sk) {
      if (!sk || sk.effectType === 'none') return false;
      if (sk.effectType === 'passive') return true;
      return !!sk.active;
    }

    function getActiveSkillModifiers(char, statId) {
      const list = (char?.skills || []).filter(sk =>
        isSkillApplied(sk) && (sk.statId === statId || sk.statId === 'any')
      );
      const diceMod = list.reduce((sum, sk) => sum + (Number(sk.diceMod) || 0), 0);
      const flatBonus = list.reduce((sum, sk) => sum + (Number(sk.flatBonus) || 0), 0);
      return { diceMod, flatBonus, activeSkills: list };
    }

    function getDicePoolForStat(char, statId, includeExtra = false) {
      if (!char) return 0;
      const base = Number(char.stats?.[statId] || 1);
      const penalty = getWoundPenalty(char, statId);
      const { diceMod } = getActiveSkillModifiers(char, statId);
      const extra = includeExtra ? (Number(state.diceRoller.extraDiceMod) || 0) : 0;
      return Math.max(0, base - penalty + diceMod + extra);
    }

    function getCurrentHealthStageName(char) {
      let stage = 'Здоровий';
      const maxCols = Number(char?.stats?.health || 1);
      HP_ROWS.forEach((rowName, rIdx) => {
        const anyChecked = (char?.hpGrid?.[rIdx] || []).slice(0, maxCols).some(Boolean);
        if (anyChecked) stage = rowName;
      });
      return stage;
    }

    function getPersonalRollLogs(char) {
      if (!char) return [];
      const directLogs = Array.isArray(char.rollLog) ? char.rollLog : [];
      const fromCampaign = (state.campaignRollLogs || []).filter(item =>
        item && (
          item.charId === char.id ||
          (item.charOwner && item.charOwner === char.owner) ||
          (item.charName && item.charName === char.name)
        )
      );

      const seenIds = new Set();
      const merged = [];

      [...directLogs, ...fromCampaign].forEach(item => {
        if (!item) return;
        const key = item.id || `${item.time}_${item.statName}_${item.totalScore}`;
        if (!seenIds.has(key)) {
          seenIds.add(key);
          merged.push(item);
        }
      });

      return merged.slice(0, 40);
    }

    window.handleLoginSubmit = async function(event) {
      if (event) event.preventDefault();
      const { role } = state.loginForm;

      const roomEl = document.getElementById('loginRoomInput');
      const newRoom = (roomEl ? roomEl.value : state.loginForm.roomInput).trim().toLowerCase() || DEFAULT_ROOM_CODE;
      const roomChanged = newRoom !== state.roomCode;
      state.roomCode = newRoom;
      state.loginForm.roomInput = newRoom;

      if (roomChanged) {
        saveLocalBackup();
        startAllCloudEngines();
      }

      if (role === 'gm') {
        const passEl = document.getElementById('gmPasswordInput');
        const pass = (passEl ? passEl.value : state.loginForm.gmPasswordInput).trim().toLowerCase();

        if (pass !== GM_SECRET_PASSWORD) {
          state.loginForm.errorMsg = 'Невірний пароль Майстра!';
          safeRenderApp();
          return;
        }

        state.session.loggedIn = true;
        state.session.role = 'gm';
        state.session.loginName = 'Майстер (ЕНТРОПІЯ)';
        state.session.gmCategory = 'players';
        state.session.activeTab = 'all';
        state.loginForm.errorMsg = '';

        await fetchNtfyRoomHistory();
        const playerChars = Object.values(state.characters).filter(c => !c.isNpc);
        state.session.activeCharId = playerChars.length > 0 ? playerChars[0].id : null;

        window.forceCloudSyncNow();
        if (state.session.activeCharId) {
          window.broadcastCharacterToMap(state.characters[state.session.activeCharId]);
        }
        safeRenderApp();
        return;
      }

      const loginEl = document.getElementById('playerLoginInput');
      const charNameEl = document.getElementById('playerCharNameInput');
      const rawLogin = (loginEl ? loginEl.value : state.loginForm.loginInput).trim();
      const rawCharName = (charNameEl ? charNameEl.value : state.loginForm.charNameInput).trim();

      if (!rawLogin) {
        state.loginForm.errorMsg = 'Введіть ваш логін або позивний!';
        safeRenderApp();
        return;
      }

      await fetchNtfyRoomHistory();

      const cleanKey = rawLogin.toLowerCase().replace(/\s+/g, '_');
      const charId = `entropia_player_${cleanKey}`;

      if (state.deletedChars[charId]) {
        delete state.deletedChars[charId];
      }

      let existingId = state.characters[charId] ? charId : null;
      if (!existingId) {
        const found = Object.values(state.characters).find(
          c => !c.isNpc && String(c.owner).toLowerCase() === rawLogin.toLowerCase()
        );
        if (found) existingId = found.id;
      }

      const finalCharId = existingId || charId;

      if (!state.characters[finalCharId]) {
        const displayCharName = rawCharName || rawLogin;
        state.characters[finalCharId] = createBlankCharacter(finalCharId, rawLogin, displayCharName, false);
      } else if (rawCharName) {
        state.characters[finalCharId].name = rawCharName;
        touchCharacter(state.characters[finalCharId]);
      }

      state.session.loggedIn = true;
      state.session.role = 'player';
      state.session.loginName = rawLogin;
      state.session.activeCharId = finalCharId;
      state.session.activeTab = 'all';
      state.loginForm.errorMsg = '';

      syncSingleCharacterToCloud(finalCharId);
      syncAudioFromState(true);
      safeRenderApp();
    };

    window.changeStat = function(statId, delta) {

      if (!char) return;
      const current = Number(char.stats[statId] || 1);
      const next = Math.min(6, Math.max(1, current + delta));
      char.stats[statId] = next;

      if (statId === 'health') {
        char.hpGrid = char.hpGrid.map(row =>
          row.map((val, cIdx) => (cIdx < next ? val : false))
        );

      touchCharacter(char);

    window.toggleHpCircle = function(rowIndex, colIndex) {
      const char = getActiveCharacter();
      if (!char) return;
      const maxCols = Number(char.stats.health || 1);
      if (colIndex >= maxCols) return;
      char.hpGrid[rowIndex][colIndex] = !char.hpGrid[rowIndex][colIndex];
      touchCharacter(char);

    };

    window.stepHpDamage = function(addDamage = true) {
      const char = getActiveCharacter();
      if (!char) return;
      const maxCols = Number(char.stats.health || 1);

      if (addDamage) {
        for (let r = 0; r < HP_ROWS.length; r++) {
          for (let c = 0; c < maxCols; c++) {
            if (!char.hpGrid[r][c]) {
              char.hpGrid[r][c] = true;
              touchCharacter(char);
              syncSingleCharacterToCloud(char.id);
              safeRenderApp();
              return;
            }
          }
        }
      } else {
        for (let r = HP_ROWS.length - 1; r >= 0; r--) {
          for (let c = maxCols - 1; c >= 0; c--) {
            if (char.hpGrid[r][c]) {
              char.hpGrid[r][c] = false;
              touchCharacter(char);
              syncSingleCharacterToCloud(char.id);
              safeRenderApp();
              return;
            }
          }
        }
      }
    };

    window.rollVitruviumDice = function(statIdOverride) {
      const char = getActiveCharacter();
      if (!char || state.diceRoller.isRolling) return;

      const statId = statIdOverride || state.diceRoller.selectedStat || 'health';
      state.diceRoller.selectedStat = statId;

      const statObj = STATS.find(s => s.id === statId) || STATS[0];
      const diceCount = getDicePoolForStat(char, statId, true);
      const { diceMod, flatBonus, activeSkills } = getActiveSkillModifiers(char, statId);
      const extraMod = Number(state.diceRoller.extraDiceMod || 0);
      const penalty = getWoundPenalty(char, statId);

      state.diceRoller.isRolling = true;
      state.diceRoller.rollingCount = diceCount;
      safeRenderApp();

      setTimeout(() => {
        const faces = [
          { points: 2, mode: 'full' },
          { points: 1, mode: 'half' },
          { points: 1, mode: 'half' },
          { points: 0, mode: 'empty' },
          { points: 0, mode: 'empty' },
          { points: 0, mode: 'empty' }
        ];

        const results = [];
        let diceSum = 0;
        let countTwo = 0;
        let countOne = 0;
        let countZero = 0;

        for (let i = 0; i < diceCount; i++) {
          const pick = faces[Math.floor(Math.random() * faces.length)];
          results.push(pick);
          diceSum += pick.points;
          if (pick.points === 2) countTwo++;
          else if (pick.points === 1) countOne++;
          else countZero++;
        }

        const totalScore = diceSum + flatBonus;
        const rollRecord = {
          id: 'roll_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          charId: char.id,
          charName: char.name,
          charOwner: char.owner,
          time: new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          statId: statId,
          statName: statObj.name,
          statIcon: statObj.icon,
          baseStat: char.stats[statId],
          penalty,
          diceMod,
          extraMod,
          flatBonus,
          diceCount,
          results,
          diceSum,
          countTwo,
          countOne,
          countZero,
          totalScore,
          skillNames: activeSkills.map(s => s.name)
        };

        state.diceRoller.isRolling = false;
        state.diceRoller.lastRoll = rollRecord;

        if (!Array.isArray(char.rollLog)) char.rollLog = [];
        char.rollLog = [rollRecord, ...char.rollLog].slice(0, 25);
        state.campaignRollLogs = [rollRecord, ...(state.campaignRollLogs || [])].slice(0, 60);

        touchCharacter(char);
        syncSingleCharacterToCloud(char.id);
        syncMetaToCloud();
        safeRenderApp();
      }, 400);
    };

    function stopWebAudioAmbient() {
      webAudioNodes.forEach(n => {
        try { n.stop && n.stop(); } catch (_) {}
        try { n.disconnect && n.disconnect(); } catch (_) {}
      });
      webAudioNodes = [];
    }

    function stopHtml5Audio() {
      const audioEl = document.getElementById('globalAudioElement');
      if (audioEl) {
        try { audioEl.pause(); } catch (_) {}
      }
    }

    function stopYoutubeAudio() {
      pendingYtVideoId = null;
      if (ytPlayer && ytPlayerReady && typeof ytPlayer.stopVideo === 'function') {
        try { ytPlayer.stopVideo(); } catch (_) {}
      }
    }

    function startYoutubePlayback(videoId) {
      if (!videoId) return;
      pendingYtVideoId = videoId;
      const volPercent = Math.round(Math.min(1, Math.max(0, Number(state.audioState.volume ?? 0.6))) * 100);

      if (typeof YT === 'undefined' || typeof YT.Player === 'undefined') {
        return;
      }

      if (ytPlayer && ytPlayerReady && typeof ytPlayer.loadVideoById === 'function') {
        try {
          ytPlayer.loadVideoById({ videoId: videoId, startSeconds: 0 });
          ytPlayer.setVolume(volPercent);
          ytPlayer.playVideo();
        } catch (err) {
          console.warn('YT play error:', err);
        }
        return;
      }

      if (!ytPlayer) {
        try {
          ytPlayer = new YT.Player('ytPlayerElement', {
            height: '10',
            width: '10',
            videoId: videoId,
            playerVars: {
              autoplay: 1,
              controls: 0,
              disablekb: 1,
              fs: 0,
              loop: 1,
              playlist: videoId,
              playsinline: 1,
              rel: 0
            },
            events: {
              onReady: function(ev) {
                ytPlayerReady = true;
                ev.target.setVolume(volPercent);
                if (state.audioState.isPlaying && state.audioState.mode === 'youtube' && pendingYtVideoId) {
                  ev.target.loadVideoById(pendingYtVideoId);
                  ev.target.playVideo();
                }
              },
              onStateChange: function(ev) {
                if (ev.data === YT.PlayerState.ENDED && state.audioState.isPlaying && state.audioState.mode === 'youtube') {
                  ev.target.seekTo(0);
                  ev.target.playVideo();
                }
              }
            }
          });
        } catch (e) {
          console.warn('YT init error:', e);
        }
      }
    }

    function startWebAudioAmbient(preset) {
      stopWebAudioAmbient();
      stopHtml5Audio();
      stopYoutubeAudio();

      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!webAudioCtx) webAudioCtx = new AudioContextClass();
        if (webAudioCtx.state === 'suspended') webAudioCtx.resume();

        const masterGain = webAudioCtx.createGain();
        masterGain.gain.value = Math.max(0.05, Number(state.audioState.volume || 0.6) * 0.25);
        masterGain.connect(webAudioCtx.destination);

        const osc1 = webAudioCtx.createOscillator();
        const osc2 = webAudioCtx.createOscillator();
        const lfo = webAudioCtx.createOscillator();
        const lfoGain = webAudioCtx.createGain();
        const filter = webAudioCtx.createBiquadFilter();

        osc1.type = preset.type || 'sine';
        osc2.type = 'sine';
        osc1.frequency.value = preset.freq1;
        osc2.frequency.value = preset.freq2;

        filter.type = 'lowpass';
        filter.frequency.value = 420;

        lfo.frequency.value = preset.lfo || 0.2;
        lfoGain.gain.value = 180;

        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(masterGain);

        osc1.start();
        osc2.start();
        lfo.start();

        webAudioNodes = [osc1, osc2, lfo, lfoGain, filter, masterGain];
      } catch (e) {
        console.warn('Web Audio API помилка:', e);
      }
    }

    window.playBuiltinAmbient = function(presetId) {

    window.handleLocalAudioUpload = function(event) {
      const files = event.target?.files;
      if (!files || files.length === 0) return;
      const targetPl = document.getElementById('localUploadPlaylistSelect')?.value ||
                       (state.ui.selectedPlaylistFilter !== 'ALL' ? state.ui.selectedPlaylistFilter : 'Загальний');

      Array.from(files).forEach(file => {
        const id = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        const blobUrl = URL.createObjectURL(file);
        localAudioBlobs[id] = blobUrl;
        state.audioTracks.unshift({
          id,
          title: file.name.replace(/\.[^/.]+$/, ''),
          url: blobUrl,
          ytId: '',
          isYoutube: false,
          isLocalBlob: true,
          playlist: targetPl
        });
      });

      saveLocalBackup();
      safeRenderApp();
    };

    window.addUrlOrYoutubeTrack = function(event) {
      if (event) event.preventDefault();
      const title = document.getElementById('audioTitleInput')?.value?.trim();
      const rawUrl = document.getElementById('audioUrlInput')?.value?.trim();
      const playlist = document.getElementById('audioPlaylistSelect')?.value || 'Загальний';

      if (!title || !rawUrl) {
        alert('Введіть назву треку та посилання (YouTube або прямий .mp3)!');
        return;
      }

      const ytId = extractYoutubeId(rawUrl);
      const isYoutube = !!ytId;

      if (!state.audioPlaylists.includes(playlist)) {
        state.audioPlaylists.push(playlist);
      }

      state.audioTracks.unshift({
        id: (isYoutube ? 'yt_' : 'track_') + Date.now(),
        title,
        url: rawUrl,
        ytId: ytId || '',
        isYoutube: isYoutube,
        isLocalBlob: false,
        playlist
      });

      syncMetaToCloud();
      safeRenderApp();
    };

    window.playUploadedTrack = function(trackId) {
      const tr = state.audioTracks.find(t => t.id === trackId);
      if (!tr) return;

      stopWebAudioAmbient();
      stopHtml5Audio();
      stopYoutubeAudio();

      const ytId = tr.ytId || extractYoutubeId(tr.url);

      if (tr.isYoutube || ytId) {
        state.audioState.activeTrackId = tr.id;
        state.audioState.activeTitle = tr.title;
        state.audioState.activeUrl = tr.url;
        state.audioState.activeYtId = ytId;
        state.audioState.mode = 'youtube';
        state.audioState.isPlaying = true;
        state.audioState.updatedAt = Date.now();

        startYoutubePlayback(ytId);
      } else {
        const audioEl = document.getElementById('globalAudioElement');
        const playUrl = localAudioBlobs[tr.id] || tr.url;

        state.audioState.activeTrackId = tr.id;
        state.audioState.activeTitle = tr.title;
        state.audioState.activeUrl = tr.isLocalBlob ? '' : tr.url;
        state.audioState.activeYtId = '';
        state.audioState.mode = tr.isLocalBlob ? 'file' : 'url';
        state.audioState.isPlaying = true;
        state.audioState.updatedAt = Date.now();

        if (audioEl && playUrl) {
          audioEl.src = playUrl;
          audioEl.loop = true;
          audioEl.volume = Number(state.audioState.volume || 0.6);
          audioEl.play().catch(() => {});
        }
      }

      syncMetaToCloud();
      safeRenderApp();
    };

    window.stopAllAudio = function() {
      stopWebAudioAmbient();
      stopHtml5Audio();
      stopYoutubeAudio();
      state.audioState.isPlaying = false;
      state.audioState.updatedAt = Date.now();
      syncMetaToCloud();
      safeRenderApp();
    };

    window.changeAudioVolume = function(val) {
      const v = Math.min(1, Math.max(0, Number(val)));
      state.audioState.volume = v;

      const audioEl = document.getElementById('globalAudioElement');
      if (audioEl) audioEl.volume = v;

      if (ytPlayer && ytPlayerReady && typeof ytPlayer.setVolume === 'function') {
        try { ytPlayer.setVolume(Math.round(v * 100)); } catch (_) {}
      }

      if (state.audioState.isPlaying && state.audioState.mode === 'synth') {
        const preset = BUILTIN_AMBIENTS.find(p => p.id === state.audioState.activeTrackId);
        if (preset) startWebAudioAmbient(preset);
      }
    };

    window.deleteAudioTrack = function(trackId) {
      state.audioTracks = state.audioTracks.filter(t => t.id !== trackId);
      if (state.audioState.activeTrackId === trackId) {
        window.stopAllAudio();
      } else {
        syncMetaToCloud();
        safeRenderApp();
      }
    };

    window.syncAudioFromState = function(forcePlayGesture = false) {
      if (!state.audioState.isPlaying) {
        stopWebAudioAmbient();
        stopHtml5Audio();
        stopYoutubeAudio();
        return;
      }

      if (state.audioState.mode === 'synth') {
        stopHtml5Audio();
        stopYoutubeAudio();
        const preset = BUILTIN_AMBIENTS.find(p => p.id === state.audioState.activeTrackId);
        if (preset) startWebAudioAmbient(preset);
      } else if (state.audioState.mode === 'youtube' && state.audioState.activeYtId) {
        stopWebAudioAmbient();
        stopHtml5Audio();
        startYoutubePlayback(state.audioState.activeYtId);
      } else if (state.audioState.mode === 'url' && state.audioState.activeUrl) {
        stopWebAudioAmbient();
        stopYoutubeAudio();
        const audioEl = document.getElementById('globalAudioElement');
        if (audioEl) {
          if (audioEl.src !== state.audioState.activeUrl) {
            audioEl.src = state.audioState.activeUrl;
          }
          audioEl.loop = true;
          audioEl.volume = Number(state.audioState.volume || 0.6);
          if (audioEl.paused || forcePlayGesture) {
            audioEl.play().catch(() => {});
          }
        }
      }
    };

                    <button onclick="selectCharacterById('${esc(p.id)}'); switchMainTab('all');" class="px-3 py-1.5 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-bold hover:bg-amber-500/30">

                    <button onclick="gmDeleteCharacter('${esc(p.id)}')" class="px-2.5 py-1.5 rounded-lg bg-red-500/15 border border-red-500/30 text-red-300 text-xs font-bold hover:bg-red-500/30" title="Видалити персонажа">

                    <button onclick="gmModifyInspiration('${esc(p.id)}', -1)" class="px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold">-1 🌀</button>

    /********************************************************************
     * 12. ВКЛАДКА «👥 ІНШІ ГРАВЦІ»
     ********************************************************************/
    function renderOtherPlayersSection() {
      const allPlayers = Object.values(state.characters)
        .map(c => normalizeCharacter(c))
        .filter(c => !c.isNpc);

      if (allPlayers.length === 0) {
        return `
          <div class="bio-card w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-6 text-center text-slate-400">
            У кімнаті «${esc(state.roomCode)}» ще немає створених персонажів гравців.
          </div>
        `;
      }

      return `
        <div class="w-full space-y-4">
          <div class="bio-card bg-slate-900/90 border border-slate-800 rounded-2xl p-5 flex flex-wrap items-center justify-between gap-3 overflow-hidden">
            ${getCardCornerVineSVG()}
            <div class="relative z-10">
              <h2 class="text-lg font-extrabold uppercase tracking-wide text-white">👥 Усі Гравці Кімнати «${esc(state.roomCode)}» (${allPlayers.length})</h2>
              <p class="text-xs text-slate-400 mt-0.5">
                Дані синхронізуються між усіма пристроями в реальному часі.
              </p>
            </div>
            <div class="flex items-center gap-2 relative z-10">
              <button
                type="button"
                onclick="forceCloudSyncNow()"
                class="px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-bold text-cyan-300"
              >
                🔄 Синхронізувати зараз
              </button>
              <button
                type="button"
                onclick="state.ui.simulateOtherView = !state.ui.simulateOtherView; safeRenderApp();"
                class="px-3.5 py-2 rounded-xl text-xs font-extrabold border transition-all ${
                  state.ui.simulateOtherView
                    ? 'bg-amber-500/20 border-amber-400 text-amber-300'
                    : 'bg-slate-950 border-slate-700 text-slate-300'
                }"
              >
                ${state.ui.simulateOtherView ? '👀 Моя картка: Очима інших' : '🔓 Моя картка: Показати все'}
              </button>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${allPlayers.map(p => renderPublicPlayerCard(p, false)).join('')}
          </div>
        </div>
      `;
    }

    /********************************************************************
     * 13. ВКЛАДКА «🗺️ КАРТА ЕНТРОПІЇ»
     ********************************************************************/
    function renderMapSection() {
      const isGM = state.session.role === 'gm';
      const effectiveRole = isGM ? (state.ui.mapForceRole || 'gm') : 'player';

      const mapUrl = effectiveRole === 'gm'
        ? `${MAP_BASE_URL}?role=gm&mode=admin&admin=true&v=${state.ui.mapCacheBust}#admin`
        : `${MAP_BASE_URL}?role=player&mode=player&v=${state.ui.mapCacheBust}#player`;

      return `
        <section class="bio-card w-full bg-slate-900/95 border border-slate-800 rounded-2xl p-4 md:p-5 space-y-4 shadow-xl overflow-hidden">
          ${getCardCornerVineSVG()}
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3 relative z-10">
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-base font-black uppercase tracking-wider text-white">🗺️ Інтерактивна Карта «ЕНТРОПІЯ»</h2>
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${
                  effectiveRole === 'gm'
                    ? 'bg-amber-500/20 text-amber-300 border-amber-500/40'
                    : 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40'
                }">
                  ${effectiveRole === 'gm' ? '👑 Режим Адміна (Майстер)' : '👤 Режим Гравця'}
                </span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">
                Прямий міст <code class="text-emerald-400">entropia_ark_sync_channel</code> активний. Усі зміни персонажа передаються на карту миттєво.
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              ${
                isGM
                  ? `
                  <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
                    <button
                      type="button"
                      onclick="setMapForceRole('gm')"
                      class="px-2.5 py-1 rounded-lg text-xs font-bold ${
                        effectiveRole === 'gm' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'
                      }"
                    >
                      👑 Адмін-карта
                    </button>
                    <button
                      type="button"
                      onclick="setMapForceRole('player')"
                      class="px-2.5 py-1 rounded-lg text-xs font-bold ${
                        effectiveRole === 'player' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'
                      }"
                    >
                      👁️ Вигляд Гравця
                    </button>
                  </div>
                `
                  : ''
              }

              <button
                type="button"
                onclick="broadcastCharacterToMap()"
                class="px-3 py-1.5 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-xs font-bold text-emerald-300"
                title="Примусово відправити поточного персонажа на карту"
              >
                📡 Передати персонажа на карту
              </button>

              <button
                type="button"
                onclick="refreshEntropiaMap()"
                class="px-3 py-1.5 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-700 text-xs font-bold text-slate-200"
              >
                🔄 Оновити карту
              </button>

              <button
                type="button"
                onclick="state.ui.mapTall = !state.ui.mapTall; safeRenderApp();"
                class="px-3 py-1.5 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-700 text-xs font-bold text-slate-200"
              >
                ${state.ui.mapTall ? '🗗 Звичайний розмір' : '⛶ Розгорнути вище'}
              </button>

              <a
                href="${esc(mapUrl)}"
                target="_blank"
                rel="noopener noreferrer"
                class="px-3 py-1.5 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/40 text-xs font-bold text-cyan-300"
              >
                ↗ У новій вкладці
              </a>
            </div>
          </div>

          <div class="w-full rounded-xl overflow-hidden border border-slate-800 bg-slate-950 relative z-10">
            <iframe
              id="entropiaMapIframe"
              src="${esc(mapUrl)}"
              onload="setTimeout(() => window.broadcastCharacterToMap(), 500)"
              class="w-full ${state.ui.mapTall ? 'h-[84vh]' : 'h-[68vh]'} border-0"
              allow="fullscreen; clipboard-read; clipboard-write"
              title="Інтерактивна Карта Ентропії"
            ></iframe>
          </div>
        </section>
      `;

    /********************************************************************
     * 14. ВКЛАДКА «🎵 ТРЕКИ МАЙСТРА ТА ПЛЕЙЛИСТИ (YOUTUBE + MP3)»
     ********************************************************************/
    function renderAudioSection() {
      const isGM = state.session.role === 'gm';
      const playlists = (state.audioPlaylists && state.audioPlaylists.length > 0)
        ? state.audioPlaylists
        : [...DEFAULT_PLAYLISTS];
      const selectedFilter = state.ui.selectedPlaylistFilter || 'ALL';
      const visiblePlaylists = selectedFilter === 'ALL'
        ? playlists
        : playlists.filter(p => p === selectedFilter);

      return `
        <section class="bio-card w-full bg-slate-900/95 border border-slate-800 rounded-2xl p-5 space-y-6 shadow-xl overflow-hidden">
          ${getCardCornerVineSVG()}
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4 relative z-10">
            <div>
              <h2 class="text-base font-black uppercase tracking-wider text-white">🎵 Аудіо-пульт, Сценарії та YouTube Ефір</h2>
              <p class="text-xs text-slate-400 mt-0.5">
                Створюйте плейлисти під ігрові сценарії та запускайте треки з <b>YouTube</b> або прямих <b>.mp3 посилань (GitHub)</b> синхронно для всіх гравців!
              </p>
            </div>
            <div class="flex items-center gap-2">
              ${
                state.audioState.isPlaying
                  ? `
                  <span class="px-3 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-bold">
                    🔊 Зараз в ефірі: ${esc(state.audioState.activeTitle)}
                  </span>
                  ${isGM ? `<button type="button" onclick="stopAllAudio()" class="px-4 py-2 rounded-xl bg-red-500 hover:bg-red-400 text-slate-950 font-black text-xs">⏹ Зупинити ефір</button>` : ''}
                `
                  : `<span class="text-xs text-slate-500 italic">Ефір наразі зупинено</span>`
              }
            </div>
          </div>

          <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3 relative z-10">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="text-xs font-extrabold uppercase tracking-wider text-cyan-400">
                📁 Плейлисти / Сценарії гри (швидкий фільтр):
              </div>

              ${
                isGM
                  ? `
                  <div class="flex items-center gap-2">
                    <input
                      id="newPlaylistNameInput"
                      type="text"
                      placeholder="Новий сценарій (напр.: Таверна / Бос)..."
                      class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-cyan-400"
                    />
                    <button
                      type="button"
                      onclick="createNewPlaylistFromInput()"
                      class="px-3.5 py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs shrink-0"
                    >
                      + Створити плейлист
                    </button>
                  </div>
                `
                  : ''
              }
            </div>

            <div class="flex flex-wrap items-center gap-2 pt-1">
              <button
                type="button"
                onclick="setPlaylistFilter('ALL')"
                class="px-3 py-1.5 rounded-xl text-xs font-extrabold border transition-all ${
                  selectedFilter === 'ALL'
                    ? 'bg-cyan-500 text-slate-950 border-cyan-400 shadow'
                    : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-700'
                }"
              >
                🗂️ Усі плейлисти (${state.audioTracks.length})
              </button>

              ${playlists.map(pl => {
                const count = state.audioTracks.filter(t => (t.playlist || 'Загальний') === pl).length;
                const active = selectedFilter === pl;
                return `
                  <button
                    type="button"
                    onclick="setPlaylistFilter('${esc(pl)}')"
                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${
                      active
                        ? 'bg-amber-500 text-slate-950 border-amber-400 shadow'
                        : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-700'
                    }"
                  >
                    📁 ${esc(pl)} (${count})
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          ${
            isGM
              ? `
              <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 relative z-10">
                <form onsubmit="addUrlOrYoutubeTrack(event)" class="lg:col-span-8 p-4 rounded-xl bg-slate-950 border border-cyan-500/30 space-y-3">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="text-xs font-extrabold uppercase tracking-wider text-amber-400">
                      ▶ Додати трек із YouTube або прямий .mp3 (Синхронно для всіх гравців)
                    </div>
                    <span class="text-[10px] px-2 py-0.5 rounded bg-red-500/20 text-red-300 border border-red-500/30 font-bold">
                      Підтримує YouTube & GitHub MP3
                    </span>
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
                    <div class="sm:col-span-5">
                      <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Назва треку *</label>
                      <input
                        id="audioTitleInput"
                        type="text"
                        placeholder="Напр.: Ембієнт лісу / Тема битви"
                        class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-cyan-400"
                        required
                      />
                    </div>

                    <div class="sm:col-span-4">
                      <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">У який плейлист додати</label>
                      <select
                        id="audioPlaylistSelect"
                        class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white focus:outline-none focus:border-cyan-400"
                      >
                        ${playlists.map(pl => `
                          <option value="${esc(pl)}" ${(selectedFilter !== 'ALL' && selectedFilter === pl) ? 'selected' : ''}>
                            📁 ${esc(pl)}
                          </option>

                      </select>
                    </div>

                    <div class="sm:col-span-3 flex items-end">

                        type="submit"

                      </button>

                  </div>

                  <div>
                    <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">

                    </label>
                    <input
                      id="audioUrlInput"
                      type="url"
                      placeholder="https://www.youtube.com/watch?v=... або https://nazarshulik0-dotcom.github.io/.../track.mp3"
                      class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white font-mono focus:outline-none focus:border-cyan-400"
                      required
                    />
                  </div>
                </form>

                <div class="lg:col-span-4 p-4 rounded-xl bg-slate-950 border border-slate-800 flex flex-col justify-between space-y-2.5">
                  <div class="space-y-2">
                    <div class="text-xs font-extrabold uppercase tracking-wider text-emerald-400">
                      📂 Локальний файл (Тільки на цьому пристрої)
                    </div>
                    <div>
                      <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Плейлист для завантаження:</label>
                      <select
                        id="localUploadPlaylistSelect"
                        class="w-full px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white"
                      >
                        ${playlists.map(pl => `
                          <option value="${esc(pl)}" ${(selectedFilter !== 'ALL' && selectedFilter === pl) ? 'selected' : ''}>
                            📁 ${esc(pl)}
                          </option>
                        `).join('')}
                      </select>
                    </div>
                  </div>
                  <input
                    type="file"
                    accept="audio/*"
                    multiple
                    onchange="handleLocalAudioUpload(event)"
                    class="block w-full text-xs text-slate-300 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-extrabold file:bg-emerald-500 file:text-slate-950 hover:file:bg-emerald-400 cursor-pointer"
                  />
                </div>
              </div>
            `
              : ''
          }

          <div class="space-y-4 relative z-10">
            ${visiblePlaylists.map(playlistName => {
              const tracksInPl = state.audioTracks.filter(t => (t.playlist || 'Загальний') === playlistName);
              return `
                <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
                  <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 pb-2.5">
                    <div class="flex items-center gap-2">
                      <span class="font-black text-sm text-cyan-300">📁 ${esc(playlistName)}</span>
                      <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-slate-400 font-bold">
                        Треків: ${tracksInPl.length}
                      </span>
                    </div>
                    ${
                      isGM && playlistName !== 'Загальний'
                        ? `<button type="button" onclick="deletePlaylist('${esc(playlistName)}')" class="text-xs text-red-400 hover:underline font-semibold">🗑️ Видалити плейлист</button>`
                        : ''
                    }
                  </div>

                  ${
                    tracksInPl.length === 0
                      ? `<div class="text-xs text-slate-500 italic py-2">У плейлисті «${esc(playlistName)}» поки немає треків.</div>`
                      : `<div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                          ${tracksInPl.map(tr => {
                            const active = state.audioState.isPlaying && state.audioState.activeTrackId === tr.id;
                            const isYt = !!(tr.isYoutube || tr.ytId);
                            return `
                              <div class="p-3 rounded-xl bg-slate-900/90 border ${active ? 'border-emerald-400 bg-emerald-500/5' : 'border-slate-800'} flex flex-wrap items-center justify-between gap-2">
                                <div class="min-w-0 flex-1">
                                  <div class="flex items-center gap-1.5">
                                    <span class="px-1.5 py-0.5 rounded text-[10px] font-black ${

                                        ? 'bg-red-500/20 text-red-300 border border-red-500/30'

                                        ? 'bg-slate-800 text-slate-300'
                                        : 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'
                                    }">
                                      ${isYt ? '▶ YouTube' : tr.isLocalBlob ? '📂 Локальний' : '🔗 MP3'}

                                    <span class="text-xs font-extrabold text-white truncate">${esc(tr.title)}</span>
                                  </div>
                                  <div class="text-[10px] text-slate-500 truncate mt-0.5">

                                    isGM
