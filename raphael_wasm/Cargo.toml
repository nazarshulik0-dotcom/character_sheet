[package]
name = "raphael_wasm"
version = "1.0.0"
edition = "2021"
description = "Rust/WASM Particle Morphing (Sphere -> Manas), Audio DSP & Instant VAD for Raphael AI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"