name: Build Raphael Rust WASM

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'raphael_wasm/Cargo.toml'
      - 'raphael_wasm/src/**'
      - '.github/workflows/build-raphael-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wasm:
    name: Compile raphael_wasm to WebAssembly
    runs-on: ubuntu-latest

    steps:
      - name: 1. Загрузка кода репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Установка компилятора Rust и цели wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 3. Кэширование зависимостей Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "raphael_wasm -> target"

      - name: 4. Установка wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: 5. Компиляция Rust в WebAssembly (Release Mode)
        run: |
          wasm-pack build raphael_wasm --target web --out-dir pkg --release
          rm -f raphael_wasm/pkg/.gitignore
          rm -f raphael_wasm/pkg/package.json

      - name: 6. Авто-коммит готовых файлов .wasm и .js в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -f raphael_wasm/pkg/*

          if git diff --staged --quiet; then
            echo "🟢 Бинарник WASM уже актуален, новый коммит не нужен."
          else
            git commit -m "⚙️ Auto-build raphael_wasm pkg"
            git pull --rebase origin main
            git push
            echo "🚀 Скомпилированный raphael_wasm/pkg успешно обновлён!"
          fi
