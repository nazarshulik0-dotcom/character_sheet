name: Build Rust WASM Modules

on:
  push:
    branches:
      - main
    paths:
      - 'raphael_wasm/**'
      - 'aether_wasm/**'
      - '.github/workflows/build-raphael-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build raphael_wasm
        run: |
          cd raphael_wasm
          wasm-pack build --target web --out-dir pkg --release
          rm -f pkg/.gitignore

      - name: Build aether_wasm (if present)
        run: |
          if [ -f "aether_wasm/Cargo.toml" ]; then
            cd aether_wasm
            wasm-pack build --target web --out-dir pkg --release
            rm -f pkg/.gitignore
          fi

      - name: Commit and push compiled WASM packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f raphael_wasm/pkg/
          if [ -d "aether_wasm/pkg" ]; then
            git add -f aether_wasm/pkg/
          fi
          git status
          git diff --staged --quiet || (git commit -m "🦀 Auto-build Rust WASM packages" && git push)
