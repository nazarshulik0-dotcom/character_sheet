                      `).join('') || `<span class="text-xs text-slate-500 italic">Список порожній. Створіть персонажа кнопкою праворуч.</span>`
                    }
                  </div>
                </div>
              </div>
            `
              : ''
          }

          <!-- ГОЛОВНІ ВКЛАДКИ НАВІГАЦІЇ -->
          <div class="bg-slate-950 border-t border-slate-800/80 px-4 py-2">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center gap-2">
              ${navTabs.map(tab => `
                <button
                  type="button"
                  onclick="switchMainTab('${tab.id}')"
                  class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition-all ${
                    state.session.activeTab === tab.id
                      ? 'bg-cyan-500 text-slate-950 shadow-[0_0_15px_rgba(34,211,238,0.3)]'
                      : 'bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800'
                  }"
                >
                  ${tab.label}
                </button>
              `).join('')}
            </div>
          </div>
        </header>

        <main class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
          ${
            state.session.activeTab === 'others'
              ? renderOtherPlayersSection()
              : state.session.activeTab === 'map'
              ? renderMapSection()
              : state.session.activeTab === 'audio'
              ? renderAudioSection()
              : (!char
                  ? `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center space-y-3">
                      <p class="text-slate-300 font-bold">Персонажа ще не обрано або не створено.</p>
                      ${isGM ? `<button onclick="gmCreateCharacter(false)" class="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-black text-xs">+ Створити Персонажа</button>` : ''}
                    </div>`
                  : renderCharacterContent(char))
          }
        </main>
      `;
    }

    /********************************************************************
     * 16. РЕНДЕРИНГ ВМІСТУ ЛИСТА ПЕРСОНАЖА
     ********************************************************************/
    function renderCharacterContent(char) {
      const isGM = state.session.role === 'gm';
      const tab = state.session.activeTab;

      const headerHTML = `
        <section class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-center">
            <!-- Ім'я та Спеціалізація -->
            <div class="lg:col-span-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Ім'я персонажа / Позивний</label>
                <input
                  type="text"
                  value="${esc(char.name)}"
                  oninput="updateTextField('name', this.value)"
                  class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-white font-extrabold text-base focus:outline-none focus:border-cyan-400"
                />
              </div>
              <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Роль / Спеціалізація</label>
                <input
                  type="text"
                  value="${esc(char.archetype)}"
                  oninput="updateTextField('archetype', this.value)"
                  placeholder="Напр.: Снайпер-розвідник"
                  class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-cyan-400"
                />
              </div>
            </div>

            <!-- Блок Натхнення (🌀) -->
            <div class="lg:col-span-4 bg-slate-950/90 border border-indigo-500/30 rounded-xl p-3 flex items-center justify-between gap-3">
              <div class="flex items-center gap-2.5">
                <button
                  type="button"
                  onclick="playerRequestInspiration()"
                  class="w-11 h-11 rounded-xl bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-2xl hover:scale-105 transition-transform"
                  title="Натисніть, щоб запросити використання Натхнення у Майстра"
                >
                  🌀
                </button>
                <div>
                  <div class="text-xs font-extrabold uppercase tracking-wider text-indigo-300">
                    Натхнення: <span class="text-white text-base">${char.inspiration.count}</span>
                  </div>
                  <div class="text-[11px] text-slate-400">
                    ${
                      char.inspiration.pendingRequest
                        ? '<span class="text-amber-300 font-bold animate-pulse">⏳ Очікує рішення Майстра...</span>'
                        : char.inspiration.lastStatus === 'approved'
                        ? '<span class="text-emerald-400 font-bold">✅ Майстер схвалив Натхнення!</span>'
                        : char.inspiration.lastStatus === 'rejected'
                        ? '<span class="text-red-400 font-bold">❌ Майстер відхилив запит</span>'
                        : 'Натисніть 🌀 для запиту Майстру'
                    }
                  </div>
                </div>
              </div>

              ${
                isGM
                  ? `<div class="flex items-center gap-1">
                      <button type="button" onclick="gmModifyInspiration('${esc(char.id)}', 1)" class="px-2.5 py-1.5 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-slate-950 font-extrabold text-xs">+1</button>
                      <button type="button" onclick="gmModifyInspiration('${esc(char.id)}', -1)" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs">-1</button>
                    </div>`
                  : `<button
                      type="button"
                      onclick="playerRequestInspiration()"
                      ${char.inspiration.count <= 0 || char.inspiration.pendingRequest ? 'disabled' : ''}
                      class="px-3 py-1.5 rounded-lg bg-indigo-500/25 hover:bg-indigo-500/40 disabled:opacity-40 border border-indigo-400/40 text-indigo-200 text-xs font-bold whitespace-nowrap"
                    >
                      Використати 🌀
                    </button>`
              }
            </div>

            <!-- Блок Приватності + Кнопка Попереднього Перегляду -->
            <div class="lg:col-span-4 bg-slate-950/90 border border-slate-800 rounded-xl p-3 space-y-2">
              <div class="flex items-center justify-between gap-2">
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                  Приватність для інших гравців:
                </span>
                <button
                  type="button"
                  onclick="togglePrivacyPreview()"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold border transition-all ${
                    state.ui.privacyPreviewOpen
                      ? 'bg-amber-500 text-slate-950 border-amber-400'
                      : 'bg-slate-900 hover:bg-slate-800 text-amber-300 border-amber-500/30'
                  }"
                >
                  ${state.ui.privacyPreviewOpen ? '✕ Закрити перегляд' : '👀 Як бачать інші?'}
                </button>
              </div>

              <div class="grid grid-cols-3 gap-1.5">
                <button
                  type="button"
                  onclick="togglePrivacyField('hideStats')"
                  class="px-2 py-1.5 rounded-lg text-[11px] font-bold border transition-all text-center ${
                    char.privacy.hideStats
                      ? 'bg-red-500/20 border-red-500/40 text-red-300'
                      : 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300'
                  }"
                >
                  ${char.privacy.hideStats ? '🔒 Стати: Сховані' : '👁️ Стати: Видимі'}
                </button>
                <button
                  type="button"
                  onclick="togglePrivacyField('hideHealth')"
                  class="px-2 py-1.5 rounded-lg text-[11px] font-bold border transition-all text-center ${
                    char.privacy.hideHealth
                      ? 'bg-red-500/20 border-red-500/40 text-red-300'
                      : 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300'
                  }"
                >
                  ${char.privacy.hideHealth ? '🔒 ХП: Сховане' : '👁️ ХП: Видиме'}
                </button>
                <button
                  type="button"
                  onclick="togglePrivacyField('hideSkills')"
                  class="px-2 py-1.5 rounded-lg text-[11px] font-bold border transition-all text-center ${
                    char.privacy.hideSkills
                      ? 'bg-red-500/20 border-red-500/40 text-red-300'
                      : 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300'
                  }"
                >
                  ${char.privacy.hideSkills ? '🔒 Навички: Сховані' : '👁️ Навички: Видимі'}
                </button>
              </div>
            </div>
          </div>

          ${
            state.ui.privacyPreviewOpen
              ? `
              <div class="p-4 rounded-2xl bg-slate-950 border-2 border-amber-500/40 space-y-3">
                <div class="text-xs font-black uppercase tracking-wider text-amber-300">
                  👀 Попередній перегляд: ось так вашу картку зараз бачать інші гравці
                </div>
                <div class="max-w-xl">
                  ${renderPublicPlayerCard(char, true)}
                </div>
              </div>
            `
              : ''
          }
        </section>
      `;

      const mainStatsAndWoundsHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 w-full">
          <div class="lg:col-span-5 space-y-6">
            <!-- 6 Базових Характеристик -->
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                <h2 class="text-sm font-black uppercase tracking-wider text-white">⚡ Характеристики (Макс. 6)</h2>
                <span class="text-[11px] px-2.5 py-0.5 rounded-full font-bold border ${
                  char.privacy.hideStats
                    ? 'bg-red-500/15 border-red-500/30 text-red-300'
                    : 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300'
                }">
                  ${char.privacy.hideStats ? '🔒 Приховано від інших' : '👁️ Видимо іншим'}
                </span>
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                ${STATS.map(st => {
                  const val = char.stats[st.id];
                  const penalty = getWoundPenalty(char, st.id);
                  const pool = getDicePoolForStat(char, st.id, false);
                  const isSelected = state.diceRoller.selectedStat === st.id;

                  return `
                    <div
                      onclick="selectDiceStat('${st.id}')"
                      class="cursor-pointer rounded-xl p-3 border transition-all flex flex-col justify-between ${
                        isSelected
                          ? 'bg-cyan-500/15 border-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.2)]'
                          : 'bg-slate-950/90 border-slate-800 hover:border-slate-700'
                      }"
                    >
                      <div class="flex items-center justify-between">
                        <span class="text-2xl">${st.icon}</span>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-slate-900 text-slate-300">
                          Пул: ${pool}🎲
                        </span>
                      </div>

                      <div class="my-2">
                        <div class="text-xs font-bold text-slate-300">${st.name}</div>${penalty > 0 ? `<div class="text-[10px] text-red-400 font-semibold">Травма: -${penalty} куб.</div>` : '<div class="text-[10px] text-slate-500">Без штрафу</div>'}
                      </div>

                      <div class="flex items-center justify-between bg-slate-900 rounded-lg p-1 border border-slate-800" onclick="event.stopPropagation()">
                        <button
                          type="button"
                          onclick="changeStat('${st.id}', -1)"
                          ${val <= 1 ? 'disabled' : ''}
                          class="w-7 h-7 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-white font-black text-sm"
                        >−</button>
                        <span class="font-black text-lg text-white">${val}</span>
                        <button
                          type="button"
                          onclick="changeStat('${st.id}', 1)"
                          ${val >= 6 ? 'disabled' : ''}
                          class="w-7 h-7 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-white font-black text-sm"
                        >+</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Стіл кидків кубиків -->
            ${renderDiceRollerBox(char)}
          </div>

          <div class="lg:col-span-7 space-y-6">
            ${renderWoundsAndHpBox(char)}
          </div>
        </div>
      `;

      const skillsSectionHTML = renderSkillsBox(char);
      const inventorySectionHTML = renderInventoryBox(char);
      const logSectionHTML = renderRollLogBox(char);

      if (tab === 'skills') return headerHTML + skillsSectionHTML;
      if (tab === 'inventory') return headerHTML + inventorySectionHTML;
      if (tab === 'log') return headerHTML + logSectionHTML;

      return `
        ${headerHTML}
        ${mainStatsAndWoundsHTML}
        ${skillsSectionHTML}
        ${inventorySectionHTML}
        ${logSectionHTML}
      `;
    }

    /********************************************************************
     * 17. СТІЛ КИДКІВ КУБИКІВ «ВІТРУВІЯ» (💠)
     ********************************************************************/
    function renderDiceRollerBox(char) {
      const selId = state.diceRoller.selectedStat || 'health';
      const selStat = STATS.find(s => s.id === selId) || STATS[0];
      const baseVal = char.stats[selId];
      const penalty = getWoundPenalty(char, selId);
      const { diceMod, flatBonus } = getActiveSkillModifiers(char, selId);
      const extraMod = Number(state.diceRoller.extraDiceMod || 0);
      const pool = getDicePoolForStat(char, selId, true);
      const isRolling = state.diceRoller.isRolling;
      const lastRoll = state.diceRoller.lastRoll;

      const relevantSkills = (char.skills || []).filter(sk =>
        sk.effectType !== 'none' && (sk.statId === selId || sk.statId === 'any')
      );

      return `
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
              <h2 class="text-sm font-black uppercase tracking-wider text-white">🎲 Стіл Кидків Кубиків «Вітрувія»</h2>
              <p class="text-xs text-slate-400">Оберіть характеристику, активуйте навички та кидайте куби</p>
            </div>
            <div class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-right">
              <div class="text-[10px] uppercase font-bold text-slate-400">Підсумковий пул</div>
              <div class="text-xl font-black text-cyan-400">${pool} 🎲</div>
            </div>
          </div>

          <!-- 1. Вибір характеристики -->
          <div>
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">1. Перевірка характеристики:</div>
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5">
              ${STATS.map(st => {
                const active = st.id === selId;
                const stPool = getDicePoolForStat(char, st.id, false);
                return `
                  <button
                    type="button"
                    onclick="selectDiceStat('${st.id}')"
                    class="p-2 rounded-xl border text-center transition-all flex flex-col items-center gap-0.5 ${
                      active
                        ? 'bg-cyan-500/20 border-cyan-400 text-white shadow'
                        : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'
                    }"
                  >
                    <span class="text-lg">${st.icon}</span>
                    <span class="text-[10px] font-bold truncate w-full">${st.name}</span>
                    <span class="text-[10px] font-black text-slate-300">${stPool}🎲</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Формула пулу + ручний модифікатор -->
          <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-2.5">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
              <span>База <b>${selStat.icon} ${selStat.name}</b>: <b>${baseVal}</b></span>
              <span class="${penalty > 0 ? 'text-red-400 font-bold' : 'text-slate-500'}">Травми: −${penalty}🎲</span>
              <span class="${diceMod !== 0 ? 'text-emerald-400 font-bold' : 'text-slate-500'}">Навички: ${diceMod >= 0 ? '+' + diceMod : diceMod}🎲</span>
              ${flatBonus !== 0 ? `<span class="text-amber-300 font-bold">Бонус балів: +${flatBonus}</span>` : ''}
            </div>

            <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs">
              <span class="text-slate-400 font-semibold">Ситуативний модифікатор кубів:</span>
              <div class="flex items-center gap-1.5">
                <button type="button" onclick="changeExtraDiceMod(-1)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 text-white font-bold">−</button>
                <span class="w-10 text-center font-black ${extraMod > 0 ? 'text-emerald-400' : extraMod < 0 ? 'text-red-400' : 'text-slate-300'}">
                  ${extraMod >= 0 ? '+' + extraMod : extraMod}🎲
                </span>
                <button type="button" onclick="changeExtraDiceMod(1)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 text-white font-bold">+</button>
              </div>
            </div>
          </div>

          <!-- Активні та пасивні навички для цього кидка -->
          ${
            relevantSkills.length > 0
              ? `<div class="space-y-1.5">
                  <div class="text-[11px] font-bold uppercase text-slate-400">2. Модифікатори навичок:</div>
                  <div class="flex flex-wrap gap-1.5">
                    ${relevantSkills.map(sk => {
                      const isPassive = sk.effectType === 'passive';
                      const applied = isSkillApplied(sk);
                      return `
                        <button
                          type="button"
                          onclick="${isPassive ? '' : `toggleSkillActive('${esc(sk.id)}')`}"
                          class="px-2.5 py-1 rounded-lg text-xs font-bold border transition-all ${
                            applied
                              ? 'bg-emerald-500/20 border-emerald-400 text-emerald-200'
                              : 'bg-slate-950 border-slate-800 text-slate-500'
                          }"
                        >
                          ${isPassive ? '⚡ Пасивна:' : (applied ? '✓ Активна:' : '○ Умовна:')} ${esc(sk.name)} (${sk.diceMod >= 0 ? '+' + sk.diceMod : sk.diceMod}🎲)
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>`
              : ''
          }

          <!-- Легенда граней кубика -->
          <div class="grid grid-cols-3 gap-2 p-2.5 rounded-xl bg-slate-950/70 border border-slate-800/80 text-[11px]">
            <div class="flex items-center gap-2">
              <div class="shrink-0">${getEntropiaSymbolHTML('full', 'w-6 h-6')}</div>
              <div>
                <div class="font-bold text-white">2 Очки</div>
                <div class="text-[10px] text-slate-500">1 грань із 6</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <div class="shrink-0">${getEntropiaSymbolHTML('half', 'w-6 h-6')}</div>
              <div>
                <div class="font-bold text-slate-200">1 Очко</div>
                <div class="text-[10px] text-slate-500">2 грані з 6</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <div class="shrink-0">${getEntropiaSymbolHTML('empty', 'w-6 h-6')}</div>
              <div>
                <div class="font-bold text-slate-400">0 Очок</div>
                <div class="text-[10px] text-slate-500">3 грані з 6</div>
              </div>
            </div>
          </div>

          <button
            type="button"
            onclick="rollVitruviumDice('${selId}')"
            ${isRolling ? 'disabled' : ''}
            class="w-full py-3.5 rounded-xl font-black uppercase tracking-wider text-sm bg-cyan-500 hover:bg-cyan-400 text-slate-950 shadow-[0_0_20px_rgba(34,211,238,0.3)] transition-all"
          >
            ${isRolling ? '🎲 Кубики котяться по столу...' : `🎲 Кинути ${pool} куб. на «${selStat.name}»`}
          </button>

          <!-- Ігровий стіл результату кидка -->
          <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 min-h-[145px] flex flex-col justify-between space-y-3">
            ${
              isRolling
                ? `
                <div class="flex flex-col items-center justify-center py-6 space-y-3">
                  <div class="flex flex-wrap items-center justify-center gap-3">
                    ${Array.from({ length: Math.max(1, state.diceRoller.rollingCount) }).map(() => `
                      <div class="dice-rolling-spin w-14 h-16 rounded-xl bg-slate-900 border border-cyan-500/40 flex items-center justify-center p-2">
                        ${getEntropiaSymbolHTML('full', 'w-8 h-8')}
                      </div>
                    `).join('')}
                  </div>
                  <div class="text-xs font-bold uppercase tracking-wider text-cyan-400 animate-pulse">
                    Кидаємо кубики...
                  </div>
                </div>
              `
                : lastRoll
                ? `
                <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-2.5">
                  <div>
                    <span class="text-xs font-bold text-white">${lastRoll.statIcon}${esc(lastRoll.statName)}</span>
                    <span class="text-[11px] text-slate-500 ml-1.5">(${esc(lastRoll.time)})</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400">Сума балів:</span>
                    <span class="px-3 py-1 rounded-xl font-black text-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">
                      ${lastRoll.totalScore}
                    </span>
                  </div>
                </div>

                <div class="flex flex-wrap gap-2.5 py-1">
                  ${
                    lastRoll.results.length > 0
                      ? lastRoll.results.map((r, idx) => `
                          <div class="dice-land w-14 h-16 rounded-xl bg-slate-900 border-2 ${
                            r.points === 2
                              ? 'border-cyan-400 bg-cyan-500/10'
                              : r.points === 1
                              ? 'border-slate-500 bg-slate-900'
                              : 'border-slate-800 opacity-50'
                          } flex flex-col items-center justify-center p-1 shadow-md" style="animation-delay:${idx * 45}ms">
                            ${getEntropiaSymbolHTML(r.mode, 'w-8 h-8')}
                            <span class="text-[10px] font-black mt-1 ${
                              r.points === 2 ? 'text-white' : r.points === 1 ? 'text-slate-200' : 'text-slate-500'
                            }">+${r.points}</span>
                          </div>
                        `).join('')
                      : `<div class="text-xs text-red-400 font-bold py-4">Пул кубиків дорівнює 0!</div>`
                  }
                </div>

                <div class="pt-2 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-400">
                  <div class="flex flex-wrap items-center gap-3">
                    <span>Повні 💠 (2 бали): <b class="text-white">${lastRoll.countTwo ?? 0}</b></span>
                    <span>Половинки (1 бал): <b class="text-slate-200">${lastRoll.countOne ?? 0}</b></span>
                    <span>Пусті (0): <b class="text-slate-500">${lastRoll.countZero ?? 0}</b></span>
                  </div>
                  ${lastRoll.flatBonus ? `<span class="text-amber-300 font-bold">Бонус навичок: +${lastRoll.flatBonus}</span>` : ''}
                </div>
              `
                : `
                <div class="flex flex-col items-center justify-center py-8 text-center text-slate-500">
                  <div class="text-2xl mb-1">💠</div>
                  <div class="text-xs font-semibold">Стіл для кидків готовий</div>
                  <div class="text-[11px]">Натисніть кнопку кидка вище, щоб зробити перевірку</div>
                </div>
              `
            }
          </div>
        </div>
      `;
    }

    /********************************************************************
     * 18. ЛИСТ ПОРАНЕНЬ ТА ШКАЛА ХП (5 СТАНІВ ЗДОРОВ'Я)
     ********************************************************************/
    function renderWoundsAndHpBox(char) {
      const maxHpCols = Number(char.stats.health || 1);

      return `
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-6">
          <div>
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <h2 class="text-sm font-black uppercase tracking-wider text-white">🩸 Лист Поранень по Характеристиках</h2>
                <p class="text-xs text-slate-400">Кожні 2 замальовані іконки в рядку дають штраф <b>−1 кубик</b> на перевірку цього стату</p>
              </div>
              <span class="text-[11px] px-2.5 py-0.5 rounded-full font-bold border ${
                char.privacy.hideHealth
                  ? 'bg-red-500/15 border-red-500/30 text-red-300'
                  : 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300'
              }">
                ${char.privacy.hideHealth ? '🔒 Травми і ХП приховані' : '👁️ Стан ХП видимий іншим'}
              </span>
            </div>

            <div class="space-y-2">
              ${STATS.map(st => {
                const row = char.wounds[st.id] || [false, false, false, false, false, false];
                const penalty = getWoundPenalty(char, st.id);

                return `
                  <div class="flex items-center justify-between gap-2 p-2 rounded-xl bg-slate-950 border border-slate-800/90">
                    <div class="w-32 sm:w-40 flex items-center gap-2">
                      <span class="text-xl">${st.icon}</span>
                      <div>
                        <div class="text-xs font-bold text-slate-200">${st.name}</div>
                        <div class="text-[10px] ${penalty > 0 ? 'text-red-400 font-bold' : 'text-slate-500'}">
                          Штраф: −${penalty} 🎲
                        </div>
                      </div>
                    </div>

                    <div class="grid grid-cols-6 gap-1.5 flex-1 max-w-xs">
                      ${row.map((marked, idx) => `
                        <button
                          type="button"
                          onclick="toggleWoundCell('${st.id}', ${idx})"
                          class="h-10 rounded-lg border transition-all flex items-center justify-center text-base ${
                            marked
                              ? 'bg-red-500/30 border-red-400 text-white shadow-[inset_0_0_10px_rgba(239,68,68,0.5)]'
                              : 'bg-slate-900 border-slate-800 opacity-35 hover:opacity-75'
                          }"
                        >
                          <span class="${marked ? 'line-through decoration-red-400 decoration-2' : ''}">${st.icon}</span>
                        </button>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="pt-4 border-t border-slate-800">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <h3 class="text-sm font-black uppercase tracking-wider text-white">❤️ Шкала Здоров'я (ХП Персонажа)</h3>
                <p class="text-xs text-slate-400">
                  Усі 5 станів фіксовані. Кількість активних кружечків у кожному рядку дорівнює вашому Здоров'ю: <b>${maxHpCols}</b>
                </p>
              </div>
              <div class="flex items-center gap-2">
                <button
                  type="button"
                  onclick="stepHpDamage(true)"
                  class="px-3 py-1.5 rounded-lg bg-red-500/20 hover:bg-red-500/30 border border-red-500/40 text-red-300 text-xs font-extrabold"
                >
                  −1 ХП (Шкода)
                </button>
                <button
                  type="button"
                  onclick="stepHpDamage(false)"
                  class="px-3 py-1.5 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-300 text-xs font-extrabold"
                >
                  +1 ХП (Лікування)
                </button>
              </div>
            </div>

            <div class="space-y-2 bg-slate-950 p-4 rounded-xl border border-slate-800">
              ${HP_ROWS.map((rowLabel, rIdx) => `
                <div class="flex items-center justify-between gap-3 py-1">
                  <span class="w-36 font-extrabold text-sm ${
                    rIdx === 4 ? 'text-red-400' : rIdx >= 2 ? 'text-amber-300' : 'text-slate-200'
                  }">
                    ${rowLabel}
                  </span>

                  <div class="grid grid-cols-6 gap-2 flex-1 max-w-xs">
                    ${[0, 1, 2, 3, 4, 5].map(cIdx => {
                      const isAvailable = cIdx < maxHpCols;
                      const isFilled = char.hpGrid?.[rIdx]?.[cIdx];

                      if (!isAvailable) {
                        return `
                          <div
                            class="w-9 h-9 rounded-full border border-slate-800 striped-disabled flex items-center justify-center text-[10px] text-slate-600 select-none"
                            title="Недоступно (Здоров'я = ${maxHpCols})"
                          >✕</div>
                        `;
                      }

                      return `
                        <button
                          type="button"
                          onclick="toggleHpCircle(${rIdx}, ${cIdx})"
                          class="w-9 h-9 rounded-full border-2 transition-all flex items-center justify-center ${
                            isFilled
                              ? 'bg-red-500 border-red-300 text-slate-950 font-black shadow-[0_0_12px_rgba(239,68,68,0.6)]'
                              : 'bg-slate-900 border-slate-500 hover:border-white'
                          }"
                        >
                          ${isFilled ? '✕' : ''}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /********************************************************************
     * 19. КАРТКИ НАВИЧОК (З 3 ТИПАМИ ЕФЕКТІВ ТА ПРИХОВАНОЮ ФОРМОЮ)
     ********************************************************************/
    function renderSkillsBox(char) {
      const skills = char.skills || [];
      const isFormOpen = state.ui.skillFormOpen;
      const effType = state.ui.newSkillEffectType || 'active';

      return `
        <section class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
              <div class="flex items-center gap-2.5">
                <h2 class="text-base font-black uppercase tracking-wider text-white">🃏 Картки Навичок та Модифікатори</h2>
                <span class="text-[11px] px-2.5 py-0.5 rounded-full font-bold border ${
                  char.privacy.hideSkills
                    ? 'bg-red-500/15 border-red-500/30 text-red-300'
                    : 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300'
                }">
                  ${char.privacy.hideSkills ? '🔒 Усі навички приховані' : '👁️ Відкриті навички видимі іншим'}
                </span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">
                Підтримуються 3 типи навичок: <b>⚡ Пасивні</b> (діють постійно), <b>🎯 Активні / Умовні</b> (вмикаються за умови) та <b>📘 Без ефектів</b> (описові).
              </p>
            </div>

            <button
              type="button"
              onclick="toggleSkillForm()"
              class="px-4 py-2.5 rounded-xl font-extrabold text-xs uppercase tracking-wider transition-all ${
                isFormOpen
                  ? 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700'
                  : 'bg-cyan-500 hover:bg-cyan-400 text-slate-950 shadow-[0_0_15px_rgba(34,211,238,0.3)]'
              }"
            >
              ${isFormOpen ? '✕ Сховати конструктор' : '+ Створити нову навичку'}
            </button>
          </div>

          ${
            isFormOpen
              ? `
              <form onsubmit="addSkillFromForm(event)" class="bg-slate-950 border-2 border-cyan-500/40 rounded-xl p-4 space-y-4 shadow-xl">
                <div class="flex items-center justify-between">
                  <div class="text-xs font-extrabold uppercase tracking-wider text-cyan-400">
                    ✨ Конструктор нової навички
                  </div>
                  <button type="button" onclick="toggleSkillForm()" class="text-xs text-slate-400 hover:text-white">Закрити ✕</button>
                </div>

                <!-- Вибір типу ефекту навички -->
                <div>
                  <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1.5">Тип ефекту навички:</label>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <button
                      type="button"
                      onclick="setNewSkillEffectType('passive')"
                      class="p-2.5 rounded-xl border text-left text-xs font-bold transition-all ${
                        effType === 'passive'
                          ? 'bg-emerald-500/20 border-emerald-400 text-emerald-200'
                          : 'bg-slate-900 border-slate-800 text-slate-400'
                      }"
                    >
                      <div>⚡ Пасивний ефект</div>
                      <div class="text-[10px] font-normal text-slate-400">Бонус кубиків діє постійно</div>
                    </button>
                    <button
                      type="button"
                      onclick="setNewSkillEffectType('active')"
                      class="p-2.5 rounded-xl border text-left text-xs font-bold transition-all ${
                        effType === 'active'
                          ? 'bg-cyan-500/20 border-cyan-400 text-cyan-200'
                          : 'bg-slate-900 border-slate-800 text-slate-400'
                      }"
                    >
                      <div>🎯 Активний / Умовний</div>
                      <div class="text-[10px] font-normal text-slate-400">Вмикається при виконанні умови</div>
                    </button>
                    <button
                      type="button"
                      onclick="setNewSkillEffectType('none')"
                      class="p-2.5 rounded-xl border text-left text-xs font-bold transition-all ${
                        effType === 'none'
                          ? 'bg-purple-500/20 border-purple-400 text-purple-200'
                          : 'bg-slate-900 border-slate-800 text-slate-400'
                      }"
                    >
                      <div>📘 Без ефектів (РП / Опис)</div>
                      <div class="text-[10px] font-normal text-slate-400">Без числових бонусів до кубів</div>
                    </button>
                  </div>
                </div>

                <div class="grid grid-cols-1 ${effType === 'none' ? 'md:grid-cols-1' : 'md:grid-cols-4'} gap-3">
                  <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Назва навички *</label>
                    <input id="skName" type="text" placeholder="Напр.: Тактичний аналіз" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" required />
                  </div>

                  ${
                    effType !== 'none'
                      ? `
                      <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Характеристика для кидка</label>
                        <select id="skStat" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white">
                          <option value="any">🌟 Будь-яка характеристика</option>
                          ${STATS.map(s => `<option value="${s.id}">${s.icon}${s.name}</option>`).join('')}
                        </select>
                      </div>

                      <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Модифікатор кубиків (🎲)</label>
                        <select id="skDiceMod" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white">
                          <option value="-2">-2 кубики</option>
                          <option value="-1">-1 кубик</option>
                          <option value="0">0 кубиків</option>
                          <option value="1" selected>+1 кубик</option>
                          <option value="2">+2 кубики</option>
                          <option value="3">+3 кубики</option>
                          <option value="4">+4 кубики</option>
                        </select>
                      </div>

                      <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Бонус балів до результату</label>
                        <select id="skFlatBonus" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white">
                          <option value="0" selected>+0 балів</option>
                          <option value="1">+1 бал</option>
                          <option value="2">+2 бали</option>
                          <option value="3">+3 бали</option>
                        </select>
                      </div>
                    `
                      : ''
                  }
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Умова активації (необов'язково)</label>
                    <input id="skCondition" type="text" placeholder="Напр.: Коли персонаж атакує із засідки" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" />
                  </div>
                  <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Опис / ТЗ навички</label>
                    <input id="skDesc" type="text" placeholder="Детальний опис дії навички..." class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" />
                  </div>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-800">
                  <label class="inline-flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                    <input id="skHidden" type="checkbox" class="rounded bg-slate-900 border-slate-700" />
                    <span>🔒 Приховати цю навичку від інших гравців</span>
                  </label>

                  <div class="flex items-center gap-2">
                    <button type="button" onclick="toggleSkillForm()" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">
                      Скасувати
                    </button>
                    <button type="submit" class="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs">
                      ✓ Зберегти Картку Навички
                    </button>
                  </div>
                </div>
              </form>
            `
              : ''
          }

          ${
            skills.length === 0
              ? `<div class="p-6 rounded-xl bg-slate-950 border border-slate-800 text-center text-xs text-slate-400">
                  Лист навичок порожній. Натисніть кнопку <b>«+ Створити нову навичку»</b>, щоб додати першу картку.
                </div>`
              : `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  ${skills.map(sk => {
                    const stObj = STATS.find(s => s.id === sk.statId);
                    const stLabel = sk.effectType === 'none'
                      ? '📘 Описова навичка'
                      : (stObj ? `${stObj.icon} ${stObj.name}` : '🌟 Всі характеристики');
                    const isEffectivelyHidden = char.privacy.hideSkills || sk.hidden;
                    const applied = isSkillApplied(sk);

                    return `
                      <div class="p-4 rounded-xl bg-slate-950 border ${applied ? 'border-cyan-500/50' : 'border-slate-800'} flex flex-col justify-between gap-3">
                        <div class="space-y-2">
                          <div class="flex items-start justify-between gap-2">
                            <div>
                              <div class="flex items-center gap-1.5 flex-wrap">
                                <h3 class="font-extrabold text-sm text-white">${esc(sk.name)}</h3>
                                ${isEffectivelyHidden ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-red-500/20 text-red-300 border border-red-500/30 font-bold">🔒</span>' : ''}
                              </div>
                              <span class="text-[11px] text-slate-400">${stLabel}</span>
                            </div>

                            ${
                              sk.effectType === 'none'
                                ? `<span class="px-2.5 py-1 rounded-lg bg-purple-500/15 border border-purple-500/30 text-purple-300 font-bold text-[11px] whitespace-nowrap">📘 Без ефектів</span>`
                                : `<span class="px-2.5 py-1 rounded-lg bg-cyan-500/15 border border-cyan-500/30 text-cyan-300 font-black text-xs whitespace-nowrap">
                                    ${sk.diceMod >= 0 ? '+' + sk.diceMod : sk.diceMod} 🎲 ${sk.flatBonus > 0 ? `(+${sk.flatBonus})` : ''}
                                  </span>`
                            }
                          </div>

                          ${sk.condition ? `<div class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-[11px] text-amber-300"><b>Умова:</b> ${esc(sk.condition)}</div>` : ''}
                          ${sk.description ? `<p class="text-xs text-slate-300 leading-relaxed">${esc(sk.description)}</p>` : ''}
                        </div>

                        <div class="pt-3 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-2">
                          ${
                            sk.effectType === 'passive'
                              ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-[11px] font-bold">⚡ Пасивна (Постійно)</span>`
                              : sk.effectType === 'none'
                              ? `<span class="px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 text-[11px]">📘 РП / Опис</span>`
                              : `<button
                                  type="button"
                                  onclick="toggleSkillActive('${esc(sk.id)}')"
                                  class="px-2.5 py-1 rounded-lg text-[11px] font-bold border ${
                                    sk.active
                                      ? 'bg-cyan-500 text-slate-950 border-cyan-400'
                                      : 'bg-slate-900 text-slate-400 border-slate-700'
                                  }"
                                >
                                  ${sk.active ? '✓ Умова активна' : '○ Умова вимкнена'}
                                </button>`
                          }

                          <div class="flex items-center gap-1.5">
                            <button
                              type="button"
                              onclick="toggleSkillHidden('${esc(sk.id)}')"
                              class="px-2 py-1 rounded-lg border text-[11px] font-bold ${
                                sk.hidden
                                  ? 'bg-red-500/15 border-red-500/40 text-red-300'
                                  : 'bg-slate-900 border-slate-800 text-slate-300'
                              }"
                            >
                              ${sk.hidden ? '🔒 Схована' : '👁️ Видима'}
                            </button>
                            <button
                              type="button"
                              onclick="deleteSkill('${esc(sk.id)}')"
                              class="px-2 py-1 rounded-lg bg-red-500/15 border border-red-500/30 text-[11px] text-red-300 hover:bg-red-500/30"
                            >
                              🗑️
                            </button>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>`
          }
        </section>
      `;
    }

    /********************************************************************
     * 20. СПОРЯДЖЕННЯ ТА ЖУРНАЛ КИДКІВ (ОСОБИСТИЙ + ЗАГАЛЬНИЙ КАМПАНІЇ)
     ********************************************************************/
    function renderInventoryBox(char) {
      return `
        <section class="w-full grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col">
            <label class="text-xs font-black uppercase tracking-wider text-white mb-2">⭐⭐⭐ Бойове Спорядження та Зброя</label>
            <textarea
              rows="5"
              oninput="updateTextField('equipment', this.value)"
              placeholder="Бронежилет, зброя, набої, спецзасоби..."
              class="w-full flex-1 p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-cyan-400"
            >${esc(char.equipment)}</textarea>
          </div>

          <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col">
            <label class="text-xs font-black uppercase tracking-wider text-white mb-2">🎒 Рюкзак та Особисті Речі</label>
            <textarea
              rows="5"
              oninput="updateTextField('backpack', this.value)"
              placeholder="Аптечка, ліхтар, рація, припаси..."
              class="w-full flex-1 p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-cyan-400"
            >${esc(char.backpack)}</textarea>
          </div>

          <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col">
            <label class="text-xs font-black uppercase tracking-wider text-white mb-2">📄 Досьє, Квести та Нотатки</label>
            <textarea
              rows="5"
              oninput="updateTextField('notes', this.value)"
              placeholder="Історія персонажа, важливі імена, цілі..."
              class="w-full flex-1 p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-cyan-400"
            >${esc(char.notes)}</textarea>
          </div>
        </section>
      `;
    }

    function renderRollLogBox(char) {
      const scope = state.ui.rollLogScope || 'personal';
      const personalLogs = getPersonalRollLogs(char);
      const campaignLogs = state.campaignRollLogs || [];
      const activeLogs = scope === 'personal' ? personalLogs : campaignLogs;

      return `
        <section class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3">
            <div>
              <h2 class="text-sm font-black uppercase tracking-wider text-white">📜 Журнал Кидків Кубиків</h2>
              <p class="text-xs text-slate-400">Усі кидки зберігаються для конкретного персонажа та в загальній хроніці партії</p>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button
                  type="button"
                  onclick="setRollLogScope('personal')"
                  class="px-3 py-1.5 rounded-lg text-xs font-extrabold transition-all ${
                    scope === 'personal' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'
                  }"
                >
                  👤 Особистий: ${esc(char.name)} (${personalLogs.length})
                </button>
                <button
                  type="button"
                  onclick="setRollLogScope('campaign')"
                  class="px-3 py-1.5 rounded-lg text-xs font-extrabold transition-all ${
                    scope === 'campaign' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'
                  }"
                >
                  🌍 Усі кидки кампанії (${campaignLogs.length})
                </button>
              </div>

              ${
                activeLogs.length > 0
                  ? `<button type="button" onclick="clearRollLogs()" class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-400 hover:text-red-400">Очистити</button>`
                  : ''
              }
            </div>
          </div>

          ${
            activeLogs.length === 0
              ? `<div class="p-6 rounded-xl bg-slate-950 border border-slate-800 text-center text-xs text-slate-500 italic">
                  У цьому журналі ще немає записів кидків. Зробіть кидок у Столі Кидків вище!
                </div>`
              : `<div class="space-y-2">
                  ${activeLogs.map(item => `
                    <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 flex flex-wrap items-center justify-between gap-3 text-xs">
                      <div class="space-y-1">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="text-slate-500 font-mono">[${esc(item.time)}]</span>
                          <span class="px-2 py-0.5 rounded bg-slate-900 border border-slate-700 font-bold text-cyan-300">
                            👤 ${esc(item.charName || char.name)}
                          </span>
                          <b class="text-white">${item.statIcon || '🎲'} ${esc(item.statName)}</b>
                          <span class="text-slate-400">(Пул: ${item.diceCount}🎲)</span>
                        </div>
                        ${
                          item.skillNames && item.skillNames.length > 0
                            ? `<div class="text-[11px] text-emerald-400">Навички: ${esc(item.skillNames.join(', '))}</div>`
                            : ''
                        }
                      </div>

                      <div class="flex items-center gap-3">
                        <div class="flex items-center gap-1">
                          ${(item.results || []).map(r => `
                            <span class="inline-flex items-center justify-center w-6 h-6 rounded bg-slate-900 border ${ r.points === 2 ? 'border-cyan-400 text-cyan-300' : r.points === 1 ? 'border-slate-600 text-slate-200' : 'border-slate-800 text-slate-600' } text-[10px] font-black">${r.points}</span>
                          `).join('')}
                        </div>
                        <div class="px-3 py-1 rounded-lg bg-cyan-500/15 border border-cyan-500/30 font-black text-sm text-cyan-300">
                          Сума: ${item.totalScore}
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>`
          }
        </section>
      `;
    }

    /********************************************************************
     * 21. ГОЛОВНА ФУНКЦІЯ РЕНДЕРУ З ПОВНИМ ЗАХИСТОМ
     ********************************************************************/
    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      try {
        if (!state.session.loggedIn) {
          root.innerHTML = renderLoginScreen();
        } else {
          root.innerHTML = renderMainSheet();
        }
      } catch (err) {
        console.error('Помилка рендеру:', err);
        root.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-6 bg-slate-950 text-white">
            <div class="max-w-md w-full bg-slate-900 border border-red-500/40 rounded-2xl p-6 text-center space-y-4">
              <h2 class="text-lg font-black text-red-400">Виявлено конфлікт старого кешу</h2>
              <p class="text-xs text-slate-300">Натисніть кнопку нижче, щоб очистити пошкоджений кеш браузера і запустити чисту систему.</p>
              <button onclick="resetAllLocalData()" class="w-full py-3 rounded-xl bg-cyan-500 text-slate-950 font-black text-sm">
                🔄 Очистити кеш і запустити
              </button>
            </div>
          </div>
        `;
      }
    }

    // Старт системи
    loadDatabase();
    renderApp();
  </script>
</body>
</html>
