<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вітрувій • ЕНТРОПІЯ — Інтерактивна Система</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #070b12;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
    }
    @keyframes diceTumble {
      0%   { transform: translateY(-32px) rotateX(180deg) rotateZ(-30deg) scale(0.65); opacity: 0.25; }
      50%  { transform: translateY(8px) rotateX(-15deg) rotateZ(15deg) scale(1.06); opacity: 1; }
      80%  { transform: translateY(-4px) rotateX(8deg) rotateZ(-4deg) scale(0.98); opacity: 1; }
      100% { transform: translateY(0) rotateX(0deg) rotateZ(0deg) scale(1); opacity: 1; }
    }
    @keyframes diceSpinContinuous {
      0%   { transform: rotate(0deg) scale(0.9); }
      50%  { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(0.9); }
    }
    .dice-land {
      animation: diceTumble 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .dice-rolling-spin {
      animation: diceSpinContinuous 0.36s linear infinite;
    }
    .striped-disabled {
      background: repeating-linear-gradient(
        45deg,
        rgba(30, 41, 59, 0.35),
        rgba(30, 41, 59, 0.35) 5px,
        rgba(15, 23, 42, 0.85) 5px,
        rgba(15, 23, 42, 0.85) 10px
      );
    }
  </style>
</head>
<body class="min-h-screen bg-[#070b12] text-slate-100 selection:bg-cyan-500 selection:text-black">

  <!-- Головний контейнер із вбудованим стартовим екраном (ніколи не буває порожнім) -->
  <div id="app" class="min-h-screen flex flex-col">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center space-y-3">
        <div class="text-4xl">💠</div>
        <h1 class="text-xl font-black uppercase tracking-wider text-white">ВІТРУВІЙ • ЕНТРОПІЯ</h1>
        <p class="text-xs text-slate-400">Завантаження інтерактивної системи...</p>
      </div>
    </div>
  </div>

  <!-- Прихований глобальний аудіо-плеєр для синхронізації треків Майстра -->
  <audio id="globalAudioElement" class="hidden" crossorigin="anonymous"></audio>

  <script>
    /********************************************************************
     * 1. КОНСТАНТИ СИСТЕМИ «ВІТРУВІЙ • ЕНТРОПІЯ»
     ********************************************************************/
    const STORAGE_KEY = 'vitruvium_entropia_v8_final';
    const MAP_BASE_URL = 'https://nazarshulik0-dotcom.github.io/entropia_map/';
    const GM_SECRET_PASSWORD = 'ентропія';

    const STATS = [
      { id: 'health',      name: "Здоров'я",    icon: '❤️' },
      { id: 'attention',   name: 'Уважність',   icon: '👁️' },
      { id: 'combat',      name: 'Битва',       icon: '💪' },
      { id: 'agility',     name: 'Спритність',  icon: '🦶' },
      { id: 'thinking',    name: 'Мислення',    icon: '🧠' },
      { id: 'social',      name: 'Спілкування', icon: '🎭' }
    ];

    const HP_ROWS = [
      'Здоровий',
      'Травмований',
      'Поранений',
      'Скалічений',
      'При смерті'
    ];

    // Вбудовані атмосферні звукові генератори секторів Ентропії (працюють без зовнішніх файлів)
    const BUILTIN_AMBIENTS = [
      { id: 'synth_sector0', title: 'Сектор 0: Комплекс «СІЕЛЬ» (Кібер-дрон)', freq1: 110, freq2: 165, lfo: 0.18, type: 'sine' },
      { id: 'synth_sector1', title: 'Сектор 1: Карантинні Сади (Біолюмінесценція)', freq1: 146.8, freq2: 220, lfo: 0.25, type: 'triangle' },
      { id: 'synth_sector2', title: 'Сектор 2: Іржаві Пустки (Індустріальний гул)', freq1: 73.4, freq2: 110, lfo: 0.12, type: 'sawtooth' },
      { id: 'synth_sector5', title: 'Сектор 5: Примарний Мегаполіс (Ехо мережі)', freq1: 130.8, freq2: 196, lfo: 0.32, type: 'sine' },
      { id: 'synth_sector8', title: 'Сектор 8: Токсичні Джунглі (Пульс Скверни)', freq1: 65.4, freq2: 92.5, lfo: 0.45, type: 'triangle' }
    ];

    // Безпечне екранування рядків для HTML-атрибутів та тексту
    function esc(val) {
      if (val === null || val === undefined) return '';
      return String(val)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /********************************************************************
     * 2. ГРАФІКА КУБИКІВ «ЕНТРОПІЇ» (💠)
     ********************************************************************/
    function getEntropiaSymbolHTML(mode = 'full', sizeClass = 'w-10 h-10') {
      if (mode === 'empty') {
        return `<div class="${sizeClass} rounded-lg border border-dashed border-slate-700 flex items-center justify-center text-slate-600 text-xs font-bold select-none">0</div>`;
      }
      if (mode === 'half') {
        return `
          <div class="${sizeClass} relative flex items-center justify-center select-none" title="Половинка символу (1 бал)">
            <span class="text-2xl opacity-20">💠</span>
            <span class="text-2xl absolute inset-0 flex items-center justify-center drop-shadow-[0_0_8px_rgba(34,211,238,0.85)]" style="clip-path: inset(0 50% 0 0);">💠</span>
          </div>
        `;
      }
      return `<div class="${sizeClass} flex items-center justify-center text-2xl select-none drop-shadow-[0_0_12px_rgba(34,211,238,0.95)]" title="Повний символ (2 бали)">💠</div>`;
    }

    /********************************************************************
     * 3. СТВОРЕННЯ ТА НОРМАЛІЗАЦІЯ ПЕРСОНАЖА
     ********************************************************************/
    function createBlankCharacter(id, ownerLogin, name, isNpc = false) {
      const stats = {};
      const wounds = {};
      STATS.forEach(s => {
        stats[s.id] = 1;
        wounds[s.id] = [false, false, false, false, false, false];
      });

      const hpGrid = HP_ROWS.map(() => [false, false, false, false, false, false]);

      return {
        id: String(id),
        owner: String(ownerLogin || 'гравець'),
        name: String(name || ownerLogin || 'Персонаж'),
        isNpc: !!isNpc,
        archetype: '',
        stats: stats,
        wounds: wounds,
        hpGrid: hpGrid,
        skills: [],
        equipment: '',
        backpack: '',
        notes: '',
        inspiration: {
          count: 0,
          pendingRequest: false,
          lastStatus: ''
        },
        privacy: {
          hideStats: false,
          hideHealth: false,
          hideSkills: false
        },
        rollLog: []
      };
    }

    function normalizeCharacter(raw) {
      const fallbackId = raw?.id || ('char_' + Date.now());
      const base = createBlankCharacter(
        fallbackId,
        raw?.owner || 'гравець',
        raw?.name || 'Безіменний',
        !!raw?.isNpc
      );

      if (!raw || typeof raw !== 'object') return base;

      base.name = String(raw.name || base.name);
      base.owner = String(raw.owner || base.owner);
      base.isNpc = !!raw.isNpc;
      base.archetype = String(raw.archetype || '');
      base.equipment = String(raw.equipment || '');
      base.backpack = String(raw.backpack || '');
      base.notes = String(raw.notes || '');

      STATS.forEach(s => {
        const val = Number(raw.stats?.[s.id]);
        base.stats[s.id] = Number.isFinite(val) ? Math.min(6, Math.max(1, Math.round(val))) : 1;

        const wArr = raw.wounds?.[s.id];
        if (Array.isArray(wArr)) {
          base.wounds[s.id] = [0, 1, 2, 3, 4, 5].map(i => !!wArr[i]);
        }
      });

      if (Array.isArray(raw.hpGrid)) {
        base.hpGrid = HP_ROWS.map((_, rIdx) => {
          const row = raw.hpGrid[rIdx];
          return [0, 1, 2, 3, 4, 5].map(cIdx => Array.isArray(row) ? !!row[cIdx] : false);
        });
      }

      if (Array.isArray(raw.skills)) {
        base.skills = raw.skills.map((sk, idx) => {
          const effectType = ['passive', 'active', 'none'].includes(sk?.effectType)
            ? sk.effectType
            : 'active';
          return {
            id: String(sk?.id || ('sk_' + idx + '_' + Date.now())),
            name: String(sk?.name || 'Навичка'),
            effectType: effectType,
            statId: String(sk?.statId || 'any'),
            diceMod: effectType === 'none' ? 0 : (Number.isFinite(Number(sk?.diceMod)) ? Number(sk.diceMod) : 0),
            flatBonus: effectType === 'none' ? 0 : (Number.isFinite(Number(sk?.flatBonus)) ? Number(sk.flatBonus) : 0),
            condition: String(sk?.condition || ''),
            description: String(sk?.description || ''),
            active: effectType === 'passive' ? true : (effectType === 'none' ? false : !!sk?.active),
            hidden: !!sk?.hidden
          };
        });
      }

      if (raw.inspiration && typeof raw.inspiration === 'object') {
        base.inspiration = {
          count: Math.max(0, Number(raw.inspiration.count) || 0),
          pendingRequest: !!raw.inspiration.pendingRequest,
          lastStatus: String(raw.inspiration.lastStatus || '')
        };
      }

      if (raw.privacy && typeof raw.privacy === 'object') {
        base.privacy = {
          hideStats: !!raw.privacy.hideStats,
          hideHealth: !!raw.privacy.hideHealth,
          hideSkills: !!raw.privacy.hideSkills
        };
      }

      if (Array.isArray(raw.rollLog)) {
        base.rollLog = raw.rollLog.filter(Boolean).slice(0, 40);
      }

      return base;
    }

    /********************************************************************
     * 4. ГЛОБАЛЬНИЙ СТАН ДОДАТКА ТА БАЗА ДАНИХ
     ********************************************************************/
    window.state = {
      characters: {},
      campaignRollLogs: [],
      audioTracks: [],
      audioState: {
        activeTrackId: null,
        activeTitle: '',
        activeUrl: '',
        mode: 'none', // 'none' | 'file' | 'url' | 'synth'
        isPlaying: false,
        volume: 0.6
      },
      session: {
        loggedIn: false,
        role: 'player',         // 'player' | 'gm'
        loginName: '',
        activeCharId: null,
        gmCategory: 'players',  // 'players' | 'npcs'
        activeTab: 'all'        // 'all' | 'skills' | 'inventory' | 'others' | 'log' | 'map' | 'audio'
      },
      loginForm: {
        role: 'player',
        loginInput: '',
        charNameInput: '',
        gmPasswordInput: '',
        errorMsg: ''
      },
      diceRoller: {
        selectedStat: 'health',
        extraDiceMod: 0,
        isRolling: false,
        rollingCount: 0,
        lastRoll: null
      },
      ui: {
        skillFormOpen: false,
        newSkillEffectType: 'active', // 'passive' | 'active' | 'none'
        privacyPreviewOpen: false,
        simulateOtherView: true,
        rollLogScope: 'personal',     // 'personal' | 'campaign'
        mapForceRole: null,           // null (auto) | 'gm' | 'player'
        mapCacheBust: Date.now(),
        mapTall: false
      }
    };

    // Локальні сесійні файли аудіо (Blob URLs)
    const localAudioBlobs = {};
    let webAudioCtx = null;
    let webAudioNodes = [];

    function loadDatabase() {
      try {
        // Міграція зі старих ключів + читання поточного
        const keysToTry = [STORAGE_KEY, 'vitruvium_app_v6_stable', 'vitruvium_entropia_v7'];
        let parsed = null;

        for (const k of keysToTry) {
          const raw = localStorage.getItem(k);
          if (raw) {
            try {
              const candidate = JSON.parse(raw);
              if (candidate && typeof candidate === 'object') {
                parsed = candidate;
                break;
              }
            } catch (_) {}
          }
        }

        if (!parsed) return;

        if (parsed.characters && typeof parsed.characters === 'object') {
          const cleanChars = {};
          Object.keys(parsed.characters).forEach(id => {
            const c = parsed.characters[id];
            if (c) cleanChars[id] = normalizeCharacter(c);
          });
          state.characters = cleanChars;
        }

        if (Array.isArray(parsed.campaignRollLogs)) {
          state.campaignRollLogs = parsed.campaignRollLogs.filter(Boolean).slice(0, 80);
        }

        if (Array.isArray(parsed.audioTracks)) {
          state.audioTracks = parsed.audioTracks.filter(Boolean);
        }

        if (parsed.audioState && typeof parsed.audioState === 'object') {
          state.audioState.activeTrackId = parsed.audioState.activeTrackId || null;
          state.audioState.activeTitle = parsed.audioState.activeTitle || '';
          state.audioState.activeUrl = parsed.audioState.activeUrl || '';
          state.audioState.mode = parsed.audioState.mode || 'none';
          state.audioState.isPlaying = !!parsed.audioState.isPlaying;
        }
      } catch (err) {
        console.warn('Помилка читання localStorage:', err);
      }
    }

    function saveDatabase() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          characters: state.characters,
          campaignRollLogs: state.campaignRollLogs,
          audioTracks: state.audioTracks.filter(t => !t.isLocalBlob),
          audioState: {
            activeTrackId: state.audioState.activeTrackId,
            activeTitle: state.audioState.activeTitle,
            activeUrl: state.audioState.activeUrl,
            mode: state.audioState.mode,
            isPlaying: state.audioState.isPlaying
          }
        }));
      } catch (err) {
        console.error('Помилка збереження:', err);
      }
    }

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) {
        loadDatabase();
        syncAudioFromState();
        renderApp();
      }
    });

    function getActiveCharacter() {
      const id = state.session.activeCharId;
      if (!id || !state.characters[id]) return null;
      state.characters[id] = normalizeCharacter(state.characters[id]);
      return state.characters[id];
    }

    /********************************************************************
     * 5. ОБЧИСЛЕННЯ СТАТІВ, ШТРАФІВ ТРАВМ, ХП ТА ОСОБИСТОГО ЖУРНАЛУ
     ********************************************************************/
    function getWoundCount(char, statId) {
      const arr = char?.wounds?.[statId] || [];
      return arr.filter(Boolean).length;
    }

    function getWoundPenalty(char, statId) {
      return Math.floor(getWoundCount(char, statId) / 2);
    }

    function isSkillApplied(sk) {
      if (!sk || sk.effectType === 'none') return false;
      if (sk.effectType === 'passive') return true;
      return !!sk.active;
    }

    function getActiveSkillModifiers(char, statId) {
      const list = (char?.skills || []).filter(sk =>
        isSkillApplied(sk) && (sk.statId === statId || sk.statId === 'any')
      );
      const diceMod = list.reduce((sum, sk) => sum + (Number(sk.diceMod) || 0), 0);
      const flatBonus = list.reduce((sum, sk) => sum + (Number(sk.flatBonus) || 0), 0);
      return { diceMod, flatBonus, activeSkills: list };
    }

    function getDicePoolForStat(char, statId, includeExtra = false) {
      if (!char) return 0;
      const base = Number(char.stats?.[statId] || 1);
      const penalty = getWoundPenalty(char, statId);
      const { diceMod } = getActiveSkillModifiers(char, statId);
      const extra = includeExtra ? (Number(state.diceRoller.extraDiceMod) || 0) : 0;
      return Math.max(0, base - penalty + diceMod + extra);
    }

    function getCurrentHealthStageName(char) {
      let stage = 'Здоровий';
      const maxCols = Number(char?.stats?.health || 1);
      HP_ROWS.forEach((rowName, rIdx) => {
        const anyChecked = (char?.hpGrid?.[rIdx] || []).slice(0, maxCols).some(Boolean);
        if (anyChecked) stage = rowName;
      });
      return stage;
    }

    // ГАРАНТОВАНИЙ ОСОБИСТИЙ ЖУРНАЛ ПЕРСОНАЖА (об'єднує особистий масив + загальний лог кампанії)
    function getPersonalRollLogs(char) {
      if (!char) return [];
      const directLogs = Array.isArray(char.rollLog) ? char.rollLog : [];
      const fromCampaign = (state.campaignRollLogs || []).filter(item =>
        item && (
          item.charId === char.id ||
          (item.charOwner && item.charOwner === char.owner) ||
          (item.charName && item.charName === char.name)
        )
      );

      const seenIds = new Set();
      const merged = [];

      [...directLogs, ...fromCampaign].forEach(item => {
        if (!item) return;
        const key = item.id || `${item.time}_${item.statName}_${item.totalScore}`;
        if (!seenIds.has(key)) {
          seenIds.add(key);
          merged.push(item);
        }
      });

      return merged.slice(0, 40);
    }

    /********************************************************************
     * 6. ОБРОБНИКИ ВХОДУ ТА НАВІГАЦІЇ
     ********************************************************************/
    window.selectLoginRole = function(role) {
      state.loginForm.role = role;
      state.loginForm.errorMsg = '';
      renderApp();
    };

    window.handleLoginSubmit = function(event) {
      if (event) event.preventDefault();
      const { role } = state.loginForm;

      if (role === 'gm') {
        const passEl = document.getElementById('gmPasswordInput');
        const pass = (passEl ? passEl.value : state.loginForm.gmPasswordInput).trim().toLowerCase();

        if (pass !== GM_SECRET_PASSWORD) {
          state.loginForm.errorMsg = 'Невірний пароль Майстра!';
          renderApp();
          return;
        }

        state.session.loggedIn = true;
        state.session.role = 'gm';
        state.session.loginName = 'Майстер (ЕНТРОПІЯ)';
        state.session.gmCategory = 'players';
        state.session.activeTab = 'all';

        const playerChars = Object.values(state.characters).filter(c => !c.isNpc);
        state.session.activeCharId = playerChars.length > 0 ? playerChars[0].id : null;
        state.loginForm.errorMsg = '';
        renderApp();
        return;
      }

      // Вхід Гравця
      const loginEl = document.getElementById('playerLoginInput');
      const charNameEl = document.getElementById('playerCharNameInput');
      const rawLogin = (loginEl ? loginEl.value : state.loginForm.loginInput).trim();
      const rawCharName = (charNameEl ? charNameEl.value : state.loginForm.charNameInput).trim();

      if (!rawLogin) {
        state.loginForm.errorMsg = 'Введіть ваш логін або позивний!';
        renderApp();
        return;
      }

      const cleanKey = rawLogin.toLowerCase().replace(/\s+/g, '_');
      const charId = `entropia_player_${cleanKey}`;

      // Перевіряємо чи вже існує персонаж із цим логіном
      let existingId = state.characters[charId] ? charId : null;
      if (!existingId) {
        const found = Object.values(state.characters).find(
          c => !c.isNpc && String(c.owner).toLowerCase() === rawLogin.toLowerCase()
        );
        if (found) existingId = found.id;
      }

      const finalCharId = existingId || charId;

      if (!state.characters[finalCharId]) {
        const displayCharName = rawCharName || rawLogin;
        state.characters[finalCharId] = createBlankCharacter(finalCharId, rawLogin, displayCharName, false);
        saveDatabase();
      } else if (rawCharName) {
        state.characters[finalCharId].name = rawCharName;
        saveDatabase();
      }

      state.session.loggedIn = true;
      state.session.role = 'player';
      state.session.loginName = rawLogin;
      state.session.activeCharId = finalCharId;
      state.session.activeTab = 'all';
      state.loginForm.errorMsg = '';
      renderApp();
    };

    window.handleLogout = function() {
      state.session.loggedIn = false;
      state.session.activeCharId = null;
      state.loginForm.gmPasswordInput = '';
      state.loginForm.errorMsg = '';
      state.ui.skillFormOpen = false;
      state.ui.privacyPreviewOpen = false;
      renderApp();
    };

    window.switchMainTab = function(tabId) {
      state.session.activeTab = tabId;
      renderApp();
    };

    window.switchGmCategory = function(cat) {
      state.session.gmCategory = cat;
      const list = Object.values(state.characters).filter(c => cat === 'npcs' ? c.isNpc : !c.isNpc);
      if (list.length > 0) {
        state.session.activeCharId = list[0].id;
      } else {
        state.session.activeCharId = null;
      }
      renderApp();
    };

    window.selectCharacterById = function(charId) {
      if (!state.characters[charId]) return;
      state.session.activeCharId = charId;
      renderApp();
    };

    window.resetAllLocalData = function() {
      if (confirm('Очистити локальний кеш браузера? Усі збереження в цьому браузері будуть скинуті.')) {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem('vitruvium_app_v6_stable');
        state.characters = {};
        state.campaignRollLogs = [];
        state.session.loggedIn = false;
        state.session.activeCharId = null;
        renderApp();
      }
    };

    /********************************************************************
     * 7. ОПЕРАЦІЇ З ЛИСТОМ ПЕРСОНАЖА, ХП, ТРАВМАМИ, НАВИЧКАМИ ТА ГМ-ДІЯМИ
     ********************************************************************/
    window.changeStat = function(statId, delta) {
      const char = getActiveCharacter();
      if (!char) return;
      const current = Number(char.stats[statId] || 1);
      const next = Math.min(6, Math.max(1, current + delta));
      char.stats[statId] = next;

      if (statId === 'health') {
        char.hpGrid = char.hpGrid.map(row =>
          row.map((val, cIdx) => (cIdx < next ? val : false))
        );
      }
      saveDatabase();
      renderApp();
    };

    window.toggleWoundCell = function(statId, cellIndex) {
      const char = getActiveCharacter();
      if (!char) return;
      char.wounds[statId][cellIndex] = !char.wounds[statId][cellIndex];
      saveDatabase();
      renderApp();
    };

    window.toggleHpCircle = function(rowIndex, colIndex) {
      const char = getActiveCharacter();
      if (!char) return;
      const maxCols = Number(char.stats.health || 1);
      if (colIndex >= maxCols) return;
      char.hpGrid[rowIndex][colIndex] = !char.hpGrid[rowIndex][colIndex];
      saveDatabase();
      renderApp();
    };

    window.stepHpDamage = function(addDamage = true) {
      const char = getActiveCharacter();
      if (!char) return;
      const maxCols = Number(char.stats.health || 1);

      if (addDamage) {
        for (let r = 0; r < HP_ROWS.length; r++) {
          for (let c = 0; c < maxCols; c++) {
            if (!char.hpGrid[r][c]) {
              char.hpGrid[r][c] = true;
              saveDatabase();
              renderApp();
              return;
            }
          }
        }
      } else {
        for (let r = HP_ROWS.length - 1; r >= 0; r--) {
          for (let c = maxCols - 1; c >= 0; c--) {
            if (char.hpGrid[r][c]) {
              char.hpGrid[r][c] = false;
              saveDatabase();
              renderApp();
              return;
            }
          }
        }
      }
    };

    window.changeExtraDiceMod = function(delta) {

      renderApp();

    window.rollVitruviumDice = function(statIdOverride) {
      const char = getActiveCharacter();
      if (!char || state.diceRoller.isRolling) return;

      const statId = statIdOverride || state.diceRoller.selectedStat || 'health';
      state.diceRoller.selectedStat = statId;

      const statObj = STATS.find(s => s.id === statId) || STATS[0];
      const diceCount = getDicePoolForStat(char, statId, true);
      const { diceMod, flatBonus, activeSkills } = getActiveSkillModifiers(char, statId);
      const extraMod = Number(state.diceRoller.extraDiceMod || 0);
      const penalty = getWoundPenalty(char, statId);

      state.diceRoller.isRolling = true;
      state.diceRoller.rollingCount = diceCount;
      renderApp();

      setTimeout(() => {
        const faces = [
          { points: 2, mode: 'full' },
          { points: 1, mode: 'half' },
          { points: 1, mode: 'half' },
          { points: 0, mode: 'empty' },
          { points: 0, mode: 'empty' },
          { points: 0, mode: 'empty' }
        ];

        const results = [];
        let diceSum = 0;
        let countTwo = 0;
        let countOne = 0;
        let countZero = 0;

        for (let i = 0; i < diceCount; i++) {
          const pick = faces[Math.floor(Math.random() * faces.length)];
          results.push(pick);
          diceSum += pick.points;
          if (pick.points === 2) countTwo++;
          else if (pick.points === 1) countOne++;
          else countZero++;
        }

        const totalScore = diceSum + flatBonus;
        const rollRecord = {
          id: 'roll_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          charId: char.id,
          charName: char.name,
          charOwner: char.owner,
          time: new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          statName: statObj.name,
          statIcon: statObj.icon,
          baseStat: char.stats[statId],
          penalty,
          diceMod,
          extraMod,
          flatBonus,
          diceCount,
          results,
          diceSum,
          countTwo,
          countOne,
          countZero,
          totalScore,
          skillNames: activeSkills.map(s => s.name)
        };

        state.diceRoller.isRolling = false;
        state.diceRoller.lastRoll = rollRecord;

        // Зберігаємо і в особистий журнал персонажа, і в глобальний журнал кампанії
        if (!Array.isArray(char.rollLog)) char.rollLog = [];
        char.rollLog = [rollRecord, ...char.rollLog].slice(0, 40);
        state.campaignRollLogs = [rollRecord, ...(state.campaignRollLogs || [])].slice(0, 80);

        saveDatabase();
        renderApp();
      }, 400);
    };

    function stopWebAudioAmbient() {
      webAudioNodes.forEach(n => {
        try { n.stop && n.stop(); } catch (_) {}
        try { n.disconnect && n.disconnect(); } catch (_) {}
      });
      webAudioNodes = [];
    }

    function startWebAudioAmbient(preset) {
      stopWebAudioAmbient();
      const audioEl = document.getElementById('globalAudioElement');
      if (audioEl) audioEl.pause();

      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!webAudioCtx) webAudioCtx = new AudioContextClass();
        if (webAudioCtx.state === 'suspended') webAudioCtx.resume();

        const masterGain = webAudioCtx.createGain();
        masterGain.gain.value = Math.max(0.05, Number(state.audioState.volume || 0.6) * 0.25);
        masterGain.connect(webAudioCtx.destination);

        const osc1 = webAudioCtx.createOscillator();
        const osc2 = webAudioCtx.createOscillator();
        const lfo = webAudioCtx.createOscillator();
        const lfoGain = webAudioCtx.createGain();
        const filter = webAudioCtx.createBiquadFilter();

        osc1.type = preset.type || 'sine';
        osc2.type = 'sine';
        osc1.frequency.value = preset.freq1;
        osc2.frequency.value = preset.freq2;

        filter.type = 'lowpass';
        filter.frequency.value = 420;

        lfo.frequency.value = preset.lfo || 0.2;
        lfoGain.gain.value = 180;

        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(masterGain);

        osc1.start();
        osc2.start();
        lfo.start();

        webAudioNodes = [osc1, osc2, lfo, lfoGain, filter, masterGain];
      } catch (e) {
        console.warn('Web Audio API помилка:', e);
      }
    }

    window.playBuiltinAmbient = function(presetId) {
      const preset = BUILTIN_AMBIENTS.find(p => p.id === presetId);
      if (!preset) return;

      state.audioState.activeTrackId = preset.id;
      state.audioState.activeTitle = preset.title;
      state.audioState.activeUrl = '';
      state.audioState.mode = 'synth';
      state.audioState.isPlaying = true;

      startWebAudioAmbient(preset);

    };

    window.handleLocalAudioUpload = function(event) {
      const files = event.target?.files;
      if (!files || files.length === 0) return;

      Array.from(files).forEach(file => {
        const id = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        const blobUrl = URL.createObjectURL(file);
        localAudioBlobs[id] = blobUrl;
        state.audioTracks.unshift({
          id,
          title: file.name.replace(/\.[^/.]+$/, ''),
          url: blobUrl,
          isLocalBlob: true
        });
      });

      saveDatabase();
      renderApp();
    };

    window.addUrlAudioTrack = function(event) {
      if (event) event.preventDefault();
      const title = document.getElementById('audioTitleInput')?.value?.trim();
      const url = document.getElementById('audioUrlInput')?.value?.trim();
      if (!title || !url) {
        alert('Введіть назву треку та пряме посилання на аудіофайл!');
        return;
      }
      state.audioTracks.unshift({
        id: 'track_' + Date.now(),
        title,
        url,
        isLocalBlob: false
      });
      saveDatabase();
      renderApp();
    };

    window.playUploadedTrack = function(trackId) {
      const tr = state.audioTracks.find(t => t.id === trackId);
      if (!tr) return;

      stopWebAudioAmbient();
      const audioEl = document.getElementById('globalAudioElement');
      const playUrl = localAudioBlobs[tr.id] || tr.url;

      state.audioState.activeTrackId = tr.id;
      state.audioState.activeTitle = tr.title;
      state.audioState.activeUrl = tr.isLocalBlob ? '' : tr.url;
      state.audioState.mode = tr.isLocalBlob ? 'file' : 'url';
      state.audioState.isPlaying = true;

      if (audioEl && playUrl) {
        audioEl.src = playUrl;
        audioEl.loop = true;
        audioEl.volume = Number(state.audioState.volume || 0.6);
        audioEl.play().catch(() => {});
      }

      saveDatabase();
      renderApp();
    };

    window.stopAllAudio = function() {
      stopWebAudioAmbient();
      const audioEl = document.getElementById('globalAudioElement');
      if (audioEl) audioEl.pause();
      state.audioState.isPlaying = false;
      saveDatabase();
      renderApp();
    };

    window.changeAudioVolume = function(val) {
      const v = Math.min(1, Math.max(0, Number(val)));
      state.audioState.volume = v;
      const audioEl = document.getElementById('globalAudioElement');
      if (audioEl) audioEl.volume = v;
      if (state.audioState.isPlaying && state.audioState.mode === 'synth') {
        const preset = BUILTIN_AMBIENTS.find(p => p.id === state.audioState.activeTrackId);
        if (preset) startWebAudioAmbient(preset);
      }
    };

    window.deleteAudioTrack = function(trackId) {
      state.audioTracks = state.audioTracks.filter(t => t.id !== trackId);
      if (state.audioState.activeTrackId === trackId) {
        window.stopAllAudio();
      }
      saveDatabase();
      renderApp();
    };

    function syncAudioFromState() {
      if (!state.audioState.isPlaying) {
        stopWebAudioAmbient();
        const audioEl = document.getElementById('globalAudioElement');
        if (audioEl) audioEl.pause();
        return;
      }
      if (state.audioState.mode === 'synth') {
        const preset = BUILTIN_AMBIENTS.find(p => p.id === state.audioState.activeTrackId);
        if (preset) startWebAudioAmbient(preset);
      } else if (state.audioState.mode === 'url' && state.audioState.activeUrl) {
        const audioEl = document.getElementById('globalAudioElement');
        if (audioEl && audioEl.src !== state.audioState.activeUrl) {
          audioEl.src = state.audioState.activeUrl;
          audioEl.loop = true;
          audioEl.volume = Number(state.audioState.volume || 0.6);
          audioEl.play().catch(() => {});
        }
      }
    }

    function renderPublicPlayerCard(p, forceSimulateOtherView = false) {
      const isGM = state.session.role === 'gm';
      const isSelf = p.id === state.session.activeCharId;

      const bypassPrivacy = (isGM || (isSelf && !state.ui.simulateOtherView)) && !forceSimulateOtherView;
      const canSeeStats = bypassPrivacy || !p.privacy.hideStats;
      const canSeeHealth = bypassPrivacy || !p.privacy.hideHealth;
      const canSeeSkills = bypassPrivacy || !p.privacy.hideSkills;

      const currentHealthStage = getCurrentHealthStageName(p);
      const visibleSkills = (p.skills || []).filter(sk => bypassPrivacy || !sk.hidden);
      const hiddenSkillsCount = (p.skills || []).length - visibleSkills.length;

      return `

                <span class="max-w-[160px] truncate text-[11px] font-bold ${state.audioState.isPlaying ? 'text-cyan-300' : 'text-slate-500'}">
                  ${state.audioState.isPlaying ? esc(state.audioState.activeTitle || 'Ефір активний') : 'Аудіо вимкнено'}
                </span>
                <input
                  type="range"
                  min="0"
                  max="1"
                  step="0.05"
                  value="${state.audioState.volume}"
                  oninput="changeAudioVolume(this.value)"

                  title="Гучність"
                />
              </div>

              <button
                type="button"
                onclick="handleLogout()"
                class="px-3.5 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-bold text-slate-200 transition-colors"
              >
                🚪 Вийти
              </button>
            </div>
          </div>

          <!-- ПАНЕЛЬ МАЙСТРА (ПЕРЕМИКАННЯ ТА ВИДАЛЕННЯ ПЕРСОНАЖІВ) -->
          ${
            isGM
              ? `
              <div class="bg-slate-900/95 border-t border-slate-800 px-4 py-2.5">
                <div class="max-w-7xl mx-auto space-y-2">
                  ${
                    pendingInspirationChars.length > 0
                      ? `<div class="space-y-1.5">
                          ${pendingInspirationChars.map(pc => `
                            <div class="flex flex-wrap items-center justify-between gap-2 p-2.5 rounded-xl bg-indigo-500/20 border border-indigo-400/50 text-xs">
                              <div class="font-bold text-indigo-200">
                                🌀 Гравець «${esc(pc.name)}» просить використати Натхнення! (Залишок: ${pc.inspiration.count} 🌀)
                              </div>
                              <div class="flex items-center gap-2">
                                <button onclick="gmResolveInspiration('${esc(pc.id)}', true)" class="px-3 py-1 rounded-lg bg-emerald-500 text-slate-950 font-extrabold">✅ Прийняти (-1 🌀)</button>
                                <button onclick="gmResolveInspiration('${esc(pc.id)}', false)" class="px-3 py-1 rounded-lg bg-red-500/30 border border-red-400 text-red-200 font-bold">❌ Відхилити</button>
                              </div>
                            </div>

                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                      <button
                        type="button"
                        onclick="switchGmCategory('players')"
                        class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                          state.session.gmCategory === 'players'
                            ? 'bg-amber-500 text-slate-950'
                            : 'bg-slate-950 text-slate-400 border border-slate-800'
                        }"
                      >
                        👥 Персонажі Гравців (${gmPlayersList.length})
                      </button>
                      <button
                        type="button"
                        onclick="switchGmCategory('npcs')"
                        class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                          state.session.gmCategory === 'npcs'
                            ? 'bg-purple-500 text-white'
                            : 'bg-slate-950 text-slate-400 border border-slate-800'
                        }"
                      >
                        🎭 Приватні НПС Майстра (${gmNpcsList.length})
                      </button>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                      <button
                        type="button"
                        onclick="gmCreateCharacter(false)"
                        class="px-3 py-1.5 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-bold hover:bg-emerald-500/30"
                      >
                        + Додати Гравця
                      </button>
                      <button
                        type="button"
                        onclick="gmCreateCharacter(true)"
                        class="px-3 py-1.5 rounded-lg bg-purple-500/20 border border-purple-500/40 text-purple-300 text-xs font-bold hover:bg-purple-500/30"
                      >
                        + Додати Приватного НПС
                      </button>
                      ${
                        char
                          ? `<button
                              type="button"
                              onclick="gmDeleteCharacter('${esc(char.id)}')"
                              class="px-3 py-1.5 rounded-lg bg-red-500/20 border border-red-500/40 text-red-300 text-xs font-bold hover:bg-red-500/30"
                            >
                              🗑️ Видалити «${esc(char.name)}»
                            </button>`
                          : ''
                      }
                    </div>
                  </div>

                  <!-- Список кнопок персонажів -->
                  <div class="flex items-center gap-2 overflow-x-auto pb-1">
                    ${
                      (state.session.gmCategory === 'players' ? gmPlayersList : gmNpcsList).map(item => `
                        <div class="inline-flex items-center rounded-xl border ${
                          state.session.activeCharId === item.id
                            ? 'bg-white text-slate-950 border-white shadow'
                            : 'bg-slate-950 text-slate-300 border-slate-800'
                        }">
                          <button
                            type="button"
                            onclick="selectCharacterById('${esc(item.id)}')"
                            class="px-3 py-1.5 text-xs font-bold whitespace-nowrap flex items-center gap-1.5"
                          >
                            <span>${item.isNpc ? '🎭' : '👤'} ${esc(item.name)}</span>
                            ${item.inspiration?.pendingRequest ? '<span class="px-1.5 py-0.5 rounded bg-indigo-500 text-white text-[10px] animate-pulse">🌀!</span>' : ''}

                          <button
                            type="button"
                            onclick="gmDeleteCharacter('${esc(item.id)}')"
                            class="pr-2.5 pl-1 py-1.5 text-xs opacity-60 hover:opacity-100 hover:text-red-500 font-black"

                          >✕</button>
