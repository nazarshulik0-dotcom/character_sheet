<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ЕНТРОПІЯ — Ігровий стіл Етер (v8.5 CORE FINAL + RAPHAEL WASM)</title>

  <!-- 1. MQTT транспорт -->
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <!-- 2. Міст синхронізації з Листом Персонажа -->
  <script src="entropia_bridge.js" onerror="console.info('[Aether] Працює автономний міст.')"></script>

  <!-- 3. Ядро Етеру (Золота База v8.5) -->
  <script src="aether_audio.js?v=8.5"></script>
  <script src="aether_video.js?v=8.5"></script>
  <script src="aether_rtc.js?v=8.5"></script>

  <!-- 4. Слоти автоматичного підключення оптимізаторів Етеру та модуля скінів -->
  <script src="aether_audio_optimizer.js?v=1.0" onerror="console.info('[Aether] Слот aether_audio_optimizer.js готовий до підключення.')"></script>
  <script src="aether_video_optimizer.js?v=1.0" onerror="console.info('[Aether] Слот aether_video_optimizer.js готовий до підключення.')"></script>
  <script src="aether_network_optimizer.js?v=1.0" onerror="console.info('[Aether] Слот aether_network_optimizer.js готовий до підключення.')"></script>
  <script src="aether_skins.js?v=1.0" onerror="console.info('[Aether] Слот візуальних текстур aether_skins.js готовий до підключення.')"></script>

  <style>
    :root {
      --bg-room: #090b0c;
      --bg-panel: rgba(22, 25, 29, 0.92);
      --bg-panel-inner: rgba(13, 15, 18, 0.88);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(52, 211, 153, 0.45);
      --border-cyan: rgba(34, 211, 238, 0.35);
      --text-main: #eceff4;
      --text-muted: #8b929e;
      --accent-green: #10b981;
      --neon-vine: #34d399;
      --neon-cyan: #22d3ee;
      --badge-green-bg: rgba(16, 185, 129, 0.18);
      --badge-green-text: #6ee7b7;
      --cta-cream: #efe6d5;
      --cta-cream-hover: #ffffff;
      --cta-text: #141619;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Georgia', 'Times New Roman', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    /* Кастомні темні скроллбари замість білих стандартних рамкових повзунків */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(9, 11, 12, 0.7);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(52, 211, 153, 0.35);
      border-radius: 4px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(52, 211, 153, 0.65);
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-room);
      background-image:
        radial-gradient(ellipse at 50% 48%, rgba(16, 62, 45, 0.32) 0%, rgba(9, 11, 12, 0.98) 72%);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    body.eco-mode .neon-vines-svg,
    body.eco-mode .bg-ambient-vines {
      animation: none !important;
      filter: none !important;
    }

    /* ==================== ВЕРХНЯ ПАНЕЛЬ ==================== */
    .top-bar {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(11, 13, 15, 0.95);
      z-index: 40;
      flex-shrink: 0;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.4px;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
    }

    .sync-dot.online {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .small-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .small-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-hover);
    }

    .small-btn.active {
      background: var(--badge-green-bg);
      border-color: rgba(16, 185, 129, 0.55);
      color: var(--badge-green-text);
    }

    .small-btn.gm-mode {
      background: rgba(34, 211, 238, 0.16);
      border-color: rgba(34, 211, 238, 0.6);
      color: #67e8f9;
    }

    .small-btn.raphael-toggle.active {
      background: rgba(34, 211, 238, 0.18);
      border-color: var(--neon-cyan);
      color: #a5f3fc;
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.3);
    }

    .audio-unlock-btn {
      background: rgba(245, 158, 11, 0.25);
      border: 1px solid #f59e0b;
      color: #fde68a;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    /* ==================== КООРДИНАТНА СІТКА AETHER v8.5 ==================== */
    .room-layout {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 46px);
      min-height: 0;
      overflow: hidden;
    }

    /* Фоновий шар фонових ліан для заповнення пустого простору */
    .bg-ambient-vines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.38;
    }

    .glass-card {
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      flex-shrink: 0;
    }

    /* ЗА ЗАМОВЧУВАННЯМ РАФАЇЛ ВИМКНЕНИЙ: стіл розширений і по центру лівої частини */
    #mod-raphael-sphere {
      display: none;
      position: absolute;
      left: 2.5%;
      top: 3.6%;
      width: 19.2%;
      height: 26.6%;
      z-index: 25;
      border-color: var(--border-cyan);
      padding: 8px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, rgba(8, 45, 62, 0.42) 0%, rgba(13, 18, 24, 0.94) 78%);
    }

    #mod-raphael-terminal {
      display: none;
      position: absolute;
      left: 2.5%;
      top: 34.9%;
      width: 19.3%;
      height: 63.9%;
      z-index: 25;
      border-color: var(--border-cyan);
      overflow: hidden;
    }

    #mod-table {
      position: absolute;
      left: 2.5%;
      top: 2.2%;
      width: 74.5%;
      height: 95.3%;
      z-index: 10;
      transition: all 0.35s ease;
    }

    #mod-room {
      position: absolute;
      left: 79.3%;
      top: 2.2%;
      width: 19.5%;
      height: 43.5%;
      z-index: 20;
      overflow-y: auto;
    }

    #mod-lobby {
      position: absolute;
      left: 79.3%;
      top: 47.5%;
      width: 19.5%;
      height: 50.0%;
      z-index: 20;
      overflow: hidden;
    }

    /* ПРИ АКТИВНОМУ РАФАЇЛІ (body.raphael-active): зсуваємо стіл вправо і показуємо сферу з терміналом */
    body.raphael-active #mod-raphael-sphere {
      display: flex;
    }

    body.raphael-active #mod-raphael-terminal {
      display: flex;
    }

    body.raphael-active #mod-table {
      left: 21.8%;
      top: 2.2%;
      width: 56.4%;
      height: 63.6%;
    }

    body.raphael-active #mod-lobby {
      height: 50.1%;
    }

    .hidden-compat-dom {
      display: none !important;
    }

    /* ==================== МОДУЛЬ СФЕРИ ТА ТЕРМІНАЛА РАФАЇЛА ==================== */
    #raphael-canvas {
      width: 100%;
      height: 100%;
      max-width: 240px;
      max-height: 240px;
      object-fit: contain;
      cursor: crosshair;
    }

    .raphael-sphere-hud {
      position: absolute;
      top: 7px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: 10px;
      color: #67e8f9;
      pointer-events: none;
    }

    .raphael-log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: rgba(5, 10, 15, 0.9);
      border: 1px solid rgba(34, 211, 238, 0.2);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 11.5px;
      user-select: text;
    }

    .r-log-entry {
      padding: 7px 9px;
      border-radius: 7px;
      background: rgba(15, 23, 42, 0.85);
      border-left: 2.5px solid var(--neon-cyan);
      line-height: 1.42;
      word-break: break-word;
    }

    .r-log-entry.user {
      border-left-color: var(--accent-green);
      background: rgba(6, 78, 59, 0.3);
    }

    .r-log-entry.error {
      border-left-color: #ef4444;
      background: rgba(127, 29, 29, 0.35);
      color: #fecaca;
    }

    .raphael-controls-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .raphael-input-row {
      display: flex;
      gap: 5px;
    }

    .raphael-input-row input {
      flex: 1;
      min-width: 0;
      background: var(--bg-panel-inner);
      border: 1px solid rgba(34, 211, 238, 0.32);
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--text-main);
      font-size: 11.5px;
      outline: none;
    }

    .raphael-input-row input:focus {
      border-color: var(--neon-cyan);
    }

    .r-btn {
      background: rgba(34, 211, 238, 0.14);
      border: 1px solid rgba(34, 211, 238, 0.5);
      color: #a5f3fc;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .r-btn:hover {
      background: rgba(34, 211, 238, 0.26);
    }

    .r-btn-mic {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.6);
      color: #fecaca;
    }

    .r-btn-mic.recording {
      background: rgba(239, 68, 68, 0.5);
      border-color: #ef4444;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.7);
    }

    .r-select {
      width: 100%;
      background: var(--bg-panel-inner);
      border: 1px solid rgba(34, 211, 238, 0.28);
      color: var(--text-main);
      padding: 4px 7px;
      border-radius: 6px;
      font-size: 10.5px;
      outline: none;
    }

    /* ==================== ЦЕНТРАЛЬНА СЦЕНА: СТІЛ З НЕОНОВИМИ ЗАРОСЛЯМИ ==================== */
    .table-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      width: 100%;
      height: 100%;
    }

    .table-assembly {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .table-ambient-glow {
      position: absolute;
      width: 72%;
      height: 62%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(16, 185, 129, 0.24) 0%, rgba(34, 211, 238, 0.08) 45%, transparent 72%);
      filter: blur(24px);
      pointer-events: none;
      z-index: 1;
    }

    .game-table-oval {
      position: relative;
      width: 68%;
      height: 62%;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 35% 40%, rgba(16, 82, 58, 0.52) 0%, transparent 55%),
        radial-gradient(ellipse at 68% 62%, rgba(20, 88, 70, 0.46) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #121b17 0%, #0b100e 72%, #070908 100%);
      border: 3px solid rgba(52, 211, 153, 0.38);
      box-shadow:
        0 30px 75px rgba(0, 0, 0, 0.95),
        0 0 35px rgba(16, 185, 129, 0.22),
        inset 0 0 50px rgba(0, 0, 0, 0.85),
        inset 0 0 24px rgba(52, 211, 153, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      overflow: hidden;
    }

    .table-moss-layer {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 25% 35%, rgba(16, 185, 129, 0.22) 0%, transparent 28%),
        radial-gradient(circle at 75% 30%, rgba(34, 211, 238, 0.16) 0%, transparent 25%),
        radial-gradient(circle at 60% 72%, rgba(16, 185, 129, 0.24) 0%, transparent 32%);
      pointer-events: none;
      z-index: 1;
    }

    .neon-vines-svg {
      position: absolute;
      inset: -6%;
      width: 112%;
      height: 112%;
      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 0 7px rgba(16, 185, 129, 0.7));
      animation: vineBreathe 6s ease-in-out infinite alternate;
    }

    @keyframes vineBreathe {
      0% { filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.45)) brightness(0.95); }
      100% { filter: drop-shadow(0 0 14px rgba(52, 211, 153, 0.95)) brightness(1.18); }
    }

    .vine-spore {
      animation: sporeBlink 3.2s infinite ease-in-out alternate;
    }

    @keyframes sporeBlink {
      0% { opacity: 0.35; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    .table-props-sheet {
      position: absolute;
      width: 34px;
      height: 44px;
      background: rgba(215, 208, 190, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      pointer-events: none;
      z-index: 2;
    }
    .table-props-sheet.s1 { top: 22%; left: 26%; transform: rotate(-18deg); }
    .table-props-sheet.s2 { bottom: 20%; left: 32%; transform: rotate(24deg); }
    .table-props-sheet.s3 { top: 28%; right: 24%; transform: rotate(15deg); }
    .table-props-sheet.s4 { bottom: 24%; right: 28%; transform: rotate(-28deg); }

    .table-inner-ring {
      position: relative;
      z-index: 5;
      width: 42%;
      height: 42%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(9, 18, 15, 0.88) 0%, rgba(9, 18, 15, 0.38) 70%, transparent 100%);
      border: 1px solid rgba(52, 211, 153, 0.3);
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.25), inset 0 0 18px rgba(16, 185, 129, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .table-center-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-seat-adjust-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(16, 24, 21, 0.92);
      border: 1px solid rgba(52, 211, 153, 0.45);
      color: var(--badge-green-text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .table-center-plus {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.25);
      border: 1px solid var(--neon-vine);
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.5);
      transition: transform 0.15s;
    }

    .table-center-plus:hover {
      transform: scale(1.08);
    }

    .table-seats-counter {
      font-size: 10px;
      color: var(--badge-green-text);
      background: rgba(0, 0, 0, 0.65);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(52, 211, 153, 0.25);
    }

    /* ==================== КРІСЛА ТА ВІДЕОВІКНА ==================== */
    .seats-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .seat-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 154px;
      cursor: pointer;
      pointer-events: auto;
      transition: left 0.35s ease, top 0.35s ease, transform 0.2s ease;
    }

    .seat-node:hover {
      transform: translate(-50%, calc(-50% - 3px));
    }

    .chair-back {
      position: absolute;
      top: -12px;
      width: 64px;
      height: 42px;
      border-radius: 14px 14px 6px 6px;
      background: linear-gradient(180deg, #24282c 0%, #141619 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.75);
      z-index: -1;
    }

    .seat-node[data-seat="gm"] .chair-back {
      width: 88px;
      height: 54px;
      top: -16px;
      border-color: rgba(34, 211, 238, 0.5);
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.28);
    }

    .seat-media-frame {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #14171b;
      border: 2px solid rgba(255, 255, 255, 0.16);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.75);
      transition: width 0.25s ease, height 0.25s ease, border-radius 0.25s ease, border-color 0.15s, box-shadow 0.15s;
    }

    .seat-node.has-video .seat-media-frame {
      width: 138px;
      height: 94px;
      border-radius: 10px;
      border-color: rgba(52, 211, 153, 0.65);
    }

    .seat-node.has-video.spotlight .seat-media-frame {
      width: 245px;
      height: 172px;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 32px rgba(34, 211, 238, 0.65);
      z-index: 35;
    }

    .seat-node.speaking .seat-media-frame {
      border-color: var(--neon-vine);
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.95);
    }

    .seat-media-frame video,
    .seat-media-frame canvas.relay-canvas-view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .seat-node.show-webrtc-video .seat-media-frame video {
      opacity: 1;
      z-index: 3;
    }

    .seat-node.show-relay-video .seat-media-frame canvas.relay-canvas-view {
      opacity: 1;
      z-index: 2;
    }

    .seat-avatar-fallback {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      z-index: 1;
    }

    .seat-node.occupied .seat-avatar-fallback {
      color: var(--badge-green-text);
    }

    .seat-node.has-video .seat-avatar-fallback {
      opacity: 0;
    }

    .seat-name-pill {
      background: rgba(18, 20, 24, 0.95);
      border: 1px solid var(--border-subtle);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-main);
      max-width: 148px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .seat-status-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
    }

    .seat-node.occupied .seat-status-badge {
      background: var(--badge-green-bg);
      color: var(--badge-green-text);
    }

    /* ==================== ПРАВА КОЛОНКА (КІМНАТА + ЛОБІ) ==================== */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
      gap: 8px;
    }

    .setting-control {
      background: var(--bg-panel-inner);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);

  <!-- ==================== ОСНОВНИЙ СКРИПТ СТОЛУ ЕТЕР v8.5 ==================== -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      let playerSeatCount = 6;
      const diagBox = document.getElementById('rtc-diag-box');

      function addDiagLine(text) {
        const div = document.createElement('div');
        const time = new Date().toLocaleTimeString('uk-UA', { hour12: false });
        div.textContent = `[${time}] ${text}`;
        diagBox.appendChild(div);
        while (diagBox.children.length > 22) {
          diagBox.removeChild(diagBox.firstChild);
        }
        diagBox.scrollTop = diagBox.scrollHeight;
      }
      window.addAetherDiag = addDiagLine;

      // Перемикач режиму З Рафаїлом / Без Рафаїла (вимкнений за замовчуванням)
      const raphaelToggleBtn = document.getElementById('btn-toggle-raphael-mode');
      raphaelToggleBtn.addEventListener('click', () => {
        const isActive = document.body.classList.toggle('raphael-active');
        raphaelToggleBtn.classList.toggle('active', isActive);
        raphaelToggleBtn.textContent = isActive ? '💠 Рафаїл: УВІМК' : '🔇 Рафаїл: ВИМК';
        addDiagLine(isActive ? 'Режим: DESKTOP_RAPHAEL активний.' : 'Режим: DESKTOP_NO_RAPHAEL активний.');
      });

      if (!window.AetherAudioEngine || !window.AetherVideoEngine || !window.AetherRTCEngine) {
        addDiagLine('ПОМИЛКА: Перевірте наявність aether_audio.js, aether_video.js та aether_rtc.js!');
        return;
      }

      const engine = new window.AetherRTCEngine({
        onNetworkStatus: (text, isOnline) => {
          document.getElementById('network-status').textContent = text;
          document.getElementById('network-dot').classList.toggle('online', isOnline);
        },
        onStateUpdate: (snapshot) => {
          renderTableAndUI(snapshot);
        },
        onSeatCountSync: (newCount) => {
          setSeatsCount(newCount, false);
        },
        onChatMessage: (author, text) => {
          appendChat(author, text);
        },
        onVoiceActivity: (speakingSeatIds) => {
          document.querySelectorAll('.seat-node').forEach((node) => {
            const seatId = node.getAttribute('data-seat');
            node.classList.toggle('speaking', speakingSeatIds.has(seatId));
          });
        },
        onAudioBlocked: (blocked) => {
          document.getElementById('btn-unlock-audio').style.display = blocked ? 'inline-block' : 'none';
        },
        onCameraListUpdated: (rankedCameras, selectedCamId) => {
          const camSel = document.getElementById('select-cam');
          camSel.innerHTML = '';
          rankedCameras.forEach((cam) => {
            const opt = document.createElement('option');
            opt.value = cam.deviceId;
            opt.textContent = cam.isVirtualOrPhone ? `📱 ${cam.label} (Вірт.)` : `📷 ${cam.label}`;
            if (cam.deviceId === selectedCamId) opt.selected = true;
            camSel.appendChild(opt);
          });
        },
        onLog: (msg) => {
          addDiagLine(msg);
        }
      });
      window.aetherEngine = engine;

      playerSeatCount = engine.playerSeatCount || 6;
      document.getElementById('room-code-input').value = engine.roomId;

      function buildSeatsDOM() {
        const layer = document.getElementById('seats-layer');
        layer.innerHTML = '';

        layer.appendChild(createSeatNode('gm', 'GM', 50, 10));

        const N = playerSeatCount;
        const startDeg = 202;
        const endDeg = -22;
        const step = N > 1 ? (endDeg - startDeg) / (N - 1) : 0;
        const roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'];

        for (let i = 0; i < N; i++) {
          const deg = startDeg + step * i;
          const rad = (deg * Math.PI) / 180;
          const x = 50 + 42 * Math.cos(rad);
          const y = 51 + 38 * Math.sin(rad);
          layer.appendChild(createSeatNode(`seat${i + 1}`, roman[i] || String(i + 1), x, y));
        }

        document.getElementById('seats-count-val').textContent = String(N);
        document.getElementById('table-seats-label').textContent = `${N} гравців + Майстер`;
        engine.notifyStateChanged();
      }

      function createSeatNode(seatId, badgeText, xPct, yPct) {
        const div = document.createElement('div');
        div.className = 'seat-node';
        div.setAttribute('data-seat', seatId);
        div.id = `seat-${seatId}`;
        div.style.left = `${xPct}%`;
        div.style.top = `${yPct}%`;

        div.innerHTML = `
          <div class="chair-back"></div>
          <div class="seat-media-frame" id="frame-${seatId}">
            <video id="video-${seatId}" playsinline autoplay muted></video>
            <canvas id="relay-canvas-${seatId}" class="relay-canvas-view" width="240" height="180"></canvas>
            <span class="seat-avatar-fallback">${badgeText}</span>
          </div>
          <div class="seat-name-pill" id="name-${seatId}">${seatId === 'gm' ? 'Місце Майстра' : 'Вільне місце'}</div>
          <span class="seat-status-badge" id="status-${seatId}">Очікуємо</span>
        `;

        div.addEventListener('click', () => {
          engine.unlockAllAudio();
          if (div.classList.contains('has-video') && div.classList.contains('occupied')) {
            div.classList.toggle('spotlight');
            return;
          }
          engine.claimSeat(seatId);
        });
        return div;
      }

      function setSeatsCount(count, broadcast = true) {
        const clamped = Math.max(2, Math.min(8, Number(count) || 6));
        if (clamped === playerSeatCount) return;
        playerSeatCount = clamped;
        buildSeatsDOM();
        if (broadcast) engine.publishSeatCount(playerSeatCount);
      }

      function renderTableAndUI({ localState, localStream, remoteDevices, peers }) {
        const isGM = localState.role === 'gm';
        const nameInput = document.getElementById('local-char-name');
        if (document.activeElement !== nameInput) {
          nameInput.value = localState.name;
        }

        const topBtn = document.getElementById('btn-top-role');
        topBtn.textContent = isGM ? 'Роль: Майстер (GM)' : 'Роль: Гравець';
        topBtn.classList.toggle('gm-mode', isGM);

        document.getElementById('saved-seat-indicator').textContent =
          isGM ? 'Крісло: Майстер (GM)' : `Крісло: #${localState.seat.replace('seat', '')}`;

        const allSeatIds = ['gm'];
        for (let i = 1; i <= playerSeatCount; i++) allSeatIds.push(`seat${i}`);

        const seatMap = new Map();
        if (localState.seat) {
          seatMap.set(localState.seat, { ...localState, isLocal: true });
        }
        remoteDevices.forEach((dev) => {
          if (dev.seat && !seatMap.has(dev.seat)) {
            seatMap.set(dev.seat, { ...dev, isLocal: false });
          }
        });

        allSeatIds.forEach((seatId) => {
          const node = document.getElementById(`seat-${seatId}`);
          if (!node) return;
          const nameEl = document.getElementById(`name-${seatId}`);
          const statusEl = document.getElementById(`status-${seatId}`);
          const occupant = seatMap.get(seatId);

          if (!occupant) {
            node.classList.remove('occupied', 'has-video', 'show-webrtc-video', 'show-relay-video', 'speaking', 'spotlight');

      const startTs = Date.now();
      setInterval(() => {

  <!-- ==================== МОДУЛЬ РАФАЇЛА + АВТО-СЛОТИ RUST WASM ==================== -->
  <script type="module">
    const ENCRYPTED_VEC_ALPHA = [
      82, 248, 128, 156, 63, 72, 25, 42, 23, 133, 187, 236, 50, 19, 1, 198,
      187, 33, 106, 40, 250, 153, 20, 70, 32, 126, 214, 20, 90, 212, 174, 241,
      231, 108, 218, 105, 226, 65, 75, 159, 255, 23, 43, 143, 103, 185, 196, 133,
      228, 45, 143, 24, 200, 61, 24, 250, 175, 242
    ];

    function deriveKeyStreamSeed(password) {
      const cleanPass = String(password || 'vitruvius').trim();
      let h1 = 0x811c9dc5;
      let h2 = 0xcbf29ce4;
      for (let round = 0; round < 512; round++) {
        for (let i = 0; i < cleanPass.length; i++) {
          const ch = cleanPass.charCodeAt(i);
          h1 ^= (ch + round) & 0xff;
          h1 = Math.imul(h1, 0x01000193) >>> 0;
          h2 ^= (ch ^ round) & 0xff;
          h2 = Math.imul(h2, 0x5bd1e995) >>> 0;
        }
      }
      return [h1 >>> 0, h2 >>> 0];
    }

    function nextStreamByte(state, idx) {
      let s0 = (state[0] + Math.imul(idx + 1, 0x9e3779b9)) >>> 0;
      let s1 = (state[1] ^ s0) >>> 0;
      s0 = Math.imul(s0 ^ (s0 >>> 16), 0x85ebca6b) >>> 0;
      s1 = Math.imul(s1 ^ (s1 >>> 13), 0xc2b2ae35) >>> 0;
      state[0] = s0;
      state[1] = s1;
      return ((s0 ^ s1) >>> 0) & 0xff;
    }

    function decryptVector(encryptedArray, masterPassword = 'vitruvius') {
      if (!Array.isArray(encryptedArray) || encryptedArray.length <= 2) return '';
      const state = deriveKeyStreamSeed(masterPassword);
      const expectedTag0 = (state[0] >>> 16) & 0xff;
      const expectedTag1 = (state[1] >>> 16) & 0xff;
      if (encryptedArray[0] !== expectedTag0 || encryptedArray[1] !== expectedTag1) return null;

      let out = '';
      for (let i = 2; i < encryptedArray.length; i++) {
        const mask = nextStreamByte(state, i - 2);
        out += String.fromCharCode(encryptedArray[i] ^ mask);
      }
      return out.trim();
    }

    const unlockedGroqKey = decryptVector(ENCRYPTED_VEC_ALPHA, 'vitruvius') || '';
    let availableGroqModels = [];

    async function discoverGroqModels() {
      if (!unlockedGroqKey) return [];
      try {
        const res = await fetch('https://api.groq.com/openai/v1/models', {
          method: 'GET',
          mode: 'cors',
          credentials: 'omit',
          headers: { 'Authorization': `Bearer ${unlockedGroqKey}` }
        });
        if (!res.ok) return [];
        const data = await res.json();
        const ids = (data?.data || [])
          .map((m) => m.id)
          .filter((id) => !/whisper|guard|tts|playai|embed|vision/i.test(id));
        ids.sort((a, b) => (b.includes('70b') ? 1 : -1));
        availableGroqModels = ids;
        return ids;
      } catch (_) {
        return [];
      }

    async function askRaphaelInAether(userQuery) {
      const query = String(userQuery || '').trim();
      if (!query) return;

      addRaphaelLog(callsign, query, 'user');

        await discoverGroqModels();

      const modelId = availableGroqModels[0] || 'llama-3.3-70b-versatile';

      try {

          messages.push({ role: 'user', content: turn.q });
          messages.push({ role: 'assistant', content: turn.a });

          method: 'POST',
          mode: 'cors',
          credentials: 'omit',
          headers: {

          raphaelHistory.push({ q: query, a: reply });

    const fallbackParticles = Array.from({ length: 360 }, (_, i) => {
      const phi = Math.acos(1 - (2 * (i + 0.5)) / 360);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      return {
        x: Math.cos(theta) * Math.sin(phi),
        y: Math.sin(theta) * Math.sin(phi),
        z: Math.cos(phi)
      };
    });

    let lastTime = performance.now();
    let rotAngle = 0;

    function renderSphereLoop(now) {
      const dt = Math.min(0.05, (now - lastTime) * 0.001);
      lastTime = now;
      rotAngle += dt * 0.75;

      const w = rCanvas.width;
      const h = rCanvas.height;
      rCtx.clearRect(0, 0, w, h);

      if (raphaelWasmEngine) {
        const buf = raphaelWasmEngine.step_and_project(dt, w, h, 0, 0);
        for (let i = 0; i < buf.length; i += 7) {
          rCtx.fillStyle = `rgba(${buf[i + 3] | 0},${buf[i + 4] | 0},${buf[i + 5] | 0},${buf[i + 6]})`;
          rCtx.beginPath();
          rCtx.arc(buf[i], buf[i + 1], buf[i + 2], 0, Math.PI * 2);
          rCtx.fill();
        }
      } else {
        const cx = w * 0.5;
        const cy = h * 0.5;
        const radius = Math.min(w, h) * (0.36 + fallbackVoiceEnergy * 0.08);
        const cosA = Math.cos(rotAngle);
        const sinA = Math.sin(rotAngle);

        for (const p of fallbackParticles) {
          const rx = p.x * cosA - p.z * sinA;
          const rz = p.x * sinA + p.z * cosA;
          const depth = (rz + 1.6) / 2.6;
          rCtx.fillStyle = `rgba(34, 211, 238, ${Math.max(0.18, depth * 0.85)})`;
          rCtx.beginPath();
          rCtx.arc(cx + rx * radius, cy + p.y * radius, 1.2 + depth * 1.4, 0, Math.PI * 2);
          rCtx.fill();
        }
      }

      requestAnimationFrame(renderSphereLoop);
    }

      requestAnimationFrame(renderSphereLoop);
    })();
