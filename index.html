            state.ui.privacyPreviewOpen
              ? `<div class="p-4 rounded-2xl bg-slate-950 border-2 border-amber-500/40 space-y-3 relative z-10">
                  <div class="text-xs font-black uppercase tracking-wider text-amber-300">👀 Попередній перегляд очима інших гравців:</div>
                  <div class="max-w-xl">${renderPublicPlayerCard(char, true)}</div>
                </div>`
              : ''
          }
        </section>
      `;

      const mainStatsAndWoundsHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 w-full">
          <div class="lg:col-span-5 space-y-6">
            <div class="bio-card bg-slate-900/90 border border-slate-800 rounded-2xl p-5 overflow-hidden">
              ${getCardCornerVineSVG()}
              <div class="flex flex-wrap items-center justify-between gap-2 mb-4 relative z-10">
                <h2 class="text-sm font-black uppercase tracking-wider text-white">⚡ Характеристики (Макс. 6)</h2>
                <span class="text-[11px] px-2.5 py-0.5 rounded-full font-bold border ${char.privacy.hideStats ? 'bg-red-500/15 border-red-500/30 text-red-300' : 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300'}">
                  ${char.privacy.hideStats ? '🔒 Приховано від інших' : '👁️ Видимо іншим'}
                </span>
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 relative z-10">
                ${STATS.map(st => {
                  const val = char.stats[st.id];
                  const penalty = getWoundPenalty(char, st.id);
                  const pool = getDicePoolForStat(char, st.id, false);
                  const isSelected = state.diceRoller.selectedStat === st.id;
                  return `
                    <div onclick="selectDiceStat('${st.id}')" class="cursor-pointer rounded-xl p-3 border transition-all flex flex-col justify-between ${isSelected ? 'bg-cyan-500/15 border-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.25)]' : 'bg-slate-950/90 border-slate-800 hover:border-slate-700'}">
                      <div class="flex items-center justify-between">
                        <span class="text-2xl">${st.icon}</span>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-slate-900 text-slate-300">Пул: ${pool}🎲</span>
                      </div>
                      <div class="my-2">
                        <div class="text-xs font-bold text-slate-300">${st.name}</div>
                        ${penalty > 0 ? `<div class="text-[10px] text-red-400 font-semibold">Травма: -${penalty} куб.</div>` : '<div class="text-[10px] text-slate-500">Без штрафу</div>'}
                      </div>
                      <div class="flex items-center justify-between bg-slate-900 rounded-lg p-1 border border-slate-800" onclick="event.stopPropagation()">
                        <button type="button" onclick="changeStat('${st.id}', -1)" ${val <= 1 ? 'disabled' : ''} class="w-7 h-7 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-white font-black text-sm">−</button>
                        <span class="font-black text-lg text-white">${val}</span>
                        <button type="button" onclick="changeStat('${st.id}', 1)" ${val >= 6 ? 'disabled' : ''} class="w-7 h-7 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-white font-black text-sm">+</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            ${renderDiceRollerBox(char)}
          </div>
          <div class="lg:col-span-7 space-y-6">
            ${renderWoundsAndHpBox(char)}
          </div>
        </div>
      `;

      const skillsSectionHTML = (!isGM && L.lockSkills) ? '' : renderSkillsBox(char);
      const inventorySectionHTML = (!isGM && L.lockInventory) ? '' : renderInventoryBox(char);
      const logSectionHTML = (!isGM && L.lockLog) ? '' : renderRollLogBox(char);

      if (tab === 'skills') return headerHTML + renderSkillsBox(char);
      if (tab === 'inventory') return headerHTML + renderInventoryBox(char);
      if (tab === 'log') return headerHTML + renderRollLogBox(char);

      return `${headerHTML}${mainStatsAndWoundsHTML}${skillsSectionHTML}${inventorySectionHTML}${logSectionHTML}`;
    }

    /********************************************************************
     * 17. СТІЛ КИДКІВ КУБИКІВ
     ********************************************************************/
    function renderDiceRollerBox(char) {
      const isGM = state.session.role === 'gm';
      const diceLocked = !isGM && !!state.narrativeLocks.lockDiceTable;
      const selId = state.diceRoller.selectedStat || 'health';
      const selStat = STATS.find(s => s.id === selId) || STATS[0];
      const baseVal = char.stats[selId];
      const penalty = getWoundPenalty(char, selId);
      const { diceMod, flatBonus } = getActiveSkillModifiers(char, selId);
      const extraMod = Number(state.diceRoller.extraDiceMod || 0);
      const pool = getDicePoolForStat(char, selId, true);
      const isRolling = state.diceRoller.isRolling;
      const lastRoll = state.diceRoller.lastRoll;

      const relevantSkills = (char.skills || []).filter(sk =>
        sk.effectType !== 'none' && (sk.statId === selId || sk.statId === 'any')
      );

      return `
        <div class="bio-card bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl overflow-hidden">
          ${getCardCornerVineSVG()}
          <div class="flex items-center justify-between border-b border-slate-800 pb-3 relative z-10">
            <div>
              <h2 class="text-sm font-black uppercase tracking-wider text-white">🎲 Стіл Кидків Кубиків «Вітрувія»</h2>
              <p class="text-xs text-slate-400">Синхронізовано з Ірмінсулем та Картою</p>
            </div>
            <div class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-right">
              <div class="text-[10px] uppercase font-bold text-slate-400">Підсумковий пул</div>
              <div class="text-xl font-black text-cyan-400">${pool} 🎲</div>
            </div>
          </div>

          <div class="relative z-10">
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5">
              ${STATS.map(st => {
                const active = st.id === selId;
                const stPool = getDicePoolForStat(char, st.id, false);
                return `
                  <button type="button" onclick="selectDiceStat('${st.id}')" class="p-2 rounded-xl border text-center transition-all flex flex-col items-center gap-0.5 ${active ? 'bg-cyan-500/20 border-cyan-400 text-white shadow' : 'bg-slate-950 border-slate-800 text-slate-400'}">
                    <span class="text-lg">${st.icon}</span>
                    <span class="text-[10px] font-bold truncate w-full">${st.name}</span>
                    <span class="text-[10px] font-black text-slate-300">${stPool}🎲</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-2.5 relative z-10">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
              <span>База <b>${selStat.icon} ${selStat.name}</b>: <b>${baseVal}</b></span>
              <span class="${penalty > 0 ? 'text-red-400 font-bold' : 'text-slate-500'}">Травми: −${penalty}🎲</span>
              <span class="${diceMod !== 0 ? 'text-emerald-400 font-bold' : 'text-slate-500'}">Навички: ${diceMod >= 0 ? '+' + diceMod : diceMod}🎲</span>
              ${flatBonus !== 0 ? `<span class="text-amber-300 font-bold">Бонус балів: +${flatBonus}</span>` : ''}
            </div>
            <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs">
              <span class="text-slate-400 font-semibold">Ситуативний модифікатор кубів:</span>
              <div class="flex items-center gap-1.5">
                <button type="button" onclick="changeExtraDiceMod(-1)" class="w-6 h-6 rounded bg-slate-800 text-white font-bold">−</button>
                <span class="w-10 text-center font-black ${extraMod > 0 ? 'text-emerald-400' : extraMod < 0 ? 'text-red-400' : 'text-slate-300'}">${extraMod >= 0 ? '+' + extraMod : extraMod}🎲</span>
                <button type="button" onclick="changeExtraDiceMod(1)" class="w-6 h-6 rounded bg-slate-800 text-white font-bold">+</button>
              </div>
            </div>
          </div>

          ${
            relevantSkills.length > 0
              ? `<div class="space-y-1.5 relative z-10">
                  <div class="flex flex-wrap gap-1.5">
                    ${relevantSkills.map(sk => {
                      const isPassive = sk.effectType === 'passive';
                      const applied = isSkillApplied(sk);
                      return `<button type="button" onclick="${isPassive ? '' : `toggleSkillActive('${esc(sk.id)}')`}" class="px-2.5 py-1 rounded-lg text-xs font-bold border ${applied ? 'bg-emerald-500/20 border-emerald-400 text-emerald-200' : 'bg-slate-950 border-slate-800 text-slate-500'}">${isPassive ? '⚡ Пасивна:' : (applied ? '✓ Активна:' : '○ Умовна:')} ${esc(sk.name)} (${sk.diceMod >= 0 ? '+' + sk.diceMod : sk.diceMod}🎲)</button>`;
                    }).join('')}
                  </div>
                </div>`
              : ''
          }

          <button
            type="button"
            onclick="rollVitruviumDice('${selId}')"
            ${isRolling || diceLocked ? 'disabled' : ''}
            class="w-full py-3.5 rounded-xl font-black uppercase tracking-wider text-sm transition-all relative z-10 ${
              diceLocked
                ? 'bg-red-950/60 border border-red-500/40 text-red-300 cursor-not-allowed'
                : 'bg-gradient-to-r from-cyan-500 via-emerald-400 to-lime-400 hover:brightness-110 text-slate-950 shadow-[0_0_22px_rgba(16,185,129,0.35)]'
            }"
          >
            ${diceLocked ? '🔒 Кидки заблоковано Майстром (Сюжетна сцена)' : isRolling ? '🎲 Кубики котяться по столу...' : `🎲 Кинути ${pool} куб. на «${selStat.name}»`}
          </button>

          <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 min-h-[135px] flex flex-col justify-between space-y-3 relative z-10">
            ${
              isRolling
                ? `<div class="flex flex-col items-center justify-center py-6 space-y-3">
                    <div class="flex flex-wrap items-center justify-center gap-3">
                      ${Array.from({ length: Math.max(1, state.diceRoller.rollingCount) }).map(() => `<div class="dice-rolling-spin w-14 h-16 rounded-xl bg-slate-900 border border-cyan-500/40 flex items-center justify-center p-2">${getEntropiaSymbolHTML('full', 'w-8 h-8')}</div>`).join('')}
                    </div>
                  </div>`
                : lastRoll
                ? `
                <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-2">
                  <div>
                    <span class="text-xs font-bold text-white">${lastRoll.statIcon} ${esc(lastRoll.statName)}</span>
                    <span class="text-[11px] text-slate-500 ml-1.5">(${esc(lastRoll.time)})</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400">Сума балів:</span>
                    <span class="px-3 py-1 rounded-xl font-black text-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">${lastRoll.totalScore}</span>
                  </div>
                </div>
                <div class="flex flex-wrap gap-2.5 py-1">
                  ${
                    lastRoll.results.length > 0
                      ? lastRoll.results.map((r, idx) => `
                          <div class="dice-land w-14 h-16 rounded-xl bg-slate-900 border-2 ${r.points === 2 ? 'border-cyan-400 bg-cyan-500/10' : r.points === 1 ? 'border-slate-500 bg-slate-900' : 'border-slate-800 opacity-50'} flex flex-col items-center justify-center p-1 shadow-md" style="animation-delay:${idx * 45}ms">
                            ${getEntropiaSymbolHTML(r.mode, 'w-8 h-8')}
                            <span class="text-[10px] font-black mt-1 ${r.points === 2 ? 'text-white' : r.points === 1 ? 'text-slate-200' : 'text-slate-500'}">+${r.points}</span>
                          </div>
                        `).join('')
                      : `<div class="text-xs text-red-400 font-bold py-4">Пул кубиків дорівнює 0!</div>`
                  }
                </div>
              `
                : `<div class="flex flex-col items-center justify-center py-6 text-center text-slate-500"><div class="text-2xl mb-1">💠</div><div class="text-xs font-semibold">Стіл для кидків готовий</div></div>`
            }
          </div>
        </div>
      `;
    }

    /********************************************************************
     * 18. ЛИСТ ПОРАНЕНЬ ТА ШКАЛА ХП
     ********************************************************************/
    function renderWoundsAndHpBox(char) {
      const maxHpCols = Number(char.stats.health || 1);
      const { hp, maxHp } = calculateCharacterHpNumbers(char);

      return `
        <div class="bio-card bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-6 overflow-hidden">
          ${getCardCornerVineSVG()}
          <div class="relative z-10">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <h2 class="text-sm font-black uppercase tracking-wider text-white">🩸 Лист Поранень по Характеристиках</h2>
                <p class="text-xs text-slate-400">Кожні 2 замальовані іконки в рядку дають штраф <b>−1 кубик</b></p>
              </div>
            </div>
            <div class="space-y-2">
              ${STATS.map(st => {
                const row = char.wounds[st.id] || [false, false, false, false, false, false];
                const penalty = getWoundPenalty(char, st.id);
                return `
                  <div class="flex items-center justify-between gap-2 p-2 rounded-xl bg-slate-950 border border-slate-800/90">
                    <div class="w-32 sm:w-40 flex items-center gap-2">
                      <span class="text-xl">${st.icon}</span>
                      <div>
                        <div class="text-xs font-bold text-slate-200">${st.name}</div>
                        <div class="text-[10px] ${penalty > 0 ? 'text-red-400 font-bold' : 'text-slate-500'}">Штраф: −${penalty} 🎲</div>
                      </div>
                    </div>
                    <div class="grid grid-cols-6 gap-1.5 flex-1 max-w-xs">
                      ${row.map((marked, idx) => `
                        <button type="button" onclick="toggleWoundCell('${st.id}', ${idx})" class="h-10 rounded-lg border transition-all flex items-center justify-center text-base ${marked ? 'bg-red-500/30 border-red-400 text-white shadow-[inset_0_0_10px_rgba(239,68,68,0.5)]' : 'bg-slate-900 border-slate-800 opacity-35 hover:opacity-75'}">
                          <span class="${marked ? 'line-through decoration-red-400 decoration-2' : ''}">${st.icon}</span>
                        </button>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="pt-4 border-t border-slate-800 relative z-10">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="text-sm font-black uppercase tracking-wider text-white">❤️ Шкала Здоров'я (ХП Персонажа)</h3>
                  <span class="px-2 py-0.5 rounded-lg bg-cyan-500/15 border border-cyan-500/30 text-cyan-300 text-xs font-black">${hp} / ${maxHp} HP</span>
                </div>
                <p class="text-xs text-slate-400">Синхронізовано з «📡 ЕТЕР» та «🌳 Ірмінсуль». Активних стовпчиків: <b>${maxHpCols}</b></p>
              </div>
              <div class="flex items-center gap-2">
                <button type="button" onclick="stepHpDamage(true)" class="px-3 py-1.5 rounded-lg bg-red-500/20 border border-red-500/40 text-red-300 text-xs font-extrabold">−1 ХП (Шкода)</button>
                <button type="button" onclick="stepHpDamage(false)" class="px-3 py-1.5 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-extrabold">+1 ХП (Лікування)</button>
              </div>
            </div>

            <div class="space-y-2 bg-slate-950 p-4 rounded-xl border border-slate-800">
              ${HP_ROWS.map((rowLabel, rIdx) => `
                <div class="flex items-center justify-between gap-3 py-1">
                  <span class="w-36 font-extrabold text-sm ${rIdx === 4 ? 'text-red-400' : rIdx >= 2 ? 'text-amber-300' : 'text-slate-200'}">${rowLabel}</span>
                  <div class="grid grid-cols-6 gap-2 flex-1 max-w-xs">
                    ${[0, 1, 2, 3, 4, 5].map(cIdx => {
                      const isAvailable = cIdx < maxHpCols;
                      const isFilled = char.hpGrid?.[rIdx]?.[cIdx];
                      if (!isAvailable) return `<div class="w-9 h-9 rounded-full border border-slate-800 striped-disabled flex items-center justify-center text-[10px] text-slate-600 select-none">✕</div>`;
                      return `<button type="button" onclick="toggleHpCircle(${rIdx}, ${cIdx})" class="w-9 h-9 rounded-full border-2 transition-all flex items-center justify-center ${isFilled ? 'bg-red-500 border-red-300 text-slate-950 font-black shadow-[0_0_12px_rgba(239,68,68,0.6)]' : 'bg-slate-900 border-slate-500 hover:border-white'}">${isFilled ? '✕' : ''}</button>`;
                    }).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /********************************************************************
     * 19. КАРТКИ НАВИЧОК, ІНВЕНТАР ТА ЖУРНАЛ
     ********************************************************************/
    function renderSkillsBox(char) {
      const skills = char.skills || [];
      const isFormOpen = state.ui.skillFormOpen;
      const effType = state.ui.newSkillEffectType || 'active';

      return `
        <section class="bio-card w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-5 overflow-hidden">
          ${getCardCornerVineSVG()}
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4 relative z-10">
            <div>
              <h2 class="text-base font-black uppercase tracking-wider text-white">🃏 Картки Навичок та Модифікатори</h2>
              <p class="text-xs text-slate-400 mt-0.5">Підтримуються 3 типи навичок: <b>⚡ Пасивні</b>, <b>🎯 Активні / Умовні</b> та <b>📘 Без ефектів</b>.</p>
            </div>
            <button type="button" onclick="toggleSkillForm()" class="px-4 py-2.5 rounded-xl font-extrabold text-xs uppercase tracking-wider ${isFormOpen ? 'bg-slate-800 text-slate-200 border border-slate-700' : 'bg-gradient-to-r from-cyan-500 to-emerald-400 text-slate-950'}">
              ${isFormOpen ? '✕ Сховати конструктор' : '+ Створити нову навичку'}
            </button>
          </div>

          ${
            isFormOpen
              ? `
              <form onsubmit="addSkillFromForm(event)" class="bg-slate-950 border-2 border-cyan-500/40 rounded-xl p-4 space-y-4 shadow-xl relative z-10">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <button type="button" onclick="setNewSkillEffectType('passive')" class="p-2.5 rounded-xl border text-left text-xs font-bold ${effType === 'passive' ? 'bg-emerald-500/20 border-emerald-400 text-emerald-200' : 'bg-slate-900 border-slate-800 text-slate-400'}">⚡ Пасивний ефект</button>
                  <button type="button" onclick="setNewSkillEffectType('active')" class="p-2.5 rounded-xl border text-left text-xs font-bold ${effType === 'active' ? 'bg-cyan-500/20 border-cyan-400 text-cyan-200' : 'bg-slate-900 border-slate-800 text-slate-400'}">🎯 Активний / Умовний</button>
                  <button type="button" onclick="setNewSkillEffectType('none')" class="p-2.5 rounded-xl border text-left text-xs font-bold ${effType === 'none' ? 'bg-purple-500/20 border-purple-400 text-purple-200' : 'bg-slate-900 border-slate-800 text-slate-400'}">📘 Без ефектів (Опис)</button>
                </div>

                <div class="grid grid-cols-1 ${effType === 'none' ? 'md:grid-cols-1' : 'md:grid-cols-4'} gap-3">
                  <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Назва навички *</label>
                    <input id="skName" type="text" placeholder="Напр.: Тактичний аналіз" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" required />
                  </div>
                  ${
                    effType !== 'none'
                      ? `
                      <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Характеристика</label>
                        <select id="skStat" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white">
                          <option value="any">🌟 Будь-яка характеристика</option>
                          ${STATS.map(s => `<option value="${s.id}">${s.icon} ${s.name}</option>`).join('')}
                        </select>
                      </div>
                      <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Модифікатор кубиків (🎲)</label>
                        <select id="skDiceMod" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white">
                          <option value="-2">-2 кубики</option>
                          <option value="-1">-1 кубик</option>
                          <option value="0">0 кубиків</option>
                          <option value="1" selected>+1 кубик</option>
                          <option value="2">+2 кубики</option>
                          <option value="3">+3 кубики</option>
                          <option value="4">+4 кубики</option>
                        </select>
                      </div>
                      <div>
                        <label class="block text-[11px] text-slate-400 mb-1">Бонус балів</label>
                        <select id="skFlatBonus" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white">
                          <option value="0" selected>+0 балів</option>
                          <option value="1">+1 бал</option>
                          <option value="2">+2 бали</option>
                          <option value="3">+3 бали</option>
                        </select>
                      </div>
                    `
                      : ''
                  }
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <input id="skCondition" type="text" placeholder="Умова активації (необов'язково)..." class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" />
                  <input id="skDesc" type="text" placeholder="Детальний опис дії навички..." class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" />
                </div>

                <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-800">
                  <label class="inline-flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                    <input id="skHidden" type="checkbox" class="rounded bg-slate-900 border-slate-700" />
                    <span>🔒 Приховати цю навичку від інших гравців</span>
                  </label>
                  <button type="submit" class="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-extrabold text-xs">✓ Зберегти Картку Навички</button>
                </div>
              </form>
            `
              : ''
          }

          <div class="relative z-10">
            ${
              skills.length === 0
                ? `<div class="p-6 rounded-xl bg-slate-950 border border-slate-800 text-center text-xs text-slate-400">Лист навичок порожній.</div>`
                : `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${skills.map(sk => {
                      const stObj = STATS.find(s => s.id === sk.statId);
                      const stLabel = sk.effectType === 'none' ? '📘 Описова навичка' : (stObj ? `${stObj.icon} ${stObj.name}` : '🌟 Всі характеристики');
                      const applied = isSkillApplied(sk);
                      return `
                        <div class="p-4 rounded-xl bg-slate-950 border ${applied ? 'border-cyan-500/50' : 'border-slate-800'} flex flex-col justify-between gap-3">
                          <div class="space-y-2">
                            <div class="flex items-start justify-between gap-2">
                              <div>
                                <h3 class="font-extrabold text-sm text-white">${esc(sk.name)}</h3>
                                <span class="text-[11px] text-slate-400">${stLabel}</span>
                              </div>
                              ${sk.effectType === 'none' ? `<span class="px-2.5 py-1 rounded-lg bg-purple-500/15 text-purple-300 font-bold text-[11px]">📘 Без ефектів</span>` : `<span class="px-2.5 py-1 rounded-lg bg-cyan-500/15 text-cyan-300 font-black text-xs">${sk.diceMod >= 0 ? '+' + sk.diceMod : sk.diceMod} 🎲</span>`}
                            </div>
                            ${sk.condition ? `<div class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-[11px] text-amber-300"><b>Умова:</b> ${esc(sk.condition)}</div>` : ''}
                            ${sk.description ? `<p class="text-xs text-slate-300 leading-relaxed">${esc(sk.description)}</p>` : ''}
                          </div>
                          <div class="pt-3 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-2">
                            ${
                              sk.effectType === 'passive'
                                ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 text-[11px] font-bold">⚡ Пасивна</span>`
                                : sk.effectType === 'none'
                                ? `<span class="px-2.5 py-1 rounded-lg bg-slate-900 text-slate-400 text-[11px]">📘 Опис</span>`
                                : `<button type="button" onclick="toggleSkillActive('${esc(sk.id)}')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold border ${sk.active ? 'bg-cyan-500 text-slate-950 border-cyan-400' : 'bg-slate-900 text-slate-400 border-slate-700'}">${sk.active ? '✓ Активна' : '○ Вимкнена'}</button>`
                            }
                            <div class="flex items-center gap-1.5">
                              <button type="button" onclick="toggleSkillHidden('${esc(sk.id)}')" class="px-2 py-1 rounded-lg border text-[11px] font-bold ${sk.hidden ? 'bg-red-500/15 border-red-500/40 text-red-300' : 'bg-slate-900 border-slate-800 text-slate-300'}">${sk.hidden ? '🔒' : '👁️'}</button>
                              <button type="button" onclick="deleteSkill('${esc(sk.id)}')" class="px-2 py-1 rounded-lg bg-red-500/15 text-[11px] text-red-300">🗑️</button>
                            </div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>`
            }
          </div>
        </section>
      `;
    }

    function renderInventoryBox(char) {
      return `
        <section class="w-full grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bio-card bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col overflow-hidden">
            ${getCardCornerVineSVG()}
            <label class="text-xs font-black uppercase tracking-wider text-white mb-2 relative z-10">⭐⭐⭐ Бойове Спорядження та Зброя</label>
            <textarea id="charEquipTextarea" rows="5" oninput="updateTextField('equipment', this.value)" placeholder="Бронежилет, зброя, набої..." class="w-full flex-1 p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-cyan-400 relative z-10">${esc(char.equipment)}</textarea>
          </div>
          <div class="bio-card bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col overflow-hidden">
            ${getCardCornerVineSVG()}
            <label class="text-xs font-black uppercase tracking-wider text-white mb-2 relative z-10">🎒 Рюкзак та Особисті Речі</label>
            <textarea id="charBackpackTextarea" rows="5" oninput="updateTextField('backpack', this.value)" placeholder="Аптечка, ліхтар, рація..." class="w-full flex-1 p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-cyan-400 relative z-10">${esc(char.backpack)}</textarea>
          </div>
          <div class="bio-card bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col overflow-hidden">
            ${getCardCornerVineSVG()}
            <label class="text-xs font-black uppercase tracking-wider text-white mb-2 relative z-10">📄 Досьє, Квести та Нотатки</label>
            <textarea id="charNotesTextarea" rows="5" oninput="updateTextField('notes', this.value)" placeholder="Історія персонажа, важливі імена..." class="w-full flex-1 p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-cyan-400 relative z-10">${esc(char.notes)}</textarea>
          </div>
        </section>
      `;
    }

    function renderRollLogBox(char) {
      const scope = state.ui.rollLogScope || 'personal';
      const personalLogs = getPersonalRollLogs(char);
      const campaignLogs = state.campaignRollLogs || [];
      const activeLogs = scope === 'personal' ? personalLogs : campaignLogs;

      return `
        <section class="bio-card w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-4 overflow-hidden">
          ${getCardCornerVineSVG()}
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3 relative z-10">
            <div>
              <h2 class="text-sm font-black uppercase tracking-wider text-white">📜 Журнал Кидків Кубиків</h2>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button type="button" onclick="setRollLogScope('personal')" class="px-3 py-1.5 rounded-lg text-xs font-extrabold ${scope === 'personal' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'}">👤 Особистий: ${esc(char.name)} (${personalLogs.length})</button>
                <button type="button" onclick="setRollLogScope('campaign')" class="px-3 py-1.5 rounded-lg text-xs font-extrabold ${scope === 'campaign' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'}">🌍 Усі кидки кампанії (${campaignLogs.length})</button>
              </div>
              ${activeLogs.length > 0 ? `<button type="button" onclick="clearRollLogs()" class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-400 hover:text-red-400">Очистити</button>` : ''}
            </div>
          </div>

          <div class="relative z-10">
            ${
              activeLogs.length === 0
                ? `<div class="p-6 rounded-xl bg-slate-950 border border-slate-800 text-center text-xs text-slate-500 italic">У цьому журналі ще немає записів кидків.</div>`
                : `<div class="space-y-2">
                    ${activeLogs.map(item => `
                      <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 flex flex-wrap items-center justify-between gap-3 text-xs">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="text-slate-500 font-mono">[${esc(item.time)}]</span>
                          <span class="px-2 py-0.5 rounded bg-slate-900 border border-slate-700 font-bold text-cyan-300">👤 ${esc(item.charName || char.name)}</span>
                          <b class="text-white">${item.statIcon || '🎲'} ${esc(item.statName)}</b>
                          <span class="text-slate-400">(Пул: ${item.diceCount}🎲)</span>
                        </div>
                        <div class="px-3 py-1 rounded-lg bg-cyan-500/15 border border-cyan-500/30 font-black text-sm text-cyan-300">Сума: ${item.totalScore}</div>
                      </div>
                    `).join('')}
                  </div>`
            }
          </div>
        </section>
      `;
    }

    /********************************************************************
     * 21. БЕЗПЕЧНИЙ РЕНДЕР (З ПІДТРИМКОЮ «ЕТЕРУ» ТА PLAYLIST_MANAGER.JS)
     ********************************************************************/
    function updateAetherTabVisibility() {
      const aetherContainer = document.getElementById('aether-tab-container');
      if (!aetherContainer) return;

      const shouldShowAether = state.session.loggedIn && state.session.activeTab === 'aether' && !isTabLockedForCurrentPlayer('aether');
      if (shouldShowAether) {
        aetherContainer.classList.remove('is-hidden');
      } else {
        aetherContainer.classList.add('is-hidden');
      }
    }

    function safeRenderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      const activeEl = document.activeElement;
      const activeId = activeEl?.id || null;
      const selStart = activeEl?.selectionStart ?? null;
      const selEnd = activeEl?.selectionEnd ?? null;

      try {
        if (!state.session.loggedIn) {
          root.innerHTML = renderLoginScreen();
        } else {
          root.innerHTML = renderMainSheet();
        }

        updateAetherTabVisibility();

        if (state.session.loggedIn && state.session.activeTab === 'audio' && window.BabylonPlaylistManager && typeof window.BabylonPlaylistManager.mount === 'function') {
          window.BabylonPlaylistManager.mount('babylon-playlist-manager-root');
        }

        if (activeId) {
          const restored = document.getElementById(activeId);
          if (restored) {
            restored.focus();
            if (selStart !== null && typeof restored.setSelectionRange === 'function') {
              try { restored.setSelectionRange(selStart, selEnd); } catch (_) {}
            }
          }
        }
      } catch (err) {
        console.error('Помилка рендеру:', err);
      }
    }

    // Старт системи
    loadDatabase();
    renderBioluminescentOverlay();
    safeRenderApp();
    startAllCloudEngines();

    setTimeout(() => {
      window.broadcastCharacterToAether(window.getCurrentSheetCharacter(), window.isCurrentUserGM());
    }, 400);
  </script>
</body>
</html>
