<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вітрувій • ЕНТРОПІЯ — Мережева Система</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Бібліотека для миттєвої синхронізації між різними пристроями через інтернет -->
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #070b12;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
    }
    @keyframes diceTumble {
      0%   { transform: translateY(-32px) rotateX(180deg) rotateZ(-30deg) scale(0.65); opacity: 0.25; }
      50%  { transform: translateY(8px) rotateX(-15deg) rotateZ(15deg) scale(1.06); opacity: 1; }
      80%  { transform: translateY(-4px) rotateX(8deg) rotateZ(-4deg) scale(0.98); opacity: 1; }
      100% { transform: translateY(0) rotateX(0deg) rotateZ(0deg) scale(1); opacity: 1; }
    }
    @keyframes diceSpinContinuous {
      0%   { transform: rotate(0deg) scale(0.9); }
      50%  { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(0.9); }
    }
    .dice-land {
      animation: diceTumble 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .dice-rolling-spin {
      animation: diceSpinContinuous 0.36s linear infinite;
    }
    .striped-disabled {
      background: repeating-linear-gradient(
        45deg,
        rgba(30, 41, 59, 0.35),
        rgba(30, 41, 59, 0.35) 5px,
        rgba(15, 23, 42, 0.85) 5px,
        rgba(15, 23, 42, 0.85) 10px
      );
    }
  </style>
</head>
<body class="min-h-screen bg-[#070b12] text-slate-100 selection:bg-cyan-500 selection:text-black">

  <div id="app" class="min-h-screen flex flex-col">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center space-y-3">
        <div class="text-4xl">💠</div>
        <h1 class="text-xl font-black uppercase tracking-wider text-white">ВІТРУВІЙ • ЕНТРОПІЯ</h1>
        <p class="text-xs text-slate-400">Підключення до хмарної кімнати кампанії...</p>
      </div>
    </div>
  </div>

  <audio id="globalAudioElement" class="hidden" crossorigin="anonymous"></audio>

  <script>
    /********************************************************************
     * 1. КОНСТАНТИ СИСТЕМИ «ВІТРУВІЙ • ЕНТРОПІЯ»
     ********************************************************************/
    const STORAGE_KEY = 'vitruvium_entropia_v9_cloud';
    const MAP_BASE_URL = 'https://nazarshulik0-dotcom.github.io/entropia_map/';
    const GM_SECRET_PASSWORD = 'ентропія';
    const DEFAULT_ROOM_CODE = 'entropia-main';

    // Надійні публічні WSS-брокери для синхронізації між телефоном, ноутбуком і ПК
    const MQTT_BROKERS = [
      'wss://broker.emqx.io:8084/mqtt',
      'wss://broker.hivemq.com:8884/mqtt',
      'wss://test.mosquitto.org:8081/mqtt'
    ];

    const STATS = [
      { id: 'health',      name: "Здоров'я",    icon: '❤️' },
      { id: 'attention',   name: 'Уважність',   icon: '👁️' },
      { id: 'combat',      name: 'Битва',       icon: '💪' },
      { id: 'agility',     name: 'Спритність',  icon: '🦶' },
      { id: 'thinking',    name: 'Мислення',    icon: '🧠' },
      { id: 'social',      name: 'Спілкування', icon: '🎭' }
    ];

    const HP_ROWS = [
      'Здоровий',
      'Травмований',
      'Поранений',
      'Скалічений',
      'При смерті'
    ];

    const BUILTIN_AMBIENTS = [
      { id: 'synth_sector0', title: 'Сектор 0: Комплекс «СІЕЛЬ» (Кібер-дрон)', freq1: 110, freq2: 165, lfo: 0.18, type: 'sine' },
      { id: 'synth_sector1', title: 'Сектор 1: Карантинні Сади (Біолюмінесценція)', freq1: 146.8, freq2: 220, lfo: 0.25, type: 'triangle' },
      { id: 'synth_sector2', title: 'Сектор 2: Іржаві Пустки (Індустріальний гул)', freq1: 73.4, freq2: 110, lfo: 0.12, type: 'sawtooth' },
      { id: 'synth_sector5', title: 'Сектор 5: Примарний Мегаполіс (Ехо мережі)', freq1: 130.8, freq2: 196, lfo: 0.32, type: 'sine' },
      { id: 'synth_sector8', title: 'Сектор 8: Токсичні Джунглі (Пульс Скверни)', freq1: 65.4, freq2: 92.5, lfo: 0.45, type: 'triangle' }
    ];

    function esc(val) {
      if (val === null || val === undefined) return '';
      return String(val)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /********************************************************************
     * 2. ГРАФІКА КУБИКІВ «ЕНТРОПІЇ» (💠)
     ********************************************************************/
    function getEntropiaSymbolHTML(mode = 'full', sizeClass = 'w-10 h-10') {
      if (mode === 'empty') {
        return `<div class="${sizeClass} rounded-lg border border-dashed border-slate-700 flex items-center justify-center text-slate-600 text-xs font-bold select-none">0</div>`;
      }
      if (mode === 'half') {
        return `
          <div class="${sizeClass} relative flex items-center justify-center select-none" title="Половинка символу (1 бал)">
            <span class="text-2xl opacity-20">💠</span>
            <span class="text-2xl absolute inset-0 flex items-center justify-center drop-shadow-[0_0_8px_rgba(34,211,238,0.85)]" style="clip-path: inset(0 50% 0 0);">💠</span>
          </div>
        `;
      }
      return `<div class="${sizeClass} flex items-center justify-center text-2xl select-none drop-shadow-[0_0_12px_rgba(34,211,238,0.95)]" title="Повний символ (2 бали)">💠</div>`;
    }

    /********************************************************************
     * 3. СТВОРЕННЯ ТА НОРМАЛІЗАЦІЯ ПЕРСОНАЖА З МІТКОЮ ЧАСУ (updatedAt)
     ********************************************************************/
    function createBlankCharacter(id, ownerLogin, name, isNpc = false) {
      const stats = {};
      const wounds = {};
      STATS.forEach(s => {
        stats[s.id] = 1;
        wounds[s.id] = [false, false, false, false, false, false];
      });

      const hpGrid = HP_ROWS.map(() => [false, false, false, false, false, false]);

      return {
        id: String(id),
        owner: String(ownerLogin || 'гравець'),
        name: String(name || ownerLogin || 'Персонаж'),
        isNpc: !!isNpc,
        archetype: '',
        stats: stats,
        wounds: wounds,
        hpGrid: hpGrid,
        skills: [],
        equipment: '',
        backpack: '',
        notes: '',
        inspiration: {
          count: 0,
          pendingRequest: false,
          lastStatus: ''
        },
        privacy: {
          hideStats: false,
          hideHealth: false,
          hideSkills: false
        },
        rollLog: [],
        updatedAt: Date.now()
      };
    }

    function normalizeCharacter(raw) {
      const fallbackId = raw?.id || ('char_' + Date.now());
      const base = createBlankCharacter(
        fallbackId,
        raw?.owner || 'гравець',
        raw?.name || 'Безіменний',
        !!raw?.isNpc
      );

      if (!raw || typeof raw !== 'object') return base;

      base.name = String(raw.name || base.name);
      base.owner = String(raw.owner || base.owner);
      base.isNpc = !!raw.isNpc;
      base.archetype = String(raw.archetype || '');
      base.equipment = String(raw.equipment || '');
      base.backpack = String(raw.backpack || '');
      base.notes = String(raw.notes || '');
      base.updatedAt = Number(raw.updatedAt) || 1;

      STATS.forEach(s => {
        const val = Number(raw.stats?.[s.id]);
        base.stats[s.id] = Number.isFinite(val) ? Math.min(6, Math.max(1, Math.round(val))) : 1;

        const wArr = raw.wounds?.[s.id];
        if (Array.isArray(wArr)) {
          base.wounds[s.id] = [0, 1, 2, 3, 4, 5].map(i => !!wArr[i]);
        }
      });

      if (Array.isArray(raw.hpGrid)) {
        base.hpGrid = HP_ROWS.map((_, rIdx) => {
          const row = raw.hpGrid[rIdx];
          return [0, 1, 2, 3, 4, 5].map(cIdx => Array.isArray(row) ? !!row[cIdx] : false);
        });
      }

      if (Array.isArray(raw.skills)) {
        base.skills = raw.skills.map((sk, idx) => {
          const effectType = ['passive', 'active', 'none'].includes(sk?.effectType)
            ? sk.effectType
            : 'active';
          return {
            id: String(sk?.id || ('sk_' + idx + '_' + Date.now())),
            name: String(sk?.name || 'Навичка'),
            effectType: effectType,
            statId: String(sk?.statId || 'any'),
            diceMod: effectType === 'none' ? 0 : (Number.isFinite(Number(sk?.diceMod)) ? Number(sk.diceMod) : 0),
            flatBonus: effectType === 'none' ? 0 : (Number.isFinite(Number(sk?.flatBonus)) ? Number(sk.flatBonus) : 0),
            condition: String(sk?.condition || ''),
            description: String(sk?.description || ''),
            active: effectType === 'passive' ? true : (effectType === 'none' ? false : !!sk?.active),
            hidden: !!sk?.hidden
          };
        });
      }

      if (raw.inspiration && typeof raw.inspiration === 'object') {
        base.inspiration = {
          count: Math.max(0, Number(raw.inspiration.count) || 0),
          pendingRequest: !!raw.inspiration.pendingRequest,
          lastStatus: String(raw.inspiration.lastStatus || '')
        };
      }

      if (raw.privacy && typeof raw.privacy === 'object') {
        base.privacy = {
          hideStats: !!raw.privacy.hideStats,
          hideHealth: !!raw.privacy.hideHealth,
          hideSkills: !!raw.privacy.hideSkills
        };
      }

      if (Array.isArray(raw.rollLog)) {
        base.rollLog = raw.rollLog.filter(Boolean).slice(0, 40);
      }

      return base;
    }

    /********************************************************************
     * 4. ГЛОБАЛЬНИЙ СТАН ТА МЕРЕЖЕВА СИНХРОНІЗАЦІЯ МІЖ ПРИСТРОЯМИ
     ********************************************************************/
    const CLIENT_ID = 'dev_' + Math.random().toString(36).slice(2, 10);

    window.state = {
      roomCode: DEFAULT_ROOM_CODE,
      firebaseDbUrl: '', // Опціональний URL Firebase Realtime DB
      characters: {},
      deletedChars: {},  // { charId: timestamp } щоб видалені ГМ персонажі видалялися у всіх
      campaignRollLogs: [],
      audioTracks: [],
      audioState: {
        activeTrackId: null,
        activeTitle: '',
        activeUrl: '',
        mode: 'none',
        isPlaying: false,
        volume: 0.6,
        updatedAt: 1
      },
      cloud: {
        status: 'connecting', // 'connecting' | 'online' | 'error'
        brokerIndex: 0,
        lastSyncTime: '',
        cloudModalOpen: false
      },
      session: {
        loggedIn: false,
        role: 'player',
        loginName: '',
        activeCharId: null,
        gmCategory: 'players',
        activeTab: 'all'
      },
      loginForm: {
        role: 'player',
        loginInput: '',
        charNameInput: '',
        gmPasswordInput: '',
        roomInput: DEFAULT_ROOM_CODE,
        errorMsg: ''
      },
      diceRoller: {
        selectedStat: 'health',
        extraDiceMod: 0,
        isRolling: false,
        rollingCount: 0,
        lastRoll: null
      },
      ui: {
        skillFormOpen: false,
        newSkillEffectType: 'active',
        privacyPreviewOpen: false,
        simulateOtherView: true,
        rollLogScope: 'personal',
        mapForceRole: null,
        mapCacheBust: Date.now(),
        mapTall: false
      }
    };

    let mqttClient = null;
    let textSyncTimeout = null;
    let firebasePollInterval = null;
    const localAudioBlobs = {};
    let webAudioCtx = null;
    let webAudioNodes = [];

    // Читання локального бекапу
    function loadDatabase() {
      try {
        const keysToTry = [STORAGE_KEY, 'vitruvium_entropia_v8_final', 'vitruvium_app_v6_stable'];
        let parsed = null;

        for (const k of keysToTry) {
          const raw = localStorage.getItem(k);
          if (raw) {
            try {
              const candidate = JSON.parse(raw);
              if (candidate && typeof candidate === 'object') {
                parsed = candidate;
                break;
              }
            } catch (_) {}
          }
        }

        if (!parsed) return;

        if (parsed.roomCode) {
          state.roomCode = String(parsed.roomCode).trim().toLowerCase() || DEFAULT_ROOM_CODE;
          state.loginForm.roomInput = state.roomCode;
        }
        if (parsed.firebaseDbUrl) {
          state.firebaseDbUrl = String(parsed.firebaseDbUrl).trim();
        }
        if (parsed.deletedChars && typeof parsed.deletedChars === 'object') {
          state.deletedChars = parsed.deletedChars;
        }
        if (parsed.characters && typeof parsed.characters === 'object') {
          const cleanChars = {};
          Object.keys(parsed.characters).forEach(id => {
            const c = parsed.characters[id];
            if (c && !state.deletedChars[id]) {
              cleanChars[id] = normalizeCharacter(c);
            }
          });
          state.characters = cleanChars;
        }
        if (Array.isArray(parsed.campaignRollLogs)) {
          state.campaignRollLogs = parsed.campaignRollLogs.filter(Boolean).slice(0, 80);
        }
        if (Array.isArray(parsed.audioTracks)) {
          state.audioTracks = parsed.audioTracks.filter(Boolean);
        }
        if (parsed.audioState && typeof parsed.audioState === 'object') {
          state.audioState = {
            ...state.audioState,
            ...parsed.audioState
          };
        }
      } catch (err) {
        console.warn('Помилка читання localStorage:', err);
      }
    }

    // Збереження локально + Відправка в Хмару (іншим пристроям)
    function saveDatabase(broadcastToCloud = true) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          roomCode: state.roomCode,
          firebaseDbUrl: state.firebaseDbUrl,
          characters: state.characters,
          deletedChars: state.deletedChars,
          campaignRollLogs: state.campaignRollLogs,
          audioTracks: state.audioTracks.filter(t => !t.isLocalBlob),
          audioState: state.audioState
        }));
      } catch (err) {
        console.error('Помилка локального збереження:', err);
      }

      if (broadcastToCloud) {
        publishStateToCloud();
      }
    }

    // Розумне злиття даних, отриманих з іншого пристрою (телефону/ноутбука)
    function mergeRemotePayload(payload) {
      if (!payload || typeof payload !== 'object') return false;
      let changed = false;

      // 1. Злиття видалених персонажів (tombstones)
      if (payload.deletedChars && typeof payload.deletedChars === 'object') {
        Object.keys(payload.deletedChars).forEach(delId => {
          const delTime = Number(payload.deletedChars[delId]) || 0;
          const localDelTime = Number(state.deletedChars[delId]) || 0;
          if (delTime > localDelTime) {
            state.deletedChars[delId] = delTime;
          }
          const existingChar = state.characters[delId];
          if (existingChar && (Number(existingChar.updatedAt) || 0) <= state.deletedChars[delId]) {
            delete state.characters[delId];
            if (state.session.activeCharId === delId) {
              const rem = Object.values(state.characters).filter(c => !c.isNpc);
              state.session.activeCharId = rem.length > 0 ? rem[0].id : null;
            }
            changed = true;
          }
        });
      }

      // 2. Злиття персонажів за ID та часом оновлення (updatedAt)
      if (payload.characters && typeof payload.characters === 'object') {
        Object.keys(payload.characters).forEach(charId => {
          const incomingRaw = payload.characters[charId];
          if (!incomingRaw) return;
          const incoming = normalizeCharacter(incomingRaw);
          const delTime = Number(state.deletedChars[charId]) || 0;
          if (delTime >= incoming.updatedAt) return; // Персонаж був видалений

          const local = state.characters[charId];
          if (!local || incoming.updatedAt > (Number(local.updatedAt) || 0)) {
            state.characters[charId] = incoming;
            changed = true;
          } else if (local) {
            // Додатково об'єднуємо особистий журнал кидків персонажа
            const localLogs = Array.isArray(local.rollLog) ? local.rollLog : [];
            const incLogs = Array.isArray(incoming.rollLog) ? incoming.rollLog : [];
            if (incLogs.length > localLogs.length) {
              const seen = new Set(localLogs.map(l => l.id));
              incLogs.forEach(l => {
                if (l && l.id && !seen.has(l.id)) {
                  localLogs.push(l);
                  changed = true;
                }
              });
              local.rollLog = localLogs.sort((a, b) => String(b.id).localeCompare(String(a.id))).slice(0, 40);
            }
          }
        });
      }

      // 3. Злиття загального журналу кидків кампанії
      if (Array.isArray(payload.campaignRollLogs)) {
        const seenIds = new Set((state.campaignRollLogs || []).map(r => r?.id));
        let addedLog = false;
        payload.campaignRollLogs.forEach(r => {
          if (r && r.id && !seenIds.has(r.id)) {
            seenIds.add(r.id);
            state.campaignRollLogs.push(r);
            addedLog = true;
          }
        });
        if (addedLog) {
          state.campaignRollLogs.sort((a, b) => String(b.id).localeCompare(String(a.id)));
          state.campaignRollLogs = state.campaignRollLogs.slice(0, 80);
          changed = true;
        }
      }

      // 4. Злиття плейлиста та стану аудіо Майстра
      if (Array.isArray(payload.audioTracks)) {
        const localIds = new Set(state.audioTracks.map(t => t.id));
        payload.audioTracks.forEach(tr => {
          if (tr && tr.id && !tr.isLocalBlob && !localIds.has(tr.id)) {
            state.audioTracks.push(tr);
            changed = true;
          }
        });
      }

      if (payload.audioState && typeof payload.audioState === 'object') {
        const incAudioTime = Number(payload.audioState.updatedAt) || 0;
        const locAudioTime = Number(state.audioState.updatedAt) || 0;
        if (incAudioTime > locAudioTime) {
          const prevVol = state.audioState.volume;
          state.audioState = {
            ...payload.audioState,
            volume: prevVol
          };
          syncAudioFromState();
          changed = true;
        }
      }

      // Якщо Майстер увійшов на порожньому ноутбуці і щойно прийшли персонажі — обираємо першого
      if (state.session.loggedIn && state.session.role === 'gm' && !state.session.activeCharId) {
        const list = Object.values(state.characters).filter(c =>
          state.session.gmCategory === 'npcs' ? c.isNpc : !c.isNpc
        );
        if (list.length > 0) {
          state.session.activeCharId = list[0].id;
          changed = true;
        }
      }

      if (changed) {
        state.cloud.lastSyncTime = new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        saveDatabase(false);
        safeRenderApp();
      }
      return changed;
    }

    // Формування пакету для відправки в хмару
    function buildCloudPayload() {
      return {
        senderId: CLIENT_ID,
        sentAt: Date.now(),
        roomCode: state.roomCode,
        characters: state.characters,
        deletedChars: state.deletedChars,
        campaignRollLogs: state.campaignRollLogs,
        audioTracks: state.audioTracks.filter(t => !t.isLocalBlob),
        audioState: state.audioState
      };
    }

    function getRoomTopics() {
      const cleanRoom = (state.roomCode || DEFAULT_ROOM_CODE).trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_');
      return {
        stateTopic: `vitruvium_entropia_v9/${cleanRoom}/state`,
        pingTopic:  `vitruvium_entropia_v9/${cleanRoom}/ping`
      };
    }

    // Відправка даних через MQTT (Retained) + Firebase Realtime DB (якщо вказано)
    function publishStateToCloud() {
      const payload = buildCloudPayload();
      const jsonStr = JSON.stringify(payload);

      // 1. Відправка через MQTT з прапорцем retain: true (щоб нові пристрої одразу завантажували стан)
      if (mqttClient && mqttClient.connected) {
        const { stateTopic } = getRoomTopics();
        mqttClient.publish(stateTopic, jsonStr, { qos: 1, retain: true });
        state.cloud.lastSyncTime = new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      // 2. Якщо підключено Firebase Realtime Database URL — зберігаємо і туди
      if (state.firebaseDbUrl) {
        pushToFirebaseRest(payload);
      }
    }

    // Ініціалізація хмарного WebSocket-з'єднання
    function initCloudConnection() {
      if (typeof mqtt === 'undefined') {
        state.cloud.status = 'error';
        safeRenderApp();
        return;
      }

      if (mqttClient) {
        try { mqttClient.end(true); } catch (_) {}
      }

      const brokerUrl = MQTT_BROKERS[state.cloud.brokerIndex % MQTT_BROKERS.length];
      state.cloud.status = 'connecting';
      safeRenderApp();

      mqttClient = mqtt.connect(brokerUrl, {
        clientId: 'vitruv_' + CLIENT_ID + '_' + Math.floor(Math.random() * 9999),
        clean: true,
        connectTimeout: 6000,
        reconnectPeriod: 3500
      });

      mqttClient.on('connect', () => {
        state.cloud.status = 'online';
        const { stateTopic, pingTopic } = getRoomTopics();

        mqttClient.subscribe([stateTopic, pingTopic], { qos: 1 }, (err) => {
          if (!err) {
            // Запитуємо свіжий стан у всіх активних пристроїв у кімнаті
            mqttClient.publish(pingTopic, JSON.stringify({ senderId: CLIENT_ID, time: Date.now() }), { qos: 0 });
            // Якщо на цьому пристрої вже є персонажі — публікуємо їх у спільну кімнату
            if (Object.keys(state.characters).length > 0) {
              setTimeout(() => publishStateToCloud(), 350);
            }
          }
        });
        safeRenderApp();
      });

      mqttClient.on('message', (topic, messageBuffer) => {
        try {
          const text = messageBuffer.toString();
          if (!text) return;
          const data = JSON.parse(text);
          const { stateTopic, pingTopic } = getRoomTopics();

          if (topic === pingTopic) {
            // Інший пристрій (наприклад, ноутбук Майстра) щойно зайшов і просить скинути всіх персонажів
            if (data.senderId !== CLIENT_ID && Object.keys(state.characters).length > 0) {
              publishStateToCloud();
            }
            return;
          }

          if (topic === stateTopic && data) {
            mergeRemotePayload(data);
          }
        } catch (err) {
          console.warn('Помилка обробки мережевого пакету:', err);
        }
      });

      mqttClient.on('error', () => {
        state.cloud.brokerIndex = (state.cloud.brokerIndex + 1) % MQTT_BROKERS.length;
      });

      mqttClient.on('offline', () => {
        state.cloud.status = 'connecting';
        safeRenderApp();
      });
    }

    // Підтримка прямого посилання Firebase Realtime Database (REST JSON)
    async function pushToFirebaseRest(payload) {
      if (!state.firebaseDbUrl) return;
      try {
        const cleanUrl = state.firebaseDbUrl.replace(/\/+$/, '');
        const cleanRoom = (state.roomCode || DEFAULT_ROOM_CODE).trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_');
        await fetch(`${cleanUrl}/vitruvium_${cleanRoom}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.warn('Firebase REST push error:', e);
      }
    }

    async function pullFromFirebaseRest() {
      if (!state.firebaseDbUrl) return;
      try {
        const cleanUrl = state.firebaseDbUrl.replace(/\/+$/, '');
        const cleanRoom = (state.roomCode || DEFAULT_ROOM_CODE).trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_');
        const res = await fetch(`${cleanUrl}/vitruvium_${cleanRoom}.json`);
        if (res.ok) {
          const data = await res.json();
          if (data) mergeRemotePayload(data);
        }
      } catch (e) {
        console.warn('Firebase REST pull error:', e);
      }
    }

    function startFirebasePollingIfConfigured() {
      if (firebasePollInterval) clearInterval(firebasePollInterval);
      if (state.firebaseDbUrl) {
        pullFromFirebaseRest();
        firebasePollInterval = setInterval(pullFromFirebaseRest, 3500);
      }
    }

    window.forceCloudSyncNow = function() {
      if (mqttClient && mqttClient.connected) {
        const { pingTopic } = getRoomTopics();
        mqttClient.publish(pingTopic, JSON.stringify({ senderId: CLIENT_ID, time: Date.now() }));
        publishStateToCloud();
      } else {
        initCloudConnection();
      }
      if (state.firebaseDbUrl) {
        pullFromFirebaseRest();
      }
      safeRenderApp();
    };

      const roomEl = document.getElementById('cloudRoomInput');

    function getActiveCharacter() {
      const id = state.session.activeCharId;
      if (!id || !state.characters[id]) return null;
      state.characters[id] = normalizeCharacter(state.characters[id]);
      return state.characters[id];

    function touchCharacter(char) {
      if (char) char.updatedAt = Date.now();

    /********************************************************************
     * 5. ОБЧИСЛЕННЯ ПУЛУ КУБИКІВ, ТРАВМ ТА ОСОБИСТОГО ЖУРНАЛУ
     ********************************************************************/
    function getWoundCount(char, statId) {
      const arr = char?.wounds?.[statId] || [];
      return arr.filter(Boolean).length;
    }

    function getWoundPenalty(char, statId) {
      return Math.floor(getWoundCount(char, statId) / 2);
    }

    function isSkillApplied(sk) {
      if (!sk || sk.effectType === 'none') return false;
      if (sk.effectType === 'passive') return true;
      return !!sk.active;
    }

    function getActiveSkillModifiers(char, statId) {
      const list = (char?.skills || []).filter(sk =>
        isSkillApplied(sk) && (sk.statId === statId || sk.statId === 'any')
      );
      const diceMod = list.reduce((sum, sk) => sum + (Number(sk.diceMod) || 0), 0);
      const flatBonus = list.reduce((sum, sk) => sum + (Number(sk.flatBonus) || 0), 0);
      return { diceMod, flatBonus, activeSkills: list };
    }

    function getDicePoolForStat(char, statId, includeExtra = false) {
      if (!char) return 0;
      const base = Number(char.stats?.[statId] || 1);
      const penalty = getWoundPenalty(char, statId);
      const { diceMod } = getActiveSkillModifiers(char, statId);
      const extra = includeExtra ? (Number(state.diceRoller.extraDiceMod) || 0) : 0;
      return Math.max(0, base - penalty + diceMod + extra);
    }

    function getCurrentHealthStageName(char) {
      let stage = 'Здоровий';
      const maxCols = Number(char?.stats?.health || 1);
      HP_ROWS.forEach((rowName, rIdx) => {
        const anyChecked = (char?.hpGrid?.[rIdx] || []).slice(0, maxCols).some(Boolean);
        if (anyChecked) stage = rowName;
      });
      return stage;
    }

    function getPersonalRollLogs(char) {
      if (!char) return [];
      const directLogs = Array.isArray(char.rollLog) ? char.rollLog : [];
      const fromCampaign = (state.campaignRollLogs || []).filter(item =>
        item && (
          item.charId === char.id ||
          (item.charOwner && item.charOwner === char.owner) ||
          (item.charName && item.charName === char.name)
        )
      );

      const seenIds = new Set();
      const merged = [];

      [...directLogs, ...fromCampaign].forEach(item => {
        if (!item) return;
        const key = item.id || `${item.time}_${item.statName}_${item.totalScore}`;
        if (!seenIds.has(key)) {
          seenIds.add(key);
          merged.push(item);
        }
      });

      return merged.slice(0, 40);
    }

    /********************************************************************
     * 6. ОБРОБНИКИ ВХОДУ ТА ПЕРЕМИКАННЯ ВКЛАДОК
     ********************************************************************/
    window.selectLoginRole = function(role) {
      state.loginForm.role = role;
      state.loginForm.errorMsg = '';
      safeRenderApp();
    };

    window.handleLoginSubmit = function(event) {
      if (event) event.preventDefault();
      const { role } = state.loginForm;

      const roomEl = document.getElementById('loginRoomInput');
      const newRoom = (roomEl ? roomEl.value : state.loginForm.roomInput).trim().toLowerCase() || DEFAULT_ROOM_CODE;
      const roomChanged = newRoom !== state.roomCode;
      state.roomCode = newRoom;
      state.loginForm.roomInput = newRoom;

      if (roomChanged) {
        initCloudConnection();
        startFirebasePollingIfConfigured();
      }

      if (role === 'gm') {
        const passEl = document.getElementById('gmPasswordInput');
        const pass = (passEl ? passEl.value : state.loginForm.gmPasswordInput).trim().toLowerCase();

        if (pass !== GM_SECRET_PASSWORD) {
          state.loginForm.errorMsg = 'Невірний пароль Майстра!';
          safeRenderApp();
          return;
        }

        state.session.loggedIn = true;
        state.session.role = 'gm';
        state.session.loginName = 'Майстер (ЕНТРОПІЯ)';
        state.session.gmCategory = 'players';
        state.session.activeTab = 'all';

        const playerChars = Object.values(state.characters).filter(c => !c.isNpc);
        state.session.activeCharId = playerChars.length > 0 ? playerChars[0].id : null;
        state.loginForm.errorMsg = '';

        // Одразу опитуємо хмару, щоб підтягнути персонажів з телефонів гравців
        window.forceCloudSyncNow();
        safeRenderApp();
        return;
      }

      // Вхід Гравця
      const loginEl = document.getElementById('playerLoginInput');
      const charNameEl = document.getElementById('playerCharNameInput');
      const rawLogin = (loginEl ? loginEl.value : state.loginForm.loginInput).trim();
      const rawCharName = (charNameEl ? charNameEl.value : state.loginForm.charNameInput).trim();

      if (!rawLogin) {
        state.loginForm.errorMsg = 'Введіть ваш логін або позивний!';
        safeRenderApp();
        return;
      }

      const cleanKey = rawLogin.toLowerCase().replace(/\s+/g, '_');
      const charId = `entropia_player_${cleanKey}`;

      // Якщо цей ID був раніше видалений, але гравець створює заново — знімаємо мітку видалення
      if (state.deletedChars[charId]) {
        delete state.deletedChars[charId];
      }

      let existingId = state.characters[charId] ? charId : null;
      if (!existingId) {
        const found = Object.values(state.characters).find(
          c => !c.isNpc && String(c.owner).toLowerCase() === rawLogin.toLowerCase()
        );
        if (found) existingId = found.id;
      }

      const finalCharId = existingId || charId;

      if (!state.characters[finalCharId]) {
        const displayCharName = rawCharName || rawLogin;
        state.characters[finalCharId] = createBlankCharacter(finalCharId, rawLogin, displayCharName, false);
      } else if (rawCharName) {
        state.characters[finalCharId].name = rawCharName;
        touchCharacter(state.characters[finalCharId]);
      }

      state.session.loggedIn = true;
      state.session.role = 'player';
      state.session.loginName = rawLogin;
      state.session.activeCharId = finalCharId;
      state.session.activeTab = 'all';
      state.loginForm.errorMsg = '';

      saveDatabase(true);
      safeRenderApp();
    };

    /********************************************************************
     * 7. ДІЇ З ЛИСТОМ ПЕРСОНАЖА (УСІ ДІЇ МИТТЄВО СИНХРОНІЗУЮТЬСЯ В ХМАРУ)
     ********************************************************************/
    window.changeStat = function(statId, delta) {
      const char = getActiveCharacter();
      if (!char) return;
      const current = Number(char.stats[statId] || 1);
      const next = Math.min(6, Math.max(1, current + delta));
      char.stats[statId] = next;

      if (statId === 'health') {
        char.hpGrid = char.hpGrid.map(row =>
          row.map((val, cIdx) => (cIdx < next ? val : false))
        );
      }
      touchCharacter(char);
      saveDatabase(true);
      safeRenderApp();
    };

    window.toggleWoundCell = function(statId, cellIndex) {
      const char = getActiveCharacter();
      if (!char) return;
      char.wounds[statId][cellIndex] = !char.wounds[statId][cellIndex];
      touchCharacter(char);
      saveDatabase(true);
      safeRenderApp();
    };

    window.toggleHpCircle = function(rowIndex, colIndex) {
      const char = getActiveCharacter();
      if (!char) return;
      const maxCols = Number(char.stats.health || 1);
      if (colIndex >= maxCols) return;
      char.hpGrid[rowIndex][colIndex] = !char.hpGrid[rowIndex][colIndex];
      touchCharacter(char);
      saveDatabase(true);
      safeRenderApp();
    };

    window.stepHpDamage = function(addDamage = true) {
      const char = getActiveCharacter();
      if (!char) return;
      const maxCols = Number(char.stats.health || 1);

      if (addDamage) {
        for (let r = 0; r < HP_ROWS.length; r++) {
          for (let c = 0; c < maxCols; c++) {
            if (!char.hpGrid[r][c]) {
              char.hpGrid[r][c] = true;
              touchCharacter(char);
              saveDatabase(true);
              safeRenderApp();
              return;
            }
          }
        }
      } else {
        for (let r = HP_ROWS.length - 1; r >= 0; r--) {
          for (let c = maxCols - 1; c >= 0; c--) {
            if (char.hpGrid[r][c]) {
              char.hpGrid[r][c] = false;
              touchCharacter(char);
              saveDatabase(true);
              safeRenderApp();
              return;
            }
          }
        }
      }
    };

    window.updateTextField = function(field, value) {
      const char = getActiveCharacter();
      if (!char) return;
      char[field] = value;
      touchCharacter(char);
      saveDatabase(false);
      if (textSyncTimeout) clearTimeout(textSyncTimeout);
      textSyncTimeout = setTimeout(() => {

    // Натхнення 🌀
    window.gmModifyInspiration = function(charId, delta) {
      if (state.session.role !== 'gm') return;
      const char = state.characters[charId];
      if (!char) return;
      char.inspiration.count = Math.max(0, (char.inspiration.count || 0) + delta);
      touchCharacter(char);
      saveDatabase(true);
      safeRenderApp();
    };

    window.playerRequestInspiration = function() {
      const char = getActiveCharacter();
      if (!char) return;
      if ((char.inspiration.count || 0) <= 0) {
        alert('У вас немає доступних жетонів Натхнення (🌀). Їх видає Майстер.');
        return;
      }
      char.inspiration.pendingRequest = true;
      char.inspiration.lastStatus = 'pending';
      touchCharacter(char);
      saveDatabase(true);
      safeRenderApp();
    };

    window.gmResolveInspiration = function(charId, approve) {
      if (state.session.role !== 'gm') return;
      const char = state.characters[charId];
      if (!char) return;

      char.inspiration.pendingRequest = false;
      if (approve && char.inspiration.count > 0
